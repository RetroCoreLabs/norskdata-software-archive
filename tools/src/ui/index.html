<!DOCTYPE html>
<html lang="en" data-theme="dark" data-mode="local">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nd preserve</title>
<link rel="icon" href="/favicon.ico">
<style>
/* ================================================================
   Theme system -- semantic tokens
   ================================================================ */
:root {
  --bg:            var(--theme-bg);
  --bg-elev:       var(--theme-bg-elev);
  --bg-sunken:     var(--theme-bg-sunken);
  --text:          var(--theme-text);
  --text-muted:    var(--theme-text-muted);
  --border:        var(--theme-border);
  --accent:        var(--theme-accent);
  --accent-bg:     var(--theme-accent-bg);

  --ok:        var(--theme-green);     --ok-bg:        var(--theme-green-bg);
  --info:      var(--theme-blue);      --info-bg:      var(--theme-blue-bg);
  --warn:      var(--theme-orange);    --warn-bg:      var(--theme-orange-bg);
  --tag-product: var(--theme-blue);    --tag-product-bg: var(--theme-blue-bg);
  --tag-os:      var(--theme-teal);    --tag-os-bg:      var(--theme-teal-bg);
  --tag-patch:   var(--theme-purple);  --tag-patch-bg:   var(--theme-purple-bg);
}

:root, [data-theme="dark"] {
  --theme-bg:         #1a1a2e;
  --theme-bg-elev:    #16213e;
  --theme-bg-sunken:  #0f0f1e;
  --theme-text:       #e0e0e0;
  --theme-text-muted: #9090a8;
  --theme-border:     #2a3a5e;
  --theme-accent:     #4a8de8;
  --theme-accent-bg:  #1a2840;
  --theme-blue:    #5a9ee8;  --theme-blue-bg:    #1a2a4a;
  --theme-teal:    #4fb8c4;  --theme-teal-bg:    #15363a;
  --theme-green:   #5cb85c;  --theme-green-bg:   #1a3a1f;
  --theme-purple:  #b07ad0;  --theme-purple-bg:  #2e1a3a;
  --theme-orange:  #ff8a3d;  --theme-orange-bg:  #3a2010;
}

[data-theme="light"] {
  --theme-bg:         #fbfaf6;
  --theme-bg-elev:    #ffffff;
  --theme-bg-sunken:  #f0eee9;
  --theme-text:       #1a1a1a;
  --theme-text-muted: #6a6a6a;
  --theme-border:     #d0cdc4;
  --theme-accent:     #0D47A1;
  --theme-accent-bg:  #E3F2FD;
  --theme-blue:   #0D47A1;  --theme-blue-bg:   #E3F2FD;
  --theme-teal:   #00838F;  --theme-teal-bg:   #E0F7FA;
  --theme-green:  #2E7D32;  --theme-green-bg:  #E8F5E9;
  --theme-purple: #7B1FA2;  --theme-purple-bg: #F3E5F5;
  --theme-orange: #E65100;  --theme-orange-bg: #FFF3E0;
}

/* ================================================================
   Reset + base
   ================================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre { font-family: 'Consolas', 'Courier New', monospace; }

/* ================================================================
   Layout: header, main, footer
   ================================================================ */
.nd-header {
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  padding: 0 1.5rem;
  display: flex;
  align-items: center;
  gap: 1.5rem;
  height: 3.25rem;
  flex-shrink: 0;
}

.nd-logo {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  text-decoration: none;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
  letter-spacing: 0.02em;
}

/* ND's own logo. The artwork is black on
   transparent, so on a dark header it is inverted to stay visible. */
.nd-logo-img {
  height: 26px;
  width: auto;
  display: block;
}
html[data-theme="dark"] .nd-logo-img,
:root:not([data-theme="light"]) .nd-logo-img {
  filter: invert(1) brightness(1.6);
}
html[data-theme="light"] .nd-logo-img {
  filter: none;
}

.nd-nav {
  display: flex;
  gap: 0;
  flex: 1;
  overflow-x: auto;
}

.nd-nav-link {
  display: inline-flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 1rem;
  height: 3.25rem;
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
  text-decoration: none;
  line-height: 1.2;
}

.nd-nav-link small {
  font-size: 0.65rem;
  font-weight: 400;
  opacity: 0.7;
}

.nd-nav-label {
  font-size: 0.85rem;
}

.nd-nav-link:hover {
  color: var(--text);
  text-decoration: none;
}

.nd-nav-link.nd-active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.nd-nav-sep {
  width: 1px;
  height: 1.5rem;
  background: var(--border);
  align-self: center;
  margin: 0 0.25rem;
}

.nd-theme-toggle {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 0.35rem 0.5rem;
  font-size: 1rem;
  line-height: 1;
  transition: color 0.15s, border-color 0.15s;
  flex-shrink: 0;
}

.nd-theme-toggle:hover {
  color: var(--text);
  border-color: var(--text-muted);
}

.nd-main {
  flex: 1;
  padding: 1.5rem;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
}

.nd-view {
  min-height: 300px;
}

.nd-footer {
  background: var(--bg-sunken);
  border-top: 1px solid var(--border);
  padding: 0.4rem 1.5rem;
  font-size: 0.8rem;
  color: var(--text-muted);
  flex-shrink: 0;
}

/* ================================================================
   Local/public mode split
   ================================================================ */
[data-mode="public"] .nd-write-only { display: none; }
[data-mode="local"] .nd-public-only { display: none; }

/* ================================================================
   Component: nd-card
   ================================================================ */
.nd-card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.25rem;
  margin-bottom: 1rem;
}

.nd-card h3 {
  color: var(--accent);
  margin-bottom: 0.75rem;
  font-size: 1.1rem;
}

/* ================================================================
   Component: nd-badge
   ================================================================ */
.nd-badge {
  display: inline-block;
  padding: 0.1rem 0.5rem;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 600;
  background: var(--accent-bg);
  color: var(--accent);
  border: 1px solid var(--accent);
}

.nd-badge-ok      { background: var(--ok-bg);   color: var(--ok);   border-color: var(--ok); }
.nd-badge-info    { background: var(--info-bg);  color: var(--info); border-color: var(--info); }
.nd-badge-warn    { background: var(--warn-bg);  color: var(--warn); border-color: var(--warn); }
.nd-badge-product { background: var(--tag-product-bg); color: var(--tag-product); border-color: var(--tag-product); }
.nd-badge-os      { background: var(--tag-os-bg);      color: var(--tag-os);      border-color: var(--tag-os); }
.nd-badge-patch   { background: var(--tag-patch-bg);   color: var(--tag-patch);   border-color: var(--tag-patch); }

/* ================================================================
   Component: nd-btn
   ================================================================ */
.nd-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.5rem 1rem;
  border: 1px solid var(--border);
  background: var(--bg-elev);
  color: var(--text);
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 500;
  transition: background 0.15s, border-color 0.15s;
}

.nd-btn:hover {
  border-color: var(--accent);
}

.nd-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.nd-btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
}

.nd-btn-primary:hover {
  opacity: 0.9;
}

.nd-btn-ghost {
  background: var(--bg-elev);
  border-color: var(--border);
  color: var(--text);
}

.nd-btn-ghost:hover {
  color: var(--text);
  border-color: var(--accent);
  background: var(--accent-bg);
}

/* ================================================================
   Component: nd-table
   ================================================================ */
.nd-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}

.nd-table th {
  background: var(--accent-bg);
  color: var(--accent);
  padding: 0.5rem 0.6rem;
  text-align: left;
  border-bottom: 2px solid var(--accent);
  white-space: nowrap;
  font-weight: 600;
}

.nd-table td {
  padding: 0.4rem 0.6rem;
  border-bottom: 1px solid var(--border);
  word-break: break-word;
}

.nd-table tr:hover td {
  background: var(--accent-bg);
}

/* ================================================================
   Component: nd-input, nd-select
   ================================================================ */
.nd-input, .nd-select {
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.5rem 0.75rem;
  border-radius: 6px;
  font-size: 0.9rem;
  width: 100%;
}

.nd-input:focus, .nd-select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-bg);
}

/* ================================================================
   Component: nd-tag
   ================================================================ */
.nd-tag {
  display: inline-flex;
  align-items: center;
  padding: 0.15rem 0.6rem;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 600;
  gap: 0.25rem;
}

.nd-tag-product { background: var(--tag-product-bg); color: var(--tag-product); }
.nd-tag-os      { background: var(--tag-os-bg);      color: var(--tag-os); }
.nd-tag-patch   { background: var(--tag-patch-bg);    color: var(--tag-patch); }

/* ================================================================
   Component: nd-stat
   ================================================================ */
.nd-stat {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem;
  text-align: center;
}

.nd-stat-value {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--accent);
}

.nd-stat-label {
  font-size: 0.8rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* ================================================================
   Component: nd-placeholder
   ================================================================ */
.nd-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 300px;
  color: var(--text-muted);
  text-align: center;
}

.nd-placeholder h2 {
  font-size: 1.4rem;
  color: var(--text);
  margin-bottom: 0.5rem;
}

.nd-placeholder p {
  font-size: 0.95rem;
}

/* ================================================================
   Dashboard
   ================================================================ */
.nd-hero-stats {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
}

.nd-stat {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem 1.5rem;
  text-align: center;
  min-width: 120px;
  flex: 1;
}

.nd-stat-value {
  font-size: 2rem;
  font-weight: 700;
  font-family: 'Consolas', 'Courier New', monospace;
  line-height: 1.2;
  color: var(--text);
}

.nd-stat-ok .nd-stat-value { color: var(--ok); }
.nd-stat-warn .nd-stat-value { color: var(--warn); }

.nd-stat-label {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 0.25rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.nd-dash-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.nd-queue-piles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
}

.nd-queue-pile {
  display: block;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem;
  text-decoration: none;
  transition: border-color 0.15s, background 0.15s;
}

.nd-queue-pile:hover {
  border-color: var(--accent);
  background: var(--bg-elev);
  text-decoration: none;
}

.nd-queue-count {
  font-size: 1.8rem;
  font-weight: 700;
  font-family: 'Consolas', 'Courier New', monospace;
  color: var(--text);
  line-height: 1.2;
}

.nd-queue-title {
  margin-top: 0.4rem;
}

.nd-queue-desc {
  font-size: 0.8rem;
  margin-top: 0.3rem;
  line-height: 1.3;
}

.nd-table-compact {
  font-size: 0.85rem;
}

.nd-table-compact td, .nd-table-compact th {
  padding: 0.3rem 0.6rem;
}

/* Heading row above the volumes of one backup set in the catalog listing. */
.nd-setrow td {
  background: var(--accent-bg);
  border-top: 2px solid var(--accent);
  padding-top: 0.5rem;
  padding-bottom: 0.5rem;
}

.nd-setname {
  font-weight: 600;
  color: var(--accent);
}

.nd-setfacts {
  color: var(--text-muted);
  font-weight: normal;
  font-size: 0.8rem;
  margin-left: 0.6rem;
}

.nd-bar {
  height: 6px;
  background: var(--accent);
  border-radius: 3px;
  min-width: 2px;
  opacity: 0.7;
}

.nd-clickable {
  cursor: pointer;
}

.nd-clickable:hover {
  background: var(--bg-sunken);
}

.nd-text-muted {
  color: var(--text-muted);
}

.nd-ft-grid {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.nd-ft-item {
  display: grid;
  grid-template-columns: 4rem 1fr 3rem;
  gap: 0.5rem;
  align-items: center;
  font-size: 0.85rem;
}

.nd-ft-name {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.nd-ft-bar-wrap {
  height: 6px;
  background: var(--bg-sunken);
  border-radius: 3px;
  overflow: hidden;
}

.nd-ft-bar {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  opacity: 0.7;
}

.nd-ft-count {
  text-align: right;
  font-size: 0.8rem;
  color: var(--text-muted);
  font-family: 'Consolas', 'Courier New', monospace;
}

/* ================================================================
   Matcher
   ================================================================ */
.nd-matcher-modes {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}

.nd-match-tab {
  text-decoration: none;
  padding: 0.4rem 0.1rem;
  border-bottom: 2px solid transparent;
  transition: border-color 0.15s;
}

.nd-match-tab:hover { text-decoration: none; }
.nd-match-tab.nd-active { border-bottom-color: var(--accent); }

.nd-matcher-toolbar {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0.75rem;
  flex-wrap: wrap;
}

.nd-matcher-select-all {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.85rem;
  color: var(--text-muted);
  cursor: pointer;
}

.nd-matcher-body {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 1rem;
  align-items: start;
}

.nd-matcher-list {
  overflow-x: auto;
}

.nd-matcher-detail {
  position: sticky;
  top: 1rem;
}

.nd-match-disk-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.3rem 0.6rem;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 0.85rem;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}

.nd-match-disk-chip:hover {
  border-color: var(--accent);
  background: var(--accent-bg);
}

.nd-match-table tbody tr {
  cursor: pointer;
  transition: background 0.1s;
}

.nd-match-table tbody tr:hover {
  background: var(--bg-sunken);
}

.nd-match-table tbody tr.nd-row-active {
  background: var(--accent-bg);
  border-left: 3px solid var(--accent);
}

.nd-conf-high { color: var(--ok); font-weight: 600; }
.nd-conf-mid { color: var(--warn); }
.nd-conf-low { color: var(--text-muted); }

.nd-matcher-pager {
  margin-top: 1rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.nd-dl {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0.25rem 0.75rem;
  font-size: 0.85rem;
}

.nd-dl dt {
  color: var(--text-muted);
  white-space: nowrap;
}

.nd-dl dd {
  word-break: break-all;
}

/* ================================================================
   Catalog
   ================================================================ */
.nd-catalog-search {
  display: flex;
  gap: 0.75rem;
  align-items: center;
  margin-bottom: 1rem;
}

.nd-catalog-search .nd-input {
  max-width: 400px;
}

.nd-filter-chips {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}

.nd-chip {
  display: inline-flex;
  align-items: center;
  padding: 0.2rem 0.65rem;
  border-radius: 16px;
  font-size: 0.78rem;
  font-weight: 500;
  background: var(--bg-sunken);
  color: var(--text-muted);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
  white-space: nowrap;
}

.nd-chip:hover {
  border-color: var(--accent);
  color: var(--text);
}

.nd-chip.nd-chip-active {
  background: var(--accent-bg);
  color: var(--accent);
  border-color: var(--accent);
}

/* ================================================================
   Product detail
   ================================================================ */
.nd-product-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}

.nd-product-header h2 {
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 1.4rem;
  color: var(--accent);
}

.nd-product-header .nd-product-name {
  font-size: 1.1rem;
  color: var(--text);
}

.nd-version-section {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 1rem;
  overflow: hidden;
}

.nd-version-section summary {
  padding: 0.75rem 1rem;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.95rem;
  background: var(--bg-sunken);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.nd-version-section summary:hover {
  background: var(--accent-bg);
}

.nd-version-section[open] summary {
  border-bottom-color: var(--accent);
}

.nd-disk-grid {
  padding: 1rem;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1rem;
}

.nd-lang-group h4 {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.nd-disk-card {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.4rem 0.6rem;
  border-radius: 6px;
  font-size: 0.85rem;
  transition: background 0.1s;
}

.nd-disk-card:hover {
  background: var(--accent-bg);
}

.nd-disk-card a {
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 0.82rem;
}

.nd-photo-dot {
  font-size: 0.7rem;
}

.nd-photo-dot-yes { color: var(--ok); }
.nd-photo-dot-no { color: var(--text-muted); }

/* ================================================================
   Floppy detail
   ================================================================ */
.nd-floppy-header {
  margin-bottom: 1rem;
}

.nd-floppy-header h2 {
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 1.5rem;
  color: var(--text);
  margin-bottom: 0.5rem;
}

.nd-floppy-badges {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  margin-bottom: 0.75rem;
}

.nd-quick-stats {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
}

.nd-quick-stat {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.5rem 0.75rem;
  text-align: center;
  min-width: 80px;
}

.nd-quick-stat-val {
  font-size: 1.1rem;
  font-weight: 700;
  font-family: 'Consolas', 'Courier New', monospace;
  color: var(--text);
}

.nd-quick-stat-lbl {
  font-size: 0.72rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.nd-ndfs-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.84rem;
  margin-bottom: 1.5rem;
}

.nd-ndfs-table th {
  background: var(--accent-bg);
  color: var(--accent);
  padding: 0.45rem 0.6rem;
  text-align: left;
  border-bottom: 2px solid var(--accent);
  white-space: nowrap;
  font-weight: 600;
  font-size: 0.8rem;
}

.nd-ndfs-table td {
  padding: 0.35rem 0.6rem;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

.nd-ndfs-table tr:hover td {
  background: var(--accent-bg);
}

.nd-ndfs-table .nd-date-null {
  color: var(--text-muted);
  font-style: italic;
}

.nd-ndfs-user-header td {
  background: var(--bg-sunken);
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--text-muted);
  padding: 0.3rem 0.6rem;
  border-bottom: 1px solid var(--border);
}

.nd-type-badge {
  display: inline-block;
  padding: 0.05rem 0.4rem;
  border-radius: 3px;
  font-size: 0.72rem;
  font-weight: 600;
  font-family: 'Consolas', 'Courier New', monospace;
}

.nd-type-BPUN { background: var(--info-bg); color: var(--info); }
.nd-type-PROG { background: var(--tag-os-bg); color: var(--tag-os); }
.nd-type-DATA { background: var(--ok-bg); color: var(--ok); }
.nd-type-TEST { background: var(--warn-bg); color: var(--warn); }
.nd-type-SYMB { background: var(--tag-patch-bg); color: var(--tag-patch); }
.nd-type-HELP { background: var(--info-bg); color: var(--info); }
.nd-type-ERR  { background: var(--warn-bg); color: var(--warn); }
.nd-type-INIT { background: var(--ok-bg); color: var(--ok); }
.nd-type-default { background: var(--bg-sunken); color: var(--text-muted); }

.nd-photo-thumb {
  max-width: 300px;
  border-radius: 6px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: transform 0.2s;
}

.nd-photo-thumb:hover {
  transform: scale(1.02);
}

.nd-modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.nd-modal {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 90%;
  max-width: 600px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.nd-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--border);
}

.nd-modal-header h3 {
  margin: 0;
  color: var(--accent);
}

.nd-modal-close {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 1.5rem;
  cursor: pointer;
  padding: 0 0.25rem;
  line-height: 1;
}

.nd-modal-close:hover {
  color: var(--text);
}

.nd-modal-body {
  padding: 1rem 1.25rem;
  overflow-y: auto;
  flex: 1;
}

.nd-modal-wide {
  max-width: 1000px;
  width: 90%;
  max-height: 90vh;
}

.nd-modal-photo {
  background: transparent;
  border: none;
  box-shadow: none;
  max-width: none;
  width: auto;
  cursor: pointer;
}

.nd-pv-close {
  position: absolute;
  top: 18px;
  right: 22px;
  z-index: 2002;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.4);
  background: rgba(0, 0, 0, 0.7);
  color: #fff;
  font-size: 1.8rem;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, border-color 0.15s;
}

.nd-pv-close:hover {
  background: rgba(0, 0, 0, 0.9);
  border-color: #fff;
}

.nd-modal-photo img {
  max-width: 90vw;
  max-height: 90vh;
  border-radius: 8px;
}

/* NDFS Viewer styles */
.ndfs-viewer-header {
  padding: 0.5rem 1rem;
  border-bottom: 1px solid var(--border);
  font-size: 0.82rem;
  color: var(--text-muted);
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
}

.ndfs-viewer-layout {
  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

.ndfs-user-panel {
  width: 180px;
  min-width: 140px;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 0.5rem 0;
  flex-shrink: 0;
}

.ndfs-user-panel h4 {
  margin: 0 0 0.25rem 0;
  padding: 0 0.75rem;
  font-size: 0.75rem;
  text-transform: uppercase;
  color: var(--text-muted);
  letter-spacing: 0.05em;
}

.ndfs-user-item {
  padding: 0.35rem 0.75rem;
  cursor: pointer;
  font-size: 0.82rem;
  border-left: 3px solid transparent;
  transition: background 0.15s;
}

.ndfs-user-item:hover {
  background: var(--accent-bg);
}

.ndfs-user-item.ndfs-user-active {
  background: var(--accent-bg);
  border-left-color: var(--accent);
  color: var(--accent);
}

.ndfs-user-item .ndfs-user-count {
  font-size: 0.72rem;
  color: var(--text-muted);
}

.ndfs-file-panel {
  flex: 1;
  overflow: auto;
  min-width: 0;
}

.ndfs-file-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
}

.ndfs-file-table th {
  position: sticky;
  top: 0;
  background: var(--bg-elev);
  text-align: left;
  padding: 0.4rem 0.5rem;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  color: var(--text-muted);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.ndfs-file-table td {
  padding: 0.3rem 0.5rem;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

.ndfs-file-table tr:hover {
  background: var(--accent-bg);
}

.ndfs-file-table tr.ndfs-file-selected {
  background: var(--accent-bg);
}

/* The same selection highlight for the DOS and backup viewers, which use
   .nd-table rather than .ndfs-file-table. Without this the row carried the
   class but showed nothing, so a selected file was invisible. */
tr.ndfs-file-selected,
.nd-table tbody tr.ndfs-file-selected {
  background: var(--accent-bg);
  box-shadow: inset 3px 0 0 var(--accent);
}
.nd-table tbody tr[data-idx]:hover,
.nd-table tbody tr[data-file]:hover { background: var(--bg-elev); }

.ndfs-file-actions {
  padding: 0.5rem 0.75rem;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  align-items: center;
}

.ndfs-file-actions .nd-btn {
  font-size: 0.75rem;
  padding: 0.2rem 0.5rem;
}

.ndfs-file-actions .ndfs-selected-label {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-right: auto;
}

.ndfs-hex-view {
  font-family: 'Courier New', monospace;
  font-size: 0.72rem;
  white-space: pre;
  overflow: auto;
  max-height: 400px;
  padding: 0.75rem;
  background: var(--bg-sunken);
  border-radius: 4px;
  line-height: 1.4;
}

.ndfs-text-view {
  font-family: 'Courier New', monospace;
  font-size: 0.78rem;
  white-space: pre-wrap;
  word-break: break-all;
  overflow: auto;
  max-height: 400px;
  padding: 0.75rem;
  background: var(--bg-sunken);
  border-radius: 4px;
  line-height: 1.4;
}

.ndfs-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3rem;
  color: var(--text-muted);
  gap: 0.75rem;
}

.ndfs-spinner {
  width: 28px;
  height: 28px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: ndfs-spin 0.7s linear infinite;
}

@keyframes ndfs-spin {
  to { transform: rotate(360deg); }
}

.nd-details-toggle {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 1rem;
  overflow: hidden;
}

.nd-details-toggle summary {
  padding: 0.6rem 1rem;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--text-muted);
}

.nd-details-toggle summary:hover {
  color: var(--text);
}

.nd-details-toggle .nd-details-body {
  padding: 0 1rem 1rem 1rem;
}

.nd-copyable {
  position: relative;
  display: inline-block;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.2rem 0.5rem;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 0.8rem;
  cursor: pointer;
  word-break: break-all;
  transition: border-color 0.15s;
}

.nd-copyable:hover {
  border-color: var(--accent);
}

.nd-copyable::after {
  content: ' [copy]';
  font-size: 0.7rem;
  color: var(--text-muted);
}

.nd-floppy-nav {
  display: flex;
  gap: 1rem;
  align-items: center;
  margin-top: 1.5rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}

.nd-label-pre {
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.75rem 1rem;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 0.85rem;
  white-space: pre-wrap;
  margin-top: 0.5rem;
}

/* ================================================================
   Responsive
   ================================================================ */
@media (max-width: 768px) {
  .nd-header {
    flex-wrap: wrap;
    height: auto;
    padding: 0.75rem 1rem;
    gap: 0.5rem;
  }

  .nd-nav {
    order: 3;
    width: 100%;
    overflow-x: auto;
  }

  .nd-nav-link {
    height: auto;
    padding: 0.5rem 0.75rem;
  }

  .nd-main {
    padding: 1rem;
  }

  .nd-dash-grid {
    grid-template-columns: 1fr;
  }

  .nd-queue-piles {
    grid-template-columns: 1fr;
  }

  .nd-hero-stats {
    gap: 0.5rem;
  }

  .nd-stat {
    min-width: 80px;
    padding: 0.75rem 1rem;
  }

  .nd-stat-value {
    font-size: 1.5rem;
  }

  .nd-matcher-body {
    grid-template-columns: 1fr;
  }

  .nd-matcher-detail {
    position: static;
  }
}

/* ================================================================
   Spinner (utility)
   ================================================================ */
.nd-spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid var(--border);
  border-radius: 50%;
  border-top-color: var(--accent);
  animation: nd-spin 0.6s linear infinite;
}

@keyframes nd-spin { to { transform: rotate(360deg); } }

/* ================================================================
   Import screen
   ================================================================ */
.nd-import-modes {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1.25rem;
}

.nd-import-tab {
  text-decoration: none;
  padding: 0.4rem 0.1rem;
  border-bottom: 2px solid transparent;
  transition: border-color 0.15s;
  cursor: pointer;
  color: var(--text-muted);
  font-weight: 500;
  font-size: 0.9rem;
}

.nd-import-tab:hover { text-decoration: none; color: var(--text); }
.nd-import-tab.nd-active { border-bottom-color: var(--accent); color: var(--accent); }

.nd-import-form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
  margin-bottom: 1rem;
}

.nd-import-form-full {
  grid-column: 1 / -1;
}

.nd-import-form label {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.nd-import-form label > span {
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: 0.75rem;
}

.nd-import-check {
  flex-direction: row !important;
  align-items: center;
  gap: 0.5rem !important;
  cursor: pointer;
}

.nd-drop-zone {
  border: 2px dashed var(--border);
  border-radius: 8px;
  padding: 2rem;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  color: var(--text-muted);
  margin-bottom: 1rem;
}

.nd-drop-zone:hover,
.nd-drop-zone.nd-drag-over {
  border-color: var(--accent);
  background: var(--accent-bg);
}

.nd-drop-zone input[type="file"] {
  display: none;
}

.nd-import-results {
  margin-top: 1rem;
}

.nd-import-results .nd-card {
  margin-bottom: 0.75rem;
}

.nd-import-actions {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  margin-top: 1.25rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}

.nd-folder-browser {
  max-height: 400px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.nd-folder-list {
  overflow-y: auto;
  max-height: 280px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg-sunken);
}

.nd-folder-item {
  padding: 0.4rem 0.75rem;
  cursor: pointer;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 0.85rem;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}

.nd-folder-item:last-child {
  border-bottom: none;
}

.nd-folder-item:hover {
  background: var(--accent-bg);
  color: var(--accent);
}

.nd-folder-parent {
  font-weight: 600;
  color: var(--text-muted);
}

.nd-btn-sm {
  padding: 0.3rem 0.6rem;
  font-size: 0.8rem;
}

.nd-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.8rem;
  height: 1.8rem;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.9rem;
  text-decoration: none;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}

.nd-icon-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-bg);
  text-decoration: none;
}

.nd-import-log {
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.75rem 1rem;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 0.82rem;
  max-height: 200px;
  overflow-y: auto;
  margin-top: 0.75rem;
  white-space: pre-wrap;
}

/* ================================================================
   Actions / Git staging screen
   ================================================================ */
.nd-actions-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

@media (max-width: 800px) {
  .nd-actions-grid { grid-template-columns: 1fr; }
}

.nd-actions-grid .nd-card { margin-bottom: 0; }

.nd-file-group { margin-bottom: 1rem; }
.nd-file-group h4 {
  font-size: 0.85rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 0.4rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.nd-file-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.nd-file-list li {
  padding: 0.3rem 0.5rem;
  font-size: 0.82rem;
  font-family: 'Consolas', 'Courier New', monospace;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.nd-file-list li:last-child { border-bottom: none; }

.nd-action-log {
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.75rem 1rem;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 0.82rem;
  max-height: 300px;
  overflow-y: auto;
  white-space: pre-wrap;
  margin-top: 0.75rem;
}

.nd-diff-output {
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.75rem 1rem;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 0.8rem;
  max-height: 400px;
  overflow-y: auto;
  white-space: pre-wrap;
  margin-top: 0.75rem;
}

.nd-commit-input {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.75rem;
}

.nd-commit-input .nd-input { flex: 1; }

.nd-action-btns {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-top: 0.75rem;
}

/* Matcher disk chip: the checkbox, the name and the discard control are three
   separate hit areas. The chip used to be a <label>, which meant clicking the
   name toggled the checkbox and the disk could never be opened. */
.nd-match-disk-chip { display: inline-flex; align-items: center; gap: 0.35rem; }
.nd-dos-row:hover { background: var(--bg-elev); }
.nd-dos-crumb { color: var(--accent); text-decoration: none; }
.nd-dos-crumb:hover { text-decoration: underline; }
.nd-disk-open {
  background: none;
  border: 0;
  padding: 0;
  color: var(--accent);
  cursor: pointer;
  font: inherit;
}
.nd-disk-open:hover code, .nd-disk-open:focus-visible code { text-decoration: underline; }
.nd-disk-discard {
  background: none;
  border: 0;
  padding: 0 0.15rem;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.85rem;
  line-height: 1;
}
.nd-disk-discard:hover, .nd-disk-discard:focus-visible { color: var(--err, #ff6b6b); }

.nd-btn-danger {
  background: var(--warn-bg);
  border-color: var(--warn);
  color: var(--warn);
}

.nd-btn-danger:hover { opacity: 0.85; }

.nd-footer-changes {
  color: var(--warn);
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  margin-left: 0.5rem;
}

.nd-footer-changes:hover {
  text-decoration: underline;
}

/* ================================================================
   Metadata editor (floppy detail)
   ================================================================ */
.nd-edit-section {
  margin-top: 1rem;
}

.nd-edit-section h4 {
  color: var(--accent);
  margin-bottom: 0.5rem;
  font-size: 0.9rem;
}

.nd-tag-chips {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  margin-bottom: 0.5rem;
}

.nd-tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.2rem 0.6rem;
  border-radius: 16px;
  font-size: 0.78rem;
  font-weight: 500;
  background: var(--accent-bg);
  color: var(--accent);
  border: 1px solid var(--accent);
  cursor: pointer;
  transition: background 0.15s;
}

.nd-tag-chip:hover {
  background: var(--warn-bg);
  border-color: var(--warn);
  color: var(--warn);
}

.nd-tag-chip .nd-tag-x {
  font-size: 0.7rem;
  opacity: 0.7;
}

.nd-add-row {
  display: flex;
  gap: 0.4rem;
  margin-bottom: 0.5rem;
}

.nd-add-row .nd-input { flex: 1; font-size: 0.82rem; padding: 0.3rem 0.5rem; }
.nd-add-row .nd-btn { font-size: 0.78rem; padding: 0.3rem 0.6rem; }

.nd-edit-fields {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0.4rem 0.75rem;
  align-items: center;
  font-size: 0.85rem;
}

.nd-edit-fields label {
  color: var(--text-muted);
  font-weight: 500;
  white-space: nowrap;
}

.nd-edit-fields .nd-input {
  font-size: 0.82rem;
  padding: 0.3rem 0.5rem;
}

.nd-url-entry {
  display: flex;
  gap: 0.4rem;
  align-items: center;
  margin-bottom: 0.3rem;
}

.nd-url-entry .nd-input { flex: 1; font-size: 0.82rem; padding: 0.3rem 0.5rem; }

.nd-drop-zone {
  border: 2px dashed var(--border);
  border-radius: 8px;
  padding: 1.5rem;
  text-align: center;
  color: var(--text-muted);
  margin-top: 0.75rem;
  transition: border-color 0.2s, background 0.2s;
}

.nd-drop-zone:hover,
.nd-drop-zone.nd-dragover {
  border-color: var(--accent);
  background: var(--accent-bg);
}

.nd-drop-zone input[type="file"] {
  display: none;
}

/* Help page typography. The global reset (* { margin:0; padding:0 }) strips list
   indentation, which left bullets/numbers flush against the card edge. Restore a
   comfortable, well-indented layout -- scoped to .nd-help so nothing else moves. */
.nd-help h2 { margin-bottom: 0.4rem; }
.nd-help .nd-card { padding: 1.25rem 1.5rem; }
.nd-help .nd-card h3 { margin-bottom: 0.75rem; }
.nd-help .nd-card h4 { margin: 1.1rem 0 0.4rem; font-size: 0.95rem; color: var(--text); }
.nd-help p { line-height: 1.6; margin-bottom: 0.6rem; }
.nd-help p:last-child { margin-bottom: 0; }
.nd-help ol, .nd-help ul { padding-left: 2.25rem; margin: 0.4rem 0 0.4rem; }
.nd-help ol { list-style: decimal; }
.nd-help ul { list-style: disc; }
.nd-help li { margin-bottom: 0.5rem; line-height: 1.6; padding-left: 0.4rem; }
.nd-help li:last-child { margin-bottom: 0; }

<script>
(function() {
  'use strict';

  // ==============================================================
  // Theme system
  // ==============================================================
  var html = document.documentElement;
  var themeBtn = document.getElementById('nd-theme-toggle');
  var THEME_KEY = 'nd-theme';

  function getPreferredTheme() {
    var stored = localStorage.getItem(THEME_KEY);
    if (stored === 'dark' || stored === 'light') return stored;
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
    return 'dark';
  }

  function applyTheme(theme) {
    html.setAttribute('data-theme', theme);
    themeBtn.textContent = theme === 'dark' ? '\u263E' : '\u2600';
    themeBtn.title = 'Switch to ' + (theme === 'dark' ? 'light' : 'dark') + ' theme';
  }

  function toggleTheme() {
    var current = html.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
    updateStatusBar();
  }

  applyTheme(getPreferredTheme());
  themeBtn.addEventListener('click', toggleTheme);

  // ==============================================================
  // Hash router
  // ==============================================================
  var routes = {
    read: {
      '':             { title: 'Dashboard',  render: renderDashboard },
      'dashboard':    { title: 'Dashboard',  render: renderDashboard },
      'catalog':      { title: 'Catalog',    render: renderCatalog },
      'products':     { title: 'Products',   render: renderProducts },
      'products/:id': { title: 'Product',    render: renderProductDetail },
      'disks/:id':    { title: 'Floppy',     render: renderFloppyDetail },
      'help':         { title: 'Help',       render: renderHelp }
    },
    write: {
      'categories':   { title: 'Categories', render: renderCategories },
      'match':        { title: 'Matcher',    render: renderMatcher },
      'import':       { title: 'Import',     render: renderImport },
      'changes':      { title: 'Changes',    render: renderActions },
      'reads':        { title: 'Reads',      render: renderReadGroups }
    }
  };

  // Flatten routes into a lookup array with pattern info
  var routeList = [];
  ['read', 'write'].forEach(function(group) {
    Object.keys(routes[group]).forEach(function(pattern) {
      var parts = pattern.split('/');
      var paramNames = [];
      var regexParts = parts.map(function(p) {
        if (p.charAt(0) === ':') {
          paramNames.push(p.substring(1));
          return '([^/]+)';
        }
        return p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      });
      var regex = new RegExp('^' + regexParts.join('/') + '$');
      routeList.push({
        pattern: pattern,
        regex: regex,
        paramNames: paramNames,
        group: group,
        route: routes[group][pattern]
      });
    });
  });

  // Sort so that literal routes match before parameterized ones
  routeList.sort(function(a, b) {
    return a.paramNames.length - b.paramNames.length;
  });

  function parseHash() {
    var raw = location.hash.replace(/^#\/?/, '');
    var qIdx = raw.indexOf('?');
    var path = qIdx >= 0 ? raw.substring(0, qIdx) : raw;
    var queryStr = qIdx >= 0 ? raw.substring(qIdx + 1) : '';

    // Parse query string
    var query = {};
    if (queryStr) {
      queryStr.split('&').forEach(function(pair) {
        var eqIdx = pair.indexOf('=');
        if (eqIdx >= 0) {
          query[decodeURIComponent(pair.substring(0, eqIdx))] = decodeURIComponent(pair.substring(eqIdx + 1));
        } else {
          query[decodeURIComponent(pair)] = '';
        }
      });
    }

    return { path: path, query: query };
  }

  function matchRoute(path) {
    var mode = html.getAttribute('data-mode');
    for (var i = 0; i < routeList.length; i++) {
      var r = routeList[i];
      // In public mode, skip write routes
      if (mode === 'public' && r.group === 'write') continue;
      var m = path.match(r.regex);
      if (m) {
        var params = {};
        for (var j = 0; j < r.paramNames.length; j++) {
          params[r.paramNames[j]] = decodeURIComponent(m[j + 1]);
        }
        return { route: r.route, params: params, pattern: r.pattern };
      }
    }
    return null;
  }

  function navigate() {
    if (typeof ndModal !== 'undefined') ndModal.close();
    var parsed = parseHash();
    var matched = matchRoute(parsed.path);

    var viewEl = document.getElementById('nd-view');

    if (!matched) {
      viewEl.innerHTML = '<div class="nd-placeholder"><h2>Not Found</h2><p>Unknown route: ' + esc(parsed.path) + '</p></div>';
      document.title = 'nd preserve';
      updateNavHighlight('');
      return;
    }

    var allParams = {};
    var k;
    for (k in matched.params) allParams[k] = matched.params[k];
    for (k in parsed.query) allParams[k] = parsed.query[k];

    document.title = matched.route.title + ' - nd preserve';
    viewEl.innerHTML = '';
    // Skip full re-render if catalog is just updating its query params
    if (catalogSkipRender && parsed.path === 'catalog') {
      catalogSkipRender = false;
      updateNavHighlight(parsed.path);
      return;
    }
    catalogSkipRender = false;
    matched.route.render(viewEl, allParams);
    updateNavHighlight(parsed.path);
  }

  function updateNavHighlight(path) {
    var links = document.querySelectorAll('.nd-nav-link');
    links.forEach(function(link) {
      var route = link.getAttribute('data-route');
      var isActive = (route === path) || (route === '' && (path === '' || path === 'dashboard'));
      link.classList.toggle('nd-active', isActive);
    });
  }

  window.addEventListener('hashchange', navigate);

  // ==============================================================
  // Placeholder render functions (step 1 -- empty shell)
  // ==============================================================
  function renderDashboard(el) {
    el.innerHTML =
      '<div class="nd-dashboard">' +
        '<div class="nd-dash-hero" id="dash-hero">Loading...</div>' +
        '<div class="nd-dash-grid">' +
          '<div class="nd-card" id="dash-queue"><h3>What needs doing</h3><p class="nd-text-muted">Loading...</p></div>' +
          '<div class="nd-card" id="dash-contributors"><h3>Contributors</h3><p class="nd-text-muted">Loading...</p></div>' +
          '<div class="nd-card" id="dash-products"><h3>Top inferred products</h3><p class="nd-text-muted">Loading...</p></div>' +
          '<div class="nd-card" id="dash-filetypes"><h3>NDFS file types</h3><p class="nd-text-muted">Loading...</p></div>' +
        '</div>' +
      '</div>';

    fetch('/api/stats').then(function(r) { return r.json(); }).then(function(stats) {
      // Hero counters
      document.getElementById('dash-hero').innerHTML =
        '<div class="nd-hero-stats">' +
          ndStat(stats.totalFloppies, 'floppies', '') +
          ndStat(stats.totalProducts, 'products', '') +
          ndStat(stats.broken, 'bad reads', 'warn') +
          ndStat(stats.unassigned, 'unidentified', 'warn') +
          ndStat(stats.assigned, 'identified', 'ok') +
        '</div>';

      // Match queue piles
      var mq = stats.matchQueue || {};
      document.getElementById('dash-queue').innerHTML =
        '<h3>What needs doing</h3>' +
        '<div class="nd-queue-piles">' +
          ndQueuePile('auto', mq.auto || 0, 'Ready to link', 'Floppy name matches a known product — confirm to link them', 'ok') +
          ndQueuePile('new', mq.new || 0, 'New products', 'Floppy name parsed but product not yet in the list — create it', 'info') +
          ndQueuePile('manual', mq.manual || 0, 'Needs review', 'The image has contents, but its name could not be parsed — pick the product manually', 'warn') +
          ndQueuePile('broken', mq.broken || 0, 'No filesystem', 'No ND filesystem in the image — a bad read, an empty disk, or non-ND media such as MS-DOS', 'patch') +
        '</div>';

      // Contributors
      var contribs = stats.byContributor || {};
      var contribSorted = Object.entries(contribs).sort(function(a, b) { return b[1] - a[1]; });
      var contribHtml = '<h3>Contributors</h3><table class="nd-table nd-table-compact"><thead><tr><th>Name</th><th style="text-align:right">Images</th><th></th></tr></thead><tbody>';
      contribSorted.forEach(function(pair) {
        var pct = stats.totalFloppies > 0 ? Math.round(pair[1] * 100 / stats.totalFloppies) : 0;
        contribHtml += '<tr class="nd-clickable" onclick="location.hash=\'#/catalog?contributor=' +
          encodeURIComponent(pair[0]) + '\'" title="Show the floppies contributed by ' + esc(pair[0]) + '">' +
          '<td>' + esc(pair[0]) + '</td><td style="text-align:right">' + pair[1] + '</td>' +
          '<td><div class="nd-bar" style="width:' + pct + '%;"></div></td></tr>';
      });
      contribHtml += '</tbody></table>';
      document.getElementById('dash-contributors').innerHTML = contribHtml;

      // Top inferred products
      var prods = (stats.byInferredProduct || []).slice(0, 15);
      var prodHtml = '<h3>Top inferred products</h3><table class="nd-table nd-table-compact"><thead><tr><th>Product</th><th>Name</th><th style="text-align:right">#</th></tr></thead><tbody>';
      prods.forEach(function(p) {
        prodHtml += '<tr class="nd-clickable" onclick="location.hash=\'#/products/' + esc(p.productId) + '\'">' +
          '<td><code>' + esc(p.productId) + '</code></td><td>' + esc(p.name) + '</td><td style="text-align:right">' + p.count + '</td></tr>';
      });
      prodHtml += '</tbody></table>';
      document.getElementById('dash-products').innerHTML = prodHtml;

      // File types
      var ft = stats.byFileType || {};
      var ftSorted = Object.entries(ft).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 20);
      var maxFt = ftSorted.length > 0 ? ftSorted[0][1] : 1;
      var ftHtml = '<h3>NDFS file types <span class="nd-text-muted" style="font-size:0.8rem;font-weight:normal;">(top 20)</span></h3>' +
        '<div class="nd-ft-grid">';
      ftSorted.forEach(function(pair) {
        var pct = Math.round(pair[1] * 100 / maxFt);
        ftHtml += '<div class="nd-ft-item"><code class="nd-ft-name">' + esc(pair[0]) + '</code>' +
          '<div class="nd-ft-bar-wrap"><div class="nd-ft-bar" style="width:' + pct + '%;"></div></div>' +
          '<span class="nd-ft-count">' + pair[1] + '</span></div>';
      });
      ftHtml += '</div>';
      document.getElementById('dash-filetypes').innerHTML = ftHtml;
    }).catch(function(err) {
      document.getElementById('dash-hero').innerHTML = '<p style="color:var(--warn)">Failed to load stats: ' + esc(String(err)) + '</p>';
    });
  }

  function ndStat(value, label, variant) {
    var cls = variant === 'ok' ? 'nd-stat-ok' : variant === 'warn' ? 'nd-stat-warn' : '';
    return '<div class="nd-stat ' + cls + '"><div class="nd-stat-value">' + value + '</div><div class="nd-stat-label">' + label + '</div></div>';
  }

  function ndQueuePile(mode, count, title, desc, badge) {
    var badgeCls = badge === 'ok' ? 'nd-badge-ok' : badge === 'info' ? 'nd-badge-info' : badge === 'warn' ? 'nd-badge-warn' : 'nd-badge-' + badge;
    return '<a href="#/match?mode=' + mode + '" class="nd-queue-pile">' +
      '<div class="nd-queue-count">' + count + '</div>' +
      '<div class="nd-queue-title"><span class="nd-badge ' + badgeCls + '">' + esc(title) + '</span></div>' +
      '<div class="nd-queue-desc nd-text-muted">' + esc(desc) + '</div>' +
    '</a>';
  }

  // ==============================================================
  // Matcher
  // ==============================================================
  var matcherState = { mode: 'auto', entries: [], total: 0, offset: 0, limit: 50, selected: new Set(), loading: false };

  function renderMatcher(el, params) {
    var mode = params.mode || 'auto';
    matcherState.mode = mode;
    matcherState.offset = parseInt(params.offset || '0', 10);
    if (params.limit) matcherState.limit = parseInt(params.limit, 10);
    matcherState.selected = new Set();

    el.innerHTML =
      '<div class="nd-matcher">' +
        '<div class="nd-matcher-modes">' +
          ndMatchTab('auto', 'Auto-match', 'ok') +
          ndMatchTab('new', 'New products', 'info') +
          ndMatchTab('manual', 'Unparseable', 'warn') +
          ndMatchTab('broken', 'No filesystem', 'patch') +
        '</div>' +
        '<div class="nd-matcher-toolbar" id="match-toolbar">' +
          '<label class="nd-matcher-select-all"><input type="checkbox" id="match-select-all"> Select all</label>' +
          '<span id="match-selection-count" class="nd-text-muted"></span>' +
          '<span style="flex:1"></span>' +
          '<button class="nd-btn nd-btn-primary" id="match-confirm-btn" disabled>Link to product</button>' +
          '<button class="nd-btn nd-btn-ghost" id="match-skip-btn" disabled>Skip for now</button>' +
          '<button class="nd-btn nd-btn-danger nd-write-only" id="match-discard-btn" disabled>Discard import</button>' +
          '<button class="nd-btn nd-btn-ghost nd-write-only" id="match-detect-btn" title="Read every image that has no recorded filesystem and work out what it holds">Detect filesystems</button>' +
        '</div>' +
        '<div class="nd-matcher-body">' +
          '<div class="nd-matcher-list" id="match-list"><p class="nd-text-muted">Loading...</p></div>' +
          '<div class="nd-matcher-detail" id="match-detail"><p class="nd-text-muted">Select a row to preview</p></div>' +
        '</div>' +
        '<div id="match-message" style="display:none"></div>' +
        '<div class="nd-matcher-pager" id="match-pager"></div>' +
      '</div>';

    // Wire events
    document.getElementById('match-select-all').addEventListener('change', function() {
      var checked = this.checked;
      document.querySelectorAll('.nd-match-check').forEach(function(cb) { cb.checked = checked; });
      if (checked) {
        matcherState.entries.forEach(function(e) { matcherState.selected.add(e.floppy.id); });
      } else {
        matcherState.selected.clear();
      }
      updateMatchToolbar();
    });

    document.getElementById('match-confirm-btn').addEventListener('click', matchConfirm);
    document.getElementById('match-skip-btn').addEventListener('click', matchSkip);
    var mDetect = document.getElementById('match-detect-btn');
    if (mDetect) mDetect.addEventListener('click', function() {
      var b = this; b.disabled = true; b.textContent = 'Detecting...';
      fetch('/api/detect-filesystem?scope=missing', { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          b.disabled = false; b.textContent = 'Detect filesystems';
          if (d.error) { showMatchMessage('Detect failed: ' + d.error, 'warn'); return; }
          var parts = Object.keys(d.counts || {}).map(function(k) { return k + ': ' + d.counts[k]; });
          showMatchMessage('Scanned ' + d.scanned + ', recorded ' + d.changed +
            (parts.length ? ' - ' + parts.join(', ') : '') + (d.failed ? ' (' + d.failed + ' unreadable)' : ''), 'ok');
          loadMatchQueue();
        })
        .catch(function(err) { b.disabled = false; b.textContent = 'Detect filesystems'; showMatchMessage(String(err), 'warn'); });
    });

    var mDiscard = document.getElementById('match-discard-btn');
    if (mDiscard) mDiscard.addEventListener('click', function() {
      var ids = Array.from(matcherState.selected);
      var label = '';
      if (ids.length === 1) {
        var one = matcherState.entries.find(function(e) { return e.floppy.id === ids[0]; });
        label = one ? (one.floppy.volumeName || one.floppy.originalFilename || ids[0]) : ids[0];
      }
      matchDiscard(ids, label);
    });

    loadMatchQueue();
  }

  function ndMatchTab(mode, label, badge) {
    var active = matcherState.mode === mode ? ' nd-active' : '';
    var badgeCls = badge === 'ok' ? 'nd-badge-ok' : badge === 'info' ? 'nd-badge-info' : badge === 'warn' ? 'nd-badge-warn' : 'nd-badge-' + badge;
    return '<a href="#/match?mode=' + mode + '" class="nd-match-tab' + active + '">' +
      '<span class="nd-badge ' + badgeCls + '">' + esc(label) + '</span></a>';
  }

  function loadMatchQueue() {
    matcherState.loading = true;
    var url = '/api/match/queue?mode=' + matcherState.mode + '&limit=' + matcherState.limit + '&offset=' + matcherState.offset;
    fetch(url).then(function(r) { return r.json(); }).then(function(data) {
      matcherState.entries = data.entries || [];
      matcherState.total = data.total || 0;
      matcherState.loading = false;
      renderMatchList();
      renderMatchPager();
    }).catch(function(err) {
      document.getElementById('match-list').innerHTML = '<p style="color:var(--warn)">Error: ' + esc(String(err)) + '</p>';
    });
  }

  function renderMatchList() {
    var list = document.getElementById('match-list');
    if (matcherState.entries.length === 0) {
      list.innerHTML = '<div class="nd-placeholder"><h2>All done</h2><p>No floppies need attention in this queue.</p></div>';
      return;
    }

    var html = '';

    if (matcherState.mode === 'manual' || matcherState.mode === 'broken') {
      // Group by source folder
      var groups = {};
      var groupOrder = [];
      matcherState.entries.forEach(function(e) {
        var folder = e.floppy.sourceFolder || '(unknown source)';
        if (!groups[folder]) { groups[folder] = []; groupOrder.push(folder); }
        groups[folder].push(e);
      });

      groupOrder.forEach(function(folder) {
        var entries = groups[folder];
        var ids = entries.map(function(e) { return e.floppy.id; });
        var allChecked = ids.every(function(id) { return matcherState.selected.has(id); });

        html += '<details class="nd-version-section" open>' +
          '<summary>' +
            '<input type="checkbox" class="nd-group-check" data-ids="' + ids.map(esc).join(',') + '"' + (allChecked ? ' checked' : '') + '>' +
            ' <span>' + esc(folder) + '</span>' +
            ' <span class="nd-badge">' + entries.length + ' disk' + (entries.length !== 1 ? 's' : '') + '</span>' +
          '</summary>';

        // Disk list inside group
        html += '<div style="padding:0.75rem 1rem">';
        html += '<div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.75rem">';
        entries.forEach(function(e) {
          var vol = e.floppy.volumeName || '';
          var volDisplay = vol ? esc(vol) : '<span class="nd-text-muted">' + esc(e.floppy.originalFilename || e.floppy.id) + '</span>';
          var checked = matcherState.selected.has(e.floppy.id) ? ' checked' : '';
          // The chip is NOT a <label>: wrapping it in one made every click
          // toggle the checkbox, so the disk name could not be opened.
          // The box is its own hit area; the name is a button that opens the disk.
          html += '<span class="nd-match-disk-chip nd-match-row" data-id="' + esc(e.floppy.id) + '">' +
            '<input type="checkbox" class="nd-match-check" title="Select"' + checked + '>' +
            '<button type="button" class="nd-disk-open" data-id="' + esc(e.floppy.id) + '" ' +
              'title="Open this disk and look at its contents"><code>' + volDisplay + '</code></button>' +
            '<button type="button" class="nd-disk-discard nd-write-only" data-id="' + esc(e.floppy.id) + '" ' +
              'data-vol="' + esc(vol || e.floppy.originalFilename || e.floppy.id) + '" ' +
              'title="Discard this import - deletes the copied image and its YAML">&#10005;</button>' +
          '</span>';
        });
        html += '</div>';

        // Quick actions for this group
        html += '<div class="nd-write-only" style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">';
        html += '<input class="nd-input" placeholder="New product ID (e.g. ND-12345)" style="max-width:200px;font-size:0.85rem" data-group-pid="' + esc(folder) + '">';
        html += '<input class="nd-input" placeholder="Product name" style="max-width:250px;font-size:0.85rem" data-group-pname="' + esc(folder) + '">';
        html += '<button class="nd-btn nd-btn-primary nd-btn-sm nd-group-create-btn" data-folder="' + esc(folder) + '">Create &amp; link</button>';
        html += '<span class="nd-text-muted" style="font-size:0.8rem">or</span>';
        html += '<button class="nd-btn nd-btn-sm nd-group-pick-btn" data-folder="' + esc(folder) + '">Pick existing product...</button>';
        html += '</div>';

        html += '</div></details>';
      });
    } else {
      // Auto / New mode: flat table (existing behavior)
      html += '<table class="nd-table nd-table-compact nd-match-table"><thead><tr>' +
        '<th style="width:2rem"></th><th>Volume Name</th>';
      html += '<th>Parsed</th><th>Suggested Product</th><th>Conf.</th>';
      html += '</tr></thead><tbody>';

      matcherState.entries.forEach(function(e) {
        var checked = matcherState.selected.has(e.floppy.id) ? ' checked' : '';
        var vol = e.floppy.volumeName || '';
        var volDisplay = vol ? esc(vol) : '<span class="nd-text-muted">(null)</span>';

        html += '<tr class="nd-match-row" data-id="' + esc(e.floppy.id) + '">' +
          '<td><input type="checkbox" class="nd-match-check"' + checked + '></td>' +
          '<td><code>' + volDisplay + '</code></td>';

        var p = e.parsed || {};
        var s = e.suggested || {};
        var parsedStr = p.productId ? esc(p.productId) + ' ' + esc(p.version || '') : '-';
        var langBadge = p.language ? ' <span class="nd-badge">' + esc(p.language) + '</span>' : '';
        var diskBadge = p.diskNumber ? ' <span class="nd-badge">d' + p.diskNumber + '</span>' : '';
        // A product that does not exist yet still gets a name when its old/new
        // sibling number is known (ND-210511 borrows the name of ND-10511).
        // Show NEW whenever it is new, and say where the name came from -
        // otherwise a borrowed name makes it look like an existing product.
        var prodDisplay = '-';
        if (s.productId) {
          prodDisplay = '<code>' + esc(s.productId) + '</code>';
          if (s.isNew) prodDisplay += ' <span class="nd-badge nd-badge-warn">NEW</span>';
          if (s.productName) prodDisplay += ' ' + esc(s.productName);
          if (s.siblingOf) {
            prodDisplay += ' <span class="nd-text-muted" style="font-size:0.8rem">(name from '
              + esc(s.siblingOf) + ')</span>';
          }
        }
        var confPct = s.confidence != null ? Math.round(s.confidence * 100) + '%' : '-';
        var confCls = s.confidence >= 0.9 ? 'nd-conf-high' : s.confidence >= 0.7 ? 'nd-conf-mid' : 'nd-conf-low';
        html += '<td>' + parsedStr + langBadge + diskBadge + '</td>' +
          '<td>' + prodDisplay + '</td>' +
          '<td><span class="' + confCls + '">' + confPct + '</span></td>';

        html += '</tr>';
      });

      html += '</tbody></table>';
    }
    list.innerHTML = html;

    // Wire individual row events (checkboxes + click to show detail)
    list.querySelectorAll('.nd-match-row').forEach(function(row) {
      var id = row.getAttribute('data-id');

      row.querySelector('.nd-match-check').addEventListener('change', function(ev) {
        ev.stopPropagation();
        if (this.checked) matcherState.selected.add(id);
        else matcherState.selected.delete(id);
        updateMatchToolbar();
      });

      row.addEventListener('click', function(ev) {
        if (ev.target.type === 'checkbox' || ev.target.tagName === 'INPUT' || ev.target.tagName === 'BUTTON' || ev.target.tagName === 'SELECT') return;
        var entry = matcherState.entries.find(function(e) { return e.floppy.id === id; });
        if (entry) renderMatchDetail(entry);
        list.querySelectorAll('.nd-match-row').forEach(function(r) { r.classList.remove('nd-row-active'); });
        row.classList.add('nd-row-active');
      });
    });

    // Open a disk from its name - shows the detail panel and, when the image has
    // an NDFS filesystem, its contents. Separate from the checkbox on purpose.
    list.querySelectorAll('.nd-disk-open').forEach(function(btn) {
      btn.addEventListener('click', function(ev) {
        ev.preventDefault();
        ev.stopPropagation();
        var id = this.getAttribute('data-id');
        var entry = matcherState.entries.find(function(e) { return e.floppy.id === id; });
        if (!entry) return;
        renderMatchDetail(entry);
        list.querySelectorAll('.nd-match-row').forEach(function(r) { r.classList.remove('nd-row-active'); });
        var chip = this.closest('.nd-match-row');
        if (chip) chip.classList.add('nd-row-active');
      });
    });

    // Discard a single import straight from its chip.
    list.querySelectorAll('.nd-disk-discard').forEach(function(btn) {
      btn.addEventListener('click', function(ev) {
        ev.preventDefault();
        ev.stopPropagation();
        matchDiscard([this.getAttribute('data-id')], this.getAttribute('data-vol'));
      });
    });

    // Wire group checkboxes (select/deselect all in folder)
    list.querySelectorAll('.nd-group-check').forEach(function(cb) {
      cb.addEventListener('change', function(ev) {
        ev.stopPropagation();
        var ids = this.getAttribute('data-ids').split(',');
        ids.forEach(function(id) {
          if (cb.checked) matcherState.selected.add(id);
          else matcherState.selected.delete(id);
        });
        // Sync individual checkboxes
        var section = this.closest('.nd-version-section');
        section.querySelectorAll('.nd-match-check').forEach(function(c) { c.checked = cb.checked; });
        updateMatchToolbar();
      });
    });

    // Wire group pick buttons and create buttons
    if (matcherState.mode === 'manual' || matcherState.mode === 'broken') {
      list.querySelectorAll('.nd-group-pick-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var folder = this.getAttribute('data-folder');
          var ids = matcherState.entries
            .filter(function(e) { return (e.floppy.sourceFolder || '(unknown source)') === folder; })
            .map(function(e) { return e.floppy.id; });
          openProductPicker(ids, folder);
        });
      });

      list.querySelectorAll('.nd-group-create-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var folder = this.getAttribute('data-folder');
          var pidInput = list.querySelector('[data-group-pid="' + folder + '"]');
          var pnameInput = list.querySelector('[data-group-pname="' + folder + '"]');
          var pid = pidInput.value.trim();
          var pname = pnameInput.value.trim();
          if (!pid) { pidInput.focus(); return; }
          if (!pname) { pnameInput.focus(); return; }
          if (/^\d/.test(pid)) pid = 'ND-' + pid;

          var ids = matcherState.entries
            .filter(function(e) { return (e.floppy.sourceFolder || '(unknown source)') === folder; })
            .map(function(e) { return e.floppy.id; });
          setPendingProduct(folder, ids, pid, pname, true);
        });
      });
    }
  }

  function linkFloppies(ids, target) {
    showMatchMessage('Linking ' + ids.length + ' floppy(s)...', 'info');
    fetch('/api/match/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ floppyIds: ids, target: target })
    }).then(function(r) { return r.json(); }).then(function(data) {
      if (data.error) {
        showMatchMessage('Error: ' + data.error, 'warn');
      } else {
        var label = target.productId || (target.newProduct ? target.newProduct.id : '?');
        showMatchMessage('Linked ' + ids.length + ' floppy(s) to ' + label, 'ok');
        matcherState.selected.clear();
        loadMatchQueue();
      }
    }).catch(function(err) {
      showMatchMessage('Error: ' + String(err), 'warn');
    });
  }

  // Product picker modal
  var pickerFloppyIds = null;
  var pickerFolder = null;

  function setPendingProduct(folder, floppyIds, productId, productName, isNew) {
    var sections = document.querySelectorAll('.nd-version-section');
    sections.forEach(function(section) {
      var pickBtn = section.querySelector('.nd-group-pick-btn');
      var createBtn = section.querySelector('.nd-group-create-btn');
      var matchFolder = (pickBtn && pickBtn.getAttribute('data-folder')) || (createBtn && createBtn.getAttribute('data-folder'));
      if (matchFolder !== folder) return;

      var existingPending = section.querySelector('.nd-pending-product');
      if (existingPending) existingPending.remove();

      var label = isNew ? 'Create <code><strong>' + esc(productId) + '</strong></code> ' + esc(productName) + ' and link ' + floppyIds.length + ' disk(s)'
        : 'Link ' + floppyIds.length + ' disk(s) to <code><strong>' + esc(productId) + '</strong></code> ' + esc(productName);

      var pendingDiv = document.createElement('div');
      pendingDiv.className = 'nd-pending-product';
      pendingDiv.style.cssText = 'margin-top:0.75rem;padding:0.75rem;background:var(--accent-bg);border:1px solid var(--accent);border-radius:6px;display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap';
      pendingDiv.innerHTML =
        '<span style="font-size:0.9rem">' + label + '</span>' +
        '<button class="nd-btn nd-btn-primary nd-btn-sm nd-pending-confirm">Confirm</button>' +
        '<button class="nd-btn nd-btn-ghost nd-btn-sm nd-pending-cancel">Cancel</button>';

      // Append after the disk list area
      var content = section.querySelector('div');
      if (content) content.appendChild(pendingDiv);

      pendingDiv.querySelector('.nd-pending-confirm').addEventListener('click', function() {
        var target = isNew ? { newProduct: { id: productId, name: productName.replace(' (new)', '') } } : { productId: productId };
        linkFloppies(floppyIds, target);
        pendingDiv.remove();
      });

      pendingDiv.querySelector('.nd-pending-cancel').addEventListener('click', function() {
        pendingDiv.remove();
      });
    });
  }

  function openProductPicker(floppyIds, folder) {
    pickerFloppyIds = floppyIds;
    pickerFolder = folder;

    ndModal.open(
      '<div class="nd-modal-header">' +
        '<h3>Pick a product</h3>' +
        '<button class="nd-modal-close" onclick="ndModal.close()">&times;</button>' +
      '</div>' +
      '<div class="nd-modal-body">' +
        '<input class="nd-input" id="picker-search" placeholder="Search products..." style="margin-bottom:0.75rem">' +
        '<div id="picker-results" style="max-height:400px;overflow-y:auto"></div>' +
      '</div>'
    );

    var searchInput = document.getElementById('picker-search');
    searchInput.value = '';
    searchInput.focus();

    // Load products
    fetch('/api/products').then(function(r) { return r.json(); }).then(function(products) {
      var allProducts = products;

      function renderPickerResults(filter) {
        var fl = (filter || '').toLowerCase();
        var filtered = fl ? allProducts.filter(function(p) {
          return p.productId.toLowerCase().includes(fl) || p.name.toLowerCase().includes(fl);
        }) : allProducts;

        var html = '<table class="nd-table nd-table-compact" style="width:100%"><tbody>';
        filtered.slice(0, 50).forEach(function(p) {
          html += '<tr class="nd-clickable nd-picker-row" data-pid="' + esc(p.productId) + '">' +
            '<td><code>' + esc(p.productId) + '</code></td>' +
            '<td>' + esc(p.name) + '</td>' +
            '<td style="text-align:right;color:var(--text-muted)">' + p.imageCount + '</td>' +
          '</tr>';
        });
        if (filtered.length > 50) html += '<tr><td colspan="3" class="nd-text-muted">... ' + (filtered.length - 50) + ' more</td></tr>';
        if (filtered.length === 0) html += '<tr><td colspan="3" class="nd-text-muted">No products match</td></tr>';
        html += '</tbody></table>';

        document.getElementById('picker-results').innerHTML = html;

        // Wire row clicks
        document.querySelectorAll('.nd-picker-row').forEach(function(row) {
          row.addEventListener('click', function() {
            var pid = this.getAttribute('data-pid');
            var pname = this.querySelector('td:nth-child(2)')?.textContent || pid;
            ndModal.close();
            // Set pending selection on the group -- don't apply yet
            setPendingProduct(pickerFolder, pickerFloppyIds, pid, pname, false);
          });
        });
      }

      renderPickerResults('');

      var debounce = null;
      searchInput.addEventListener('input', function() {
        var val = this.value.trim();
        clearTimeout(debounce);
        debounce = setTimeout(function() { renderPickerResults(val); }, 200);
      });
    });
  }

  function renderMatchDetail(entry) {
    var detail = document.getElementById('match-detail');
    var f = entry.floppy;
    var p = entry.parsed;
    var s = entry.suggested;
    matcherState.detailId = f.id;

    var html = '<div class="nd-card">';
    html += '<h3><code>' + esc(f.volumeName || f.id) + '</code></h3>';
    html += '<dl class="nd-dl">';
    html += '<dt>ID</dt><dd><code style="font-size:0.8rem">' + esc(f.id) + '</code></dd>';
    html += '<dt>MD5</dt><dd><code style="font-size:0.8rem">' + esc(f.md5) + '</code></dd>';
    html += '<dt>Status</dt><dd>' + esc(f.status) + '</dd>';
    if (f.sourceFolder) html += '<dt>Source folder</dt><dd><code>' + esc(f.sourceFolder) + '</code></dd>';
    if (f.originalFilename) html += '<dt>Original file</dt><dd><code>' + esc(f.originalFilename) + '</code></dd>';
    html += '</dl>';

    if (p) {
      html += '<h4 style="margin-top:1rem;color:var(--accent)">Parsed name</h4>';
      html += '<dl class="nd-dl">';
      html += '<dt>Product #</dt><dd><code>' + esc(p.productId) + '</code></dd>';
      if (p.version) html += '<dt>Version</dt><dd>' + esc(p.version) + '</dd>';
      if (p.language) html += '<dt>Language</dt><dd>' + esc(p.language) + '</dd>';
      if (p.diskNumber) html += '<dt>Disk #</dt><dd>' + p.diskNumber + '</dd>';
      if (p.density) html += '<dt>Density</dt><dd>' + esc(p.density) + '</dd>';
      html += '<dt>Confidence</dt><dd>' + Math.round(p.confidence * 100) + '%</dd>';
      html += '</dl>';
    }

    if (s) {
      html += '<h4 style="margin-top:1rem;color:var(--accent)">Suggested target</h4>';
      html += '<dl class="nd-dl">';
      html += '<dt>Product</dt><dd><code>' + esc(s.productId) + '</code></dd>';
      if (s.productName) html += '<dt>Name</dt><dd>' + esc(s.productName) + '</dd>';
      if (s.siblingOf) html += '<dt>Sibling of</dt><dd><a href="#/products/' + esc(s.siblingOf) + '"><code>' + esc(s.siblingOf) + '</code></a> <span class="nd-text-muted">(old/new number for same product)</span></dd>';
      if (s.isNew && !s.siblingOf) html += '<dt></dt><dd><span class="nd-badge nd-badge-warn">Will create new product</span></dd>';
      if (s.isNew && s.siblingOf) html += '<dt></dt><dd><span class="nd-badge nd-badge-info">New product (name from sibling)</span></dd>';
      html += '</dl>';

      if (s.isNew) {
        var prefill = s.productName || '';
        html += '<div style="margin-top:1rem">';
        html += '<label style="font-size:0.85rem;color:var(--text-muted)">Product name for ' + esc(s.productId) + ':</label>';
        html += '<input class="nd-input" id="match-new-name" value="' + esc(prefill) + '" placeholder="Enter product name" style="margin-top:0.3rem">';
        html += '</div>';
      }
    }

    // NDFS file listing -- crucial for identifying unknown products
    if (f.ndfsFiles && f.ndfsFiles.length > 0) {
      html += '<h4 style="margin-top:1rem;color:var(--accent)">Files on disk</h4>';
      html += '<div style="font-family:monospace;font-size:0.78rem;line-height:1.6;background:var(--bg-sunken);padding:0.5rem 0.75rem;border-radius:4px;max-height:200px;overflow-y:auto">';
      f.ndfsFiles.forEach(function(fname) {
        html += esc(fname) + '<br>';
      });
      html += '</div>';
    } else {
      // Say why the listing is empty - otherwise a disk whose directory could
      // not be read looks the same as one nobody has looked at.
      html += '<h4 style="margin-top:1rem;color:var(--accent)">Files on disk</h4>';
      html += '<p class="nd-text-muted" style="font-size:0.85rem">No ND filesystem could be read from this image. ' +
        'Open the floppy detail below to look at the raw image.</p>';
    }

    // Actions. The NDFS Viewer button is added after the lazy fetch below,
    // once we know the image is available in git.
    html += '<div id="match-detail-actions" style="margin-top:1.5rem;display:flex;gap:0.5rem;flex-wrap:wrap">';
    html += '<a href="#/disks/' + encodeURIComponent(f.id) + '" class="nd-btn nd-btn-ghost" style="font-size:0.85rem">View floppy detail →</a>';
    html += '</div>';

    // Placeholder for photos, loaded lazily so the match-queue payload stays slim.
    html += '<div id="match-detail-extra"></div>';

    html += '</div>';
    detail.innerHTML = html;

    loadMatchDetailExtra(f.id);
  }

  // Fetch the full catalog entry to enrich the match detail panel with an NDFS
  // Viewer button and any label photos -- the data the slim match queue omits.
  function loadMatchDetailExtra(fid) {
    fetch('/api/catalog/' + encodeURIComponent(fid)).then(function(r) {
      return r.ok ? r.json() : null;
    }).then(function(e) {
      if (!e || matcherState.detailId !== fid) return; // selection changed meanwhile
      var actions = document.getElementById('match-detail-actions');
      var extra = document.getElementById('match-detail-extra');
      if (!actions || !extra) return;

      // NDFS Viewer button -- only when the actual image is stored in git.
      var git = e.storage && e.storage.git;
      if (e.storageClass === 'floppy-in-git' && git && git.imagePath) {
        // Only offer the NDFS viewer when the image might actually hold an ND
        // filesystem - not on a disk already known to be DOS, a backup volume,
        // a tar, or unreadable.
        var btn = null;
        if (!e.filesystem || e.filesystem === 'ndfs') {
          btn = document.createElement('button');
          btn.className = 'nd-btn nd-btn-primary nd-btn-sm';
          btn.style.fontSize = '0.85rem';
          btn.textContent = 'Open in NDFS Viewer';
          btn.addEventListener('click', function() { openNdfsViewer(e.id); });
          actions.insertBefore(btn, actions.firstChild);
        }

        // Hex view - the only way to look at a disk the NDFS parser cannot read.
        var hexBtn = document.createElement('button');
        hexBtn.className = 'nd-btn nd-btn-ghost nd-btn-sm';
        hexBtn.style.fontSize = '0.85rem';
        hexBtn.textContent = 'Open in HEX viewer';
        hexBtn.addEventListener('click', function() { openHexViewer(e.id, e.volumeName || e.id); });
        actions.insertBefore(hexBtn, btn ? btn.nextSibling : actions.firstChild);

        // Re-run filesystem detection on this image. An image the NDFS parser
        // rejected may still be a DOS floppy or a tar.
        var detBtn = document.createElement('button');
        detBtn.className = 'nd-btn nd-btn-ghost nd-btn-sm nd-write-only';
        detBtn.style.fontSize = '0.85rem';
        detBtn.textContent = 'Detect filesystem';
        detBtn.addEventListener('click', function() {
          var b = this; b.disabled = true; b.textContent = 'Detecting...';
          fetch('/api/detect-filesystem?id=' + encodeURIComponent(e.id), { method: 'POST' })
            .then(function(r) { return r.json(); })
            .then(function(d) {
              b.disabled = false; b.textContent = 'Detect filesystem';
              if (d.error) { showMatchMessage('Detect failed: ' + d.error, 'warn'); return; }
              var kind = Object.keys(d.counts || {})[0] || 'unknown';
              showMatchMessage('Filesystem: ' + kind + (d.changed ? ' (recorded)' : ' (unchanged)'),
                kind === 'none' ? 'warn' : 'ok');
              loadMatchQueue();
            })
            .catch(function(err) { b.disabled = false; b.textContent = 'Detect filesystem'; showMatchMessage(String(err), 'warn'); });
        });
        actions.insertBefore(detBtn, hexBtn.nextSibling);

        // MS-DOS disks get their own browser - the NDFS viewer has nothing to show.
        if (e.filesystem === 'dos') {
          var dosBtn = document.createElement('button');
          dosBtn.className = 'nd-btn nd-btn-primary nd-btn-sm';
          dosBtn.style.fontSize = '0.85rem';
          dosBtn.textContent = 'Open in DOS viewer';
          dosBtn.addEventListener('click', function() { openDosViewer(e.id, e.volumeName || e.volumeLabel || e.id); });
          actions.insertBefore(dosBtn, actions.firstChild);
        } else if (e.filesystem === 'backup' || e.filesystem === 'winch') {
          var bkBtn = document.createElement('button');
          bkBtn.className = 'nd-btn nd-btn-primary nd-btn-sm';
          bkBtn.style.fontSize = '0.85rem';
          bkBtn.textContent = 'Open in backup viewer';
