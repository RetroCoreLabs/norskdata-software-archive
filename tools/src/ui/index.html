  // ==============================================================
  // MS-DOS floppy viewer
  // ==============================================================
  // Same idea as the NDFS viewer, for the MS-DOS disks in the collection
  // (ND-OWS, NORTEXT PC material). Reads through /api/dosfs/*, which uses the
  // dosfs library in tools/src/lib/dosfs.
  window.openDosViewer = function(entryId, label) {
    ndModal.open(
      '<div class="nd-modal-header"><h3>MS-DOS disk - ' + esc(label || entryId) + '</h3>' +
        '<button class="nd-modal-close" onclick="ndModal.close()">&times;</button></div>' +
      // The modal is a flex column: the header and the action bar keep their
      // height, the listing takes the rest and scrolls. min-height:0 is what
      // actually lets a flex child shrink enough to produce a scrollbar.
      '<div id="doshead" style="flex:0 0 auto;padding:0.75rem 1.25rem;border-bottom:1px solid var(--border)"></div>' +
      '<div id="dosbody" style="flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:auto;padding:0.75rem 1.25rem">Loading...</div>' +
      '<div class="ndfs-file-actions" id="dosactions" style="flex:0 0 auto">' +
        '<span class="ndfs-selected-label" id="dos-sel-label">Select a file</span>' +
        '<button class="nd-btn nd-btn-sm nd-badge-ok" id="dos-btn-extract" disabled>Extract</button>' +
        '<button class="nd-btn nd-btn-sm nd-badge-os" id="dos-btn-extract-strip" disabled>Extract (strip parity)</button>' +
        '<button class="nd-btn nd-btn-sm nd-badge-info" id="dos-btn-hex" disabled>View as hex</button>' +
        '<button class="nd-btn nd-btn-sm nd-badge-patch" id="dos-btn-text" disabled>View as text</button>' +
      '</div>', { wide: true });

    var shell = document.getElementById('nd-modal-content');
    if (shell) { shell.style.height = '85vh'; shell.style.maxHeight = '85vh'; }

    var head = document.getElementById('doshead');
    var body = document.getElementById('dosbody');
    var all = [], cwd = '', selected = null;

    function childrenOf(dir) {
      return all.filter(function(e) {
        if (e.isVolumeLabel) return false;
        var cut = e.path.lastIndexOf('/');
        return (cut === -1 ? '' : e.path.slice(0, cut)) === dir;
      });
    }

    function setSelected(entry) {
      selected = entry;
      document.getElementById('dos-sel-label').textContent = entry ? entry.path : 'Select a file';
      ['dos-btn-extract', 'dos-btn-extract-strip', 'dos-btn-hex', 'dos-btn-text'].forEach(function(id) {
        document.getElementById(id).disabled = !entry;
      });
      body.querySelectorAll('tr[data-file]').forEach(function(tr) {
        tr.classList.toggle('ndfs-file-selected', !!entry && tr.getAttribute('data-file') === entry.path);
      });
    }

    function fileUrl(strip) {
      return '/api/dosfs/read-file?id=' + encodeURIComponent(entryId) +
        '&path=' + encodeURIComponent(selected.path) + (strip ? '&parity=strip' : '');
    }

    function crumbs() {
      var html = '<a href="#" data-goto="" class="nd-dos-crumb">disk root</a>';
      var acc = '';
      (cwd ? cwd.split('/') : []).forEach(function(p) {
        acc = acc ? acc + '/' + p : p;
        html += ' <span class="nd-text-muted">/</span> <a href="#" data-goto="' + esc(acc) + '" class="nd-dos-crumb"><code>' + esc(p) + '</code></a>';
      });
      return html;
    }

    function renderDir() {
      var rows = childrenOf(cwd);
      var dirs = rows.filter(function(e) { return e.isDirectory; }).sort(function(a, b) { return a.name.localeCompare(b.name); });
      var files = rows.filter(function(e) { return !e.isDirectory; }).sort(function(a, b) { return a.name.localeCompare(b.name); });

      var html = '<div style="margin-bottom:0.5rem">' + crumbs() + '</div>';
      html += '<table class="nd-table nd-table-compact"><thead><tr>' +
        '<th>Name</th><th style="width:8rem;text-align:right">Size</th><th style="width:11rem">Modified</th></tr></thead><tbody>';
      if (cwd) {
        var up = cwd.indexOf('/') === -1 ? '' : cwd.slice(0, cwd.lastIndexOf('/'));
        html += '<tr class="nd-dos-row" data-goto="' + esc(up) + '" style="cursor:pointer"><td><code>&#8593; ..</code></td><td></td><td></td></tr>';
      }
      dirs.forEach(function(e) {
        html += '<tr class="nd-dos-row" data-goto="' + esc(e.path) + '" style="cursor:pointer" title="Open this directory">' +
          '<td><code>&#128193; ' + esc(e.name) + '</code></td>' +
          '<td style="text-align:right" class="nd-text-muted">&lt;DIR&gt;</td>' +
          '<td class="nd-text-muted">' + esc(e.modified || '') + '</td></tr>';
      });
      files.forEach(function(e) {
        html += '<tr data-file="' + esc(e.path) + '" style="cursor:pointer" title="Select this file">' +
          '<td><code>' + esc(e.name) + '</code></td>' +
          '<td style="text-align:right">' + e.size.toLocaleString() + '</td>' +
          '<td class="nd-text-muted">' + esc(e.modified || '') + '</td></tr>';
      });
      if (!rows.length) html += '<tr><td colspan="3" class="nd-text-muted">(empty directory)</td></tr>';
      html += '</tbody></table>';
      body.innerHTML = html;

      body.querySelectorAll('[data-goto]').forEach(function(el) {
        el.addEventListener('click', function(ev) {
          ev.preventDefault();
          cwd = this.getAttribute('data-goto') || '';
          setSelected(null);
          renderDir();
        });
      });
      body.querySelectorAll('tr[data-file]').forEach(function(tr) {
        tr.addEventListener('click', function() {
          var path = this.getAttribute('data-file');
          setSelected(all.find(function(x) { return x.path === path; }) || null);
        });
      });
      setSelected(selected && childrenOf(cwd).some(function(x) { return x.path === selected.path; }) ? selected : null);
    }

    function showBytes(mode) {
      if (!selected) return;
      var strip = mode === 'text';
      fetch(fileUrl(false)).then(function(r) { return r.arrayBuffer(); }).then(function(buf) {
        var bytes = new Uint8Array(buf);
        var out;
        if (mode === 'hex') {
          var lines = [];
          for (var off = 0; off < bytes.length && off < 65536; off += 16) {
            var h = '', a = '';
            for (var i = 0; i < 16; i++) {
              if (off + i >= bytes.length) { h += '   '; continue; }
              var b = bytes[off + i];
              h += (b < 16 ? '0' : '') + b.toString(16) + ' ' + (i === 7 ? ' ' : '');
              a += (b >= 0x20 && b <= 0x7e) ? String.fromCharCode(b) : '.';
            }
            lines.push(('00000000' + off.toString(16)).slice(-8) + '  ' + h + ' |' + a + '|');
          }
          out = lines.join('\n') + (bytes.length > 65536 ? '\n... truncated at 64 KB' : '');
        } else {
          var txt = '';
          for (var j = 0; j < bytes.length; j++) {
            var c = bytes[j] & 0x7f;               // ND text carries the parity bit
            txt += (c === 10 || c === 13 || c === 9 || (c >= 0x20 && c <= 0x7e)) ? String.fromCharCode(c) : '.';
          }
          out = txt;
        }
        body.innerHTML = '<p style="margin:0 0 0.5rem"><button class="nd-btn nd-btn-ghost nd-btn-sm" id="dos-back">&larr; back to listing</button> ' +
          '<code>' + esc(selected.path) + '</code> <span class="nd-text-muted">' + bytes.length.toLocaleString() + ' bytes</span></p>' +
          '<pre style="user-select:text;background:var(--bg-sunken);border:1px solid var(--border);border-radius:4px;' +
          'padding:0.6rem 0.75rem;font-size:0.78rem;line-height:1.5;white-space:pre;margin:0">' +
          esc(out) + '</pre>';
        document.getElementById('dos-back').addEventListener('click', renderDir);
      }).catch(function(err) { alert('Read failed: ' + err); });
    }

    function download(strip) {
      if (!selected) return;
      fetch(fileUrl(strip)).then(function(r) { return r.blob(); }).then(function(blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = selected.name;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
      }).catch(function(err) { alert('Extract failed: ' + err); });
    }

    document.getElementById('dos-btn-extract').addEventListener('click', function() { download(false); });
    document.getElementById('dos-btn-extract-strip').addEventListener('click', function() { download(true); });
    document.getElementById('dos-btn-hex').addEventListener('click', function() { showBytes('hex'); });
    document.getElementById('dos-btn-text').addEventListener('click', function() { showBytes('text'); });

    fetch('/api/dosfs/info?id=' + encodeURIComponent(entryId))
      .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, j: j }; }); })
      .then(function(res) {
        if (!res.ok) { body.innerHTML = '<p class="nd-text-muted">' + esc(res.j.error || 'Could not read the disk') + '</p>'; return; }
        var i = res.j.info;
        all = res.j.entries || [];
        head.innerHTML = '<strong>' + esc(i.volumeLabel || '(no label)') + '</strong>' +
          ' <span class="nd-text-muted">OEM ' + esc(i.oemName) + ' &middot; FAT' + i.fatBits +
          ' &middot; ' + i.bytesPerSector + ' B/sector &middot; ' + i.totalBytes.toLocaleString() +
          ' B, ' + i.freeBytes.toLocaleString() + ' B free &middot; ' + all.length + ' entries</span>';
        renderDir();
      })
      .catch(function(err) { body.innerHTML = '<p class="nd-text-muted">' + esc(String(err)) + '</p>'; });
  };

  // Where a file came from when a volume was read more than once: the read that
  // supplied it, if it is not the volume's leading read, and the lengths the
  // other reads made the same file when they disagree. A marginal floppy loses
  // different labels on every attempt, so the run is the union of its reads.
  function backupReadNote(f, run) {
    var out = '';
    var vol = run.volumes[(f.parts[0].volume || 1) - 1];
    if (vol && vol.reads && vol.reads.length > 1 && f.parts[0].entryId !== vol.id) {
      out += ' <span class="nd-text-muted" style="font-size:0.7rem" title="This label was only readable on that attempt">from ' +
        esc(f.parts[0].entryId) + '</span>';
    }
    var dis = (f.otherReads || []).filter(function(o) { return o.bytes !== f.bytes; });
    if (dis.length) {
      out += ' <span class="nd-text-muted" style="font-size:0.7rem" title="The other reads of this floppy made the file a different length">other reads: ' +
        dis.map(function(o) { return o.bytes.toLocaleString(); }).join(', ') + '</span>';
    }
    return out;
  }

  // ==============================================================
  // Norsk Data backup volume viewer
  // ==============================================================
  // Two formats behind one button. A BACKUP-SYSTEM (VOL1) volume names its
  // files, so it browses and extracts like the NDFS and DOS viewers. A
  // WINCH-TO-FLOPP volume has no file names on the media at all - it is a page
  // dump of a directory - so it shows the header and the page map instead.
  window.openBackupViewer = function(entryId, label) {
    ndModal.open(
      '<div class="nd-modal-header"><h3>Backup volume - ' + esc(label || entryId) + '</h3>' +
        '<button class="nd-modal-close" onclick="ndModal.close()">&times;</button></div>' +
      '<div id="bkhead" style="flex:0 0 auto;padding:0.75rem 1.25rem;border-bottom:1px solid var(--border)"></div>' +
      '<div id="bkbody" style="flex:1 1 auto;min-height:0;overflow:auto;padding:0.75rem 1.25rem">Loading...</div>' +
      '<div class="ndfs-file-actions" id="bkactions" style="flex:0 0 auto;display:none">' +
        '<span class="ndfs-selected-label" id="bk-sel-label">Select a file</span>' +
        '<button class="nd-btn nd-btn-sm nd-badge-ok" id="bk-btn-extract" disabled>Extract</button>' +
        '<button class="nd-btn nd-btn-sm nd-badge-os" id="bk-btn-extract-strip" disabled>Extract (strip parity)</button>' +
        '<button class="nd-btn nd-btn-sm nd-badge-info" id="bk-btn-hex" disabled>View as hex</button>' +
        '<button class="nd-btn nd-btn-sm nd-badge-patch" id="bk-btn-text" disabled>View as text</button>' +
      '</div>', { wide: true });

    var shell = document.getElementById('nd-modal-content');
    if (shell) { shell.style.height = '85vh'; shell.style.maxHeight = '85vh'; }
    var head = document.getElementById('bkhead');
    var body = document.getElementById('bkbody');
    var actions = document.getElementById('bkactions');
    var files = [], selectedIndex = -1, runMode = false, runData = null;

    function setSelected(i) {
      selectedIndex = i;
      var f = files[i];
      document.getElementById('bk-sel-label').textContent = f ? f.fullName : 'Select a file';
      ['bk-btn-extract', 'bk-btn-extract-strip', 'bk-btn-hex', 'bk-btn-text'].forEach(function(id) {
        document.getElementById(id).disabled = !f;
      });
      body.querySelectorAll('tr[data-idx]').forEach(function(tr) {
        var on = parseInt(tr.getAttribute('data-idx'), 10) === i;
        tr.classList.toggle('ndfs-file-selected', on);
        if (on && tr.scrollIntoView) tr.scrollIntoView({ block: 'nearest' });
      });
    }

    // The run endpoint joins a file that spans two volumes; the per-volume one
    // is the fallback for a lone volume that belongs to no set.
    function fileUrl(strip) {
      var api = runMode ? '/api/ndbackup/read-run-file' : '/api/ndbackup/read-file';
      return api + '?id=' + encodeURIComponent(entryId) +
        '&index=' + selectedIndex + (strip ? '&parity=strip' : '');
    }

    function renderFiles() {
      var html = '<div id="bk-set"></div>' +
        '<table class="nd-table nd-table-compact"><thead><tr>' +
        '<th>File</th><th style="width:6rem;text-align:right">Bytes</th>' +
        '<th style="width:6rem">' + (runMode ? 'Volume' : 'Seq') + '</th>' +
        '<th style="width:8rem">Created</th><th style="width:10rem">System</th></tr></thead><tbody>';
      files.forEach(function(f, i) {
        var bytes = runMode ? f.bytes : f.dataLength;
        // Which volume the file sits on; two numbers when it spans the join.
        var where;
        if (runMode) {
          var vols = f.parts.map(function(p) { return p.volume; });
          where = vols.length > 1 ? vols[0] + '-' + vols[vols.length - 1] : String(vols[0]);
        } else {
          where = String(f.sequence);
        }
        // "cut" is only true when the run really ends mid-file: a file split
        // across two volumes we hold is whole here, joined on extract.
        var cut = runMode ? f.truncated : f.continued;
        html += '<tr data-idx="' + i + '" style="cursor:pointer"' + (f.stale ? ' title="Label left over from an older backup on this disk"' : '') + '>' +
          '<td><code>' + esc(f.fullName) + '</code>' +
            (runMode && f.parts.length > 1 ? ' <span class="nd-badge nd-badge-info" style="font-size:0.65rem">joined from ' + f.parts.length + ' volumes</span>' : '') +
            (runMode && f.stubVolumes && f.stubVolumes.length ? ' <span class="nd-text-muted" style="font-size:0.7rem" title="A label for this file was written at the end of that volume with no data behind it - the run then wrote the file whole on the next volume">label only on volume ' + f.stubVolumes.join(', ') + '</span>' : '') +
            (runMode && runData ? backupReadNote(f, runData) : '') +
            (cut ? ' <span class="nd-badge nd-badge-warn" style="font-size:0.65rem">cut - no volume here continues it</span>' : '') +
            (f.stale ? ' <span class="nd-text-muted" style="font-size:0.7rem">stale</span>' : '') + '</td>' +
          '<td style="text-align:right">' + bytes.toLocaleString() + '</td>' +
          '<td class="nd-text-muted">' + esc(where) + '</td>' +
          '<td class="nd-text-muted">' + esc(f.created || '') + '</td>' +
          '<td class="nd-text-muted">' + esc(f.system || '') + '</td></tr>';
      });
      html += '</tbody></table>';
      body.innerHTML = html;
      renderBackupSetPanel(entryId, document.getElementById('bk-set'));
      body.querySelectorAll('tr[data-idx]').forEach(function(tr) {
        tr.addEventListener('click', function() { setSelected(parseInt(this.getAttribute('data-idx'), 10)); });
      });
      setSelected(-1);
    }

    function showBytes(mode) {
      if (selectedIndex < 0) return;
      fetch(fileUrl(false)).then(function(r) { return r.arrayBuffer(); }).then(function(buf) {
        var bytes = new Uint8Array(buf), out;
        if (mode === 'hex') {
          var lines = [];
          for (var off = 0; off < bytes.length && off < 65536; off += 16) {
            var h = '', a = '';
            for (var i = 0; i < 16; i++) {
              if (off + i >= bytes.length) { h += '   '; continue; }
              var b = bytes[off + i];
              h += (b < 16 ? '0' : '') + b.toString(16) + ' ' + (i === 7 ? ' ' : '');
              var c = b & 0x7f;
              a += (c >= 0x20 && c <= 0x7e) ? String.fromCharCode(c) : '.';
            }
            lines.push(('00000000' + off.toString(16)).slice(-8) + '  ' + h + ' |' + a + '|');
          }
          out = lines.join('\n') + (bytes.length > 65536 ? '\n... truncated at 64 KB' : '');
        } else {
          var txt = '';
          for (var j = 0; j < bytes.length; j++) {
            var cc = bytes[j] & 0x7f;
            txt += (cc === 10 || cc === 13 || cc === 9 || (cc >= 0x20 && cc <= 0x7e)) ? String.fromCharCode(cc) : '.';
          }
          out = txt;
        }
        body.innerHTML = '<p style="margin:0 0 0.5rem"><button class="nd-btn nd-btn-ghost nd-btn-sm" id="bk-back">&larr; back to listing</button> ' +
          '<code>' + esc(files[selectedIndex].fullName) + '</code> <span class="nd-text-muted">' + bytes.length.toLocaleString() + ' bytes</span></p>' +
          '<pre style="user-select:text;background:var(--bg-sunken);border:1px solid var(--border);border-radius:4px;' +
          'padding:0.6rem 0.75rem;font-size:0.78rem;line-height:1.5;white-space:pre;margin:0">' + esc(out) + '</pre>';
        document.getElementById('bk-back').addEventListener('click', renderFiles);
      }).catch(function(err) { alert('Read failed: ' + err); });
    }

    function download(strip) {
      if (selectedIndex < 0) return;
      fetch(fileUrl(strip)).then(function(r) { return r.blob(); }).then(function(blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        // NAME:TYPE -> NAME.TYPE: a colon is illegal in a Windows filename and
        // the browser drops everything before it, leaving files called ".SYMB".
        a.download = files[selectedIndex].fullName.replace(/:/g, '.').replace(/[^A-Za-z0-9._-]/g, '_');
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
      }).catch(function(err) { alert('Extract failed: ' + err); });
    }

    document.getElementById('bk-btn-extract').addEventListener('click', function() { download(false); });
    document.getElementById('bk-btn-extract-strip').addEventListener('click', function() { download(true); });
    document.getElementById('bk-btn-hex').addEventListener('click', function() { showBytes('hex'); });
    document.getElementById('bk-btn-text').addEventListener('click', function() { showBytes('text'); });

    fetch('/api/ndbackup/info?id=' + encodeURIComponent(entryId))
      .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, j: j }; }); })
      .then(function(res) {
        if (!res.ok) { body.innerHTML = '<p class="nd-text-muted">' + esc(res.j.error || 'Could not read the volume') + '</p>'; return; }
        var v = res.j;
        if (v.kind === 'backup') {
          // A run is written across several floppies, so the listing is of the
          // run - every volume of it held here, in chain order - not of the one
          // image the viewer was opened on. Opening from any volume of the set
          // therefore gives the same list.
          fetch('/api/ndbackup/run?id=' + encodeURIComponent(entryId))
            .then(function(r) { return r.ok ? r.json() : null; })
            .then(function(run) {
              if (run && run.files) {
                runMode = true;
                runData = run;
                files = run.files;
                var liveR = files.filter(function(f) { return !f.stale; }).length;
                var spanned = files.filter(function(f) { return f.parts.length > 1; }).length;
                var cutR = files.filter(function(f) { return f.truncated; }).length;
                head.innerHTML = '<strong>SINTRAN BACKUP-SYSTEM</strong> <span class="nd-text-muted">run <code>' +
                  esc(run.volumeId) + '</code> &middot; owner <code>' + esc(run.owner) + '</code> &middot; ' +
                  liveR + ' file(s) across ' + run.volumes.length + ' volume(s)' +
                  (spanned ? ', ' + spanned + ' joined across the volume boundary' : '') +
                  (cutR ? ', ' + cutR + ' cut with no volume here to continue' : '') +
                  (files.length - liveR ? ', ' + (files.length - liveR) + ' stale label(s)' : '') +
                  ' &middot; ' + run.sectorSize + ' B sectors, ' + run.blockLength + ' B blocks</span>';
              } else {
                files = v.files || [];
                var live = files.filter(function(f) { return !f.stale; }).length;
                head.innerHTML = '<strong>SINTRAN BACKUP-SYSTEM</strong> <span class="nd-text-muted">volume <code>' +
                  esc(v.volumeId) + '</code> &middot; owner <code>' + esc(v.owner) + '</code> &middot; ' +
                  live + ' file(s)' + (files.length - live ? ', ' + (files.length - live) + ' stale label(s)' : '') +
                  ' &middot; ' + v.sectorSize + ' B sectors, ' + v.blockLength + ' B blocks</span>';
              }
              actions.style.display = '';
              renderFiles();
            });
        } else {
          head.innerHTML = '<strong>WINCH-TO-FLOPP</strong> <span class="nd-text-muted">directory <code>' +
            esc(v.directoryName) + '</code> &middot; volume ' + v.volumeNumber + ' of ' + v.totalVolumes +
            ' &middot; ' + v.pages.length + ' page(s)' + (v.label ? ' &middot; "' + esc(v.label) + '"' : '') + '</span>';
          var h = '<p class="nd-text-muted">This format stores no file names. It is a page-level dump of directory <code>' +
            esc(v.directoryName) + '</code>: each stored page records which page of the original filesystem it came from. ' +
            'File names appear only once all ' + v.totalVolumes + ' volumes of the set are reassembled into a directory image and read as NDFS.</p>';
          h += '<div id="bk-set">Loading the rest of the set...</div>';
          h += '<h4 style="margin:1rem 0 0.35rem">Pages on this volume</h4>';
          h += '<table class="nd-table nd-table-compact"><thead><tr><th style="width:10rem">Original page</th>' +
            '<th style="width:10rem">Offset in image</th></tr></thead><tbody>';
          v.pages.slice(0, 400).forEach(function(p) {
            h += '<tr><td><code>' + p.pageNumber + '</code></td><td class="nd-text-muted">' + p.offset.toLocaleString() + '</td></tr>';
          });
          h += '</tbody></table>';
          if (v.pages.length > 400) h += '<p class="nd-text-muted">... ' + (v.pages.length - 400) + ' more pages</p>';
          body.innerHTML = h;
          renderBackupSetPanel(entryId, document.getElementById('bk-set'));
        }
      })
      .catch(function(err) { body.innerHTML = '<p class="nd-text-muted">' + esc(String(err)) + '</p>'; });
  };

  // ==============================================================
  // Read groups - the reads of one physical floppy
  // ==============================================================
  // A floppy that reads badly gets read again and again, so the archive holds
  // several images of one disk (ND-disk-00426, -00426b, -00426c, -00426d are
  // four tries at disk 426). Listed separately they look like four floppies and
  // it is impossible to see which attempt is worth keeping. Grouped by the disk
  // they came off, a bad floppy is obvious: four attempts, nothing readable.
  //
  // Deleting lives here in the importer UI, never in the catalog the public
  // sees, and always as a dry run with the exact file list before it happens.
  var readsState = { filter: 'bad' };

  function renderReadGroups(el) {
    var filters = [['bad', 'Nothing readable'], ['semibad', 'Failed attempts beside a good read'], ['multi', 'Every disk read more than once'], ['all', 'All disks']];
    var html = '<h2>Reads of each physical floppy</h2>';
    html += '<p class="nd-text-muted">Reads of the same disk are grouped by the name the imaging gave them: ' +
      '<code>ND-disk-00426b</code> is the second attempt at disk <code>ND-disk-00426</code>. ' +
      'A disk where no attempt produced anything is a bad floppy; the failed attempts beside a good read are only clutter.</p>';
    html += '<div class="nd-search-bar" style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">Show ' +
      '<select class="nd-input" id="reads-filter" style="width:auto">' +
      filters.map(function(f) {
        return '<option value="' + f[0] + '"' + (readsState.filter === f[0] ? ' selected' : '') + '>' + f[1] + '</option>';
      }).join('') + '</select><span id="reads-count" class="nd-text-muted"></span></div>';
    html += '<div id="reads-body">Loading...</div>';
    el.innerHTML = html;
    document.getElementById('reads-filter').addEventListener('change', function() {
      readsState.filter = this.value;
      loadReadGroups();
    });
    loadReadGroups();
  }

  function loadReadGroups() {
    var box = document.getElementById('reads-body');
    box.innerHTML = 'Loading...';
    fetch('/api/read-groups?filter=' + encodeURIComponent(readsState.filter))
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.error) { box.innerHTML = '<p class="nd-text-muted">' + esc(res.error) + '</p>'; return; }
        document.getElementById('reads-count').textContent = res.total + ' disk(s)';
        if (!res.groups.length) { box.innerHTML = '<p class="nd-text-muted">Nothing matches this filter.</p>'; return; }
        var GRADE = {
          clean: ['nd-badge-ok', 'reads clean'], recovered: ['nd-badge-info', 'recovered'],
          other: ['nd-badge', 'other filesystem'], damaged: ['nd-badge-warn', 'damaged'],
          empty: ['nd-badge-warn', 'no filesystem'],
        };
        var h = '';
        res.groups.forEach(function(g) {
          h += '<div class="nd-card" style="margin-bottom:0.75rem;padding:0.75rem 1rem">';
          h += '<div style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap;margin-bottom:0.5rem">' +
            '<strong><code>' + esc(g.disk) + '</code></strong> ' +
            '<span class="nd-badge ' + (g.bad ? 'nd-badge-warn' : 'nd-badge-ok') + '">' + esc(g.summary) + '</span>' +
            '<span style="flex:1"></span>';
          if (g.bad) {
            h += '<button class="nd-btn nd-btn-danger nd-btn-sm" data-del-group="' + esc(g.disk) + '" data-ids="' +
              esc(g.reads.map(function(r) { return r.id; }).join(',')) + '">Delete disk and all ' + g.reads.length + ' read(s)</button>';
          } else if (g.redundant.length) {
            h += '<button class="nd-btn nd-btn-danger nd-btn-sm" data-del-group="' + esc(g.disk) + '" data-ids="' +
              esc(g.redundant.map(function(r) { return r.id; }).join(',')) + '">Delete ' + g.redundant.length + ' failed attempt(s)</button>';
          }
          h += '</div>';
          h += '<table class="nd-table nd-table-compact"><tbody>';
          g.reads.forEach(function(r) {
            var badge = GRADE[r.grade] || ['nd-badge', r.grade];
            h += '<tr><td style="width:20rem"><a href="#/disks/' + encodeURIComponent(r.id) + '"><code>' + esc(r.name) + '</code></a>' +
              (r.best ? ' <span class="nd-text-muted" style="font-size:0.75rem">best read</span>' : '') +
              '<div class="nd-text-muted" style="font-size:0.75rem"><code>' + esc(r.md5 || '') + '</code>' +
              (r.source ? ' &middot; from <code>' + esc(r.source) + '</code>' : '') + '</div></td>' +
              '<td style="width:11rem"><span class="nd-badge ' + badge[0] + '">' + badge[1] + '</span></td>' +
              '<td style="width:6rem;text-align:right">' + (r.files || '-') + ' files</td>' +
              '<td style="width:7rem;text-align:right" class="nd-text-muted">' +
              (r.imageSizeBytes ? (r.imageSizeBytes / 1024).toFixed(0) + ' KB' : '-') + '</td>' +
              '<td class="nd-text-muted">' + (r.productId ? esc(r.productId) : '') + '</td>' +
              '<td style="text-align:right"><button class="nd-btn nd-btn-sm" data-hex-read="' + esc(r.id) + '" data-name="' + esc(r.name) + '">Hex</button> ' +
              '<button class="nd-btn nd-btn-danger nd-btn-sm" data-del-read="' + esc(r.id) + '" data-name="' + esc(r.name) + '">Delete</button></td></tr>';
          });
          h += '</tbody></table></div>';
        });
        box.innerHTML = h;
        box.querySelectorAll('[data-hex-read]').forEach(function(b) {
          b.addEventListener('click', function() { openHexViewer(this.getAttribute('data-hex-read'), this.getAttribute('data-name')); });
        });
        box.querySelectorAll('[data-del-read]').forEach(function(b) {
          b.addEventListener('click', function() { deleteReads([this.getAttribute('data-del-read')], this.getAttribute('data-name'), this); });
        });
        box.querySelectorAll('[data-del-group]').forEach(function(b) {
          b.addEventListener('click', function() {
            deleteReads(this.getAttribute('data-ids').split(','), this.getAttribute('data-del-group'), this);
          });
        });
      })
      .catch(function(err) { box.innerHTML = '<p class="nd-text-muted">' + esc(String(err)) + '</p>'; });
  }

  /**
   * Delete one read or a whole group: ask the server what each entry would
   * remove, show the complete file list, and only then apply. Same dry run and
   * approval as deleting a single floppy from its own page.
   */
  function deleteReads(ids, label, btn) {
    var was = btn.textContent;
    btn.disabled = true; btn.textContent = 'Checking...';
    function fmt(b) { return b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
    Promise.all(ids.map(function(id) {
      return fetch('/api/catalog-entry?id=' + encodeURIComponent(id) + '&dryRun=1', { method: 'DELETE' })
        .then(function(r) { return r.json(); });
    })).then(function(plans) {
      btn.disabled = false; btn.textContent = was;
      var files = [], bytes = 0;
      for (var i = 0; i < plans.length; i++) {
        if (plans[i].error) { alert('Error: ' + plans[i].error); return; }
        (plans[i].files || []).forEach(function(f) { files.push(f); bytes += f.bytes || 0; });
      }
      if (!files.length) { alert('Nothing on disk to delete.'); return; }
      var list = files.map(function(f) { return '  - ' + f.path + '  (' + fmt(f.bytes) + ')'; }).join('\n');
      var msg = 'Delete ' + ids.length + ' read(s) of "' + label + '"?\n\n' +
        'These ' + files.length + ' file(s) (' + fmt(bytes) + ') will be PERMANENTLY deleted:\n\n' + list +
        '\n\nThe images are dropped from the catalog. Shared set photos are kept. ' +
        'Commit the change on the Changes page afterwards.';
      ndModal.open('<div class="nd-modal-header"><h3>Delete reads</h3>' +
        '<button class="nd-modal-close" onclick="ndModal.close()">&times;</button></div>' +
        '<div class="nd-modal-body"><pre style="user-select:text;white-space:pre-wrap;font-size:0.8rem">' + esc(msg) + '</pre>' +
        '<div style="display:flex;gap:0.5rem;justify-content:flex-end">' +
        '<button class="nd-btn nd-btn-sm" onclick="ndModal.close()">Cancel</button>' +
        '<button class="nd-btn nd-btn-danger nd-btn-sm" id="reads-del-confirm">Delete permanently</button></div></div>');
      document.getElementById('reads-del-confirm').addEventListener('click', function() {
        var b2 = this; b2.disabled = true; b2.textContent = 'Deleting...';
        Promise.all(ids.map(function(id) {
          return fetch('/api/catalog-entry?id=' + encodeURIComponent(id), { method: 'DELETE' }).then(function(r) { return r.json(); });
        })).then(function(results) {
          var failed = results.filter(function(r) { return r.error; });
          ndModal.close();
          if (failed.length) alert('Some deletions failed: ' + failed.map(function(f) { return f.error; }).join('; '));
          loadReadGroups();
        }).catch(function(err) { ndModal.close(); alert('Error: ' + String(err)); });
      });
    }).catch(function(err) { btn.disabled = false; btn.textContent = was; alert('Error: ' + String(err)); });
  }

  // ==============================================================
  // Backup set panel
  // ==============================================================
  // A WINCH-TO-FLOPP backup is one ND directory spread over a set of floppies,
  // and this archive holds several reads of some of them. The panel shows every
  // volume of the set - held, missing, or held only as an incomplete read - so
  // one disk page answers what the whole set looks like. Each volume can still
  // be opened on its own or dumped as hex.
  var backupSetCache = {};
  window.renderBackupSetPanel = function(entryId, box) {
    if (!box) return;
    if (backupSetCache[entryId]) { paintBackupSet(backupSetCache[entryId], entryId, box); return; }
    fetch('/api/backup-set?id=' + encodeURIComponent(entryId))
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.set) backupSetCache[entryId] = res.set;
        paintBackupSet(res.set, entryId, box);
      })
      .catch(function(err) { box.innerHTML = '<p class="nd-text-muted">Could not load the set: ' + esc(String(err)) + '</p>'; });
  };

  function paintBackupSet(set, entryId, box) {
    (function() {
        if (!set) { box.innerHTML = ''; return; }
        var chained = set.ordering === 'chained';
        var pct = set.pagesExpected ? Math.round(set.pagesHeld * 100 / set.pagesExpected) : 0;
        var h = '<div class="nd-card" style="margin:0.75rem 0;padding:0.75rem 1rem">';
        h += '<h4 style="margin:0 0 0.25rem">' + (chained ? 'Backup run' : 'Backup set') + ' <code>' + esc(set.name) + '</code>' +
          (set.label ? ' <span class="nd-text-muted" style="font-weight:normal">' + esc(set.label) + '</span>' : '') +
          (chained && set.runDate ? ' <span class="nd-text-muted" style="font-weight:normal">&middot; ' + esc(set.runDate) +
            (set.system ? ' &middot; ' + esc(set.system) : '') + '</span>' : '') + '</h4>';
        h += '<p style="margin:0 0 0.5rem"><span class="nd-badge ' + (set.complete ? 'nd-badge-ok' : 'nd-badge-warn') + '">' +
          esc(set.summary) + '</span> <span class="nd-text-muted">' + set.imageCount + ' image(s)' +
          (chained ? ' &middot; ' + (set.fileCount || 0) + ' file(s) named across the run'
                   : ' &middot; ' + set.pagesHeld.toLocaleString() + ' of ' + set.pagesExpected.toLocaleString() +
                     ' pages of the volumes held (' + pct + '%)') + '</span></p>';
        h += '<p class="nd-text-muted" style="margin:0 0 0.6rem;font-size:0.85rem">' + esc(set.verdict) + '</p>';
        h += chained
          ? '<table class="nd-table nd-table-compact"><thead><tr><th style="width:4rem">Volume</th><th>Image</th>' +
            '<th style="text-align:right">Files</th><th>First file</th><th>Ends</th><th style="width:11rem"></th></tr></thead><tbody>'
          : '<table class="nd-table nd-table-compact"><thead><tr><th style="width:4rem">Volume</th><th>Image</th>' +
            '<th>Status</th><th style="text-align:right">Pages</th><th>Original pages</th><th style="width:11rem"></th>' +
            '</tr></thead><tbody>';
        set.slots.forEach(function(sl) {
          if (!sl.present) {
            h += '<tr><td><strong>' + sl.volumeNumber + '</strong></td>' +
              '<td colspan="4" class="nd-text-muted">not in the archive</td>' +
              '<td><span class="nd-badge nd-badge-warn">missing</span></td></tr>';
            return;
          }
          sl.reads.forEach(function(rd, i) {
            var isCurrent = rd.id === entryId;
            h += '<tr' + (isCurrent ? ' class="ndfs-file-selected"' : '') + '>';
            h += '<td>' + (i === 0 ? '<strong>' + sl.volumeNumber + '</strong>' : '') + '</td>';
            h += '<td><a href="#/disks/' + encodeURIComponent(rd.id) + '"><code>' + esc(rd.name) + '</code></a>' +
              (i === 0 ? '' : ' <span class="nd-text-muted" style="font-size:0.75rem">alternate read</span>') +
              (isCurrent ? ' <span class="nd-badge nd-badge-info" style="font-size:0.65rem">open</span>' : '') + '</td>';
            if (chained) {
              // A BACKUP-SYSTEM volume has no number of its own: what it holds,
              // where it starts, and whether the file it was writing when the
              // floppy filled up is continued by another floppy here.
              h += '<td style="text-align:right">' + (rd.fileCount || 0) +
                (rd.staleCount ? ' <span class="nd-text-muted" style="font-size:0.75rem" title="labels left over from an older backup">+' +
                  rd.staleCount + ' stale</span>' : '') + '</td>';
              h += '<td><code style="font-size:0.8rem">' + esc(rd.firstFile || '-') + '</code></td>';
              // Only the read that stands for the volume carries the chain
              // decision; an alternate read just says where it stopped.
              h += '<td>' + (!rd.endsMidFile
                ? '<span class="nd-badge nd-badge-ok">ends clean</span>'
                : !rd.best
                  ? '<span class="nd-badge">ends mid-file</span> <code style="font-size:0.75rem">' + esc(rd.lastFile || '') + '</code>'
                  : rd.continuesTo
                    ? '<span class="nd-badge nd-badge-info">continues</span> <code style="font-size:0.75rem">' + esc(rd.lastFile || '') + '</code>'
                    : '<span class="nd-badge nd-badge-warn">cut off</span> <code style="font-size:0.75rem">' + esc(rd.brokenAt || rd.lastFile || '') +
                      '</code> <span class="nd-text-muted" style="font-size:0.75rem">no floppy here continues it</span>') + '</td>';
            } else {
            var badge = rd.status === 'complete' ? '<span class="nd-badge nd-badge-ok">complete</span>'
              : rd.status === 'partial'
                ? '<span class="nd-badge nd-badge-warn">' + (rd.sideOne ? 'side 0 only' : 'incomplete read') + '</span>'
                : '<span class="nd-badge">unknown</span>';
            h += '<td>' + badge + (rd.coverage !== null ? ' <span class="nd-text-muted" style="font-size:0.75rem">' +
              Math.round(rd.coverage * 100) + '%</span>' : '') + '</td>';
            h += '<td style="text-align:right">' + rd.pageCount.toLocaleString() +
              (rd.listedPages ? '<span class="nd-text-muted"> / ' + rd.listedPages.toLocaleString() + '</span>' : '') + '</td>';
            h += '<td class="nd-text-muted">' + (rd.pageFirst === null ? '-' : rd.pageFirst + '-' + rd.pageLast) + '</td>';
            }
            h += '<td><button class="nd-btn nd-btn-sm" data-bk-open="' + esc(rd.id) + '"' + (isCurrent ? ' disabled' : '') + '>Open</button> ' +
              '<button class="nd-btn nd-btn-sm nd-badge-info" data-bk-hex="' + esc(rd.id) + '" data-bk-name="' + esc(rd.name) + '">Hex</button></td>';
            h += '</tr>';
          });
        });
        h += '</tbody></table></div>';
        box.innerHTML = h;
        box.querySelectorAll('[data-bk-open]').forEach(function(b) {
          b.addEventListener('click', function() { openBackupViewer(this.getAttribute('data-bk-open')); });
        });
        box.querySelectorAll('[data-bk-hex]').forEach(function(b) {
          b.addEventListener('click', function() { openHexViewer(this.getAttribute('data-bk-hex'), this.getAttribute('data-bk-name')); });
        });
    })();
  }

  // ==============================================================
  // Raw image hex viewer
  // ==============================================================
  // For disks with no ND filesystem there is nothing for the NDFS viewer to
  // show, but the bytes still tell you what the disk is - a DOS boot sector, a
  // tar header, ND file names, or nothing but fill. Reads the whole image once
  // through /api/ndfs/raw (they are ~1.2 MB, local) and renders only the rows
  // in view, so scrolling a 76 800-row dump stays smooth.
  window.openHexViewer = function(entryId, label) {
    var ROW = 16, LINEH = 18;
    ndModal.open(
      '<div class="nd-modal-header"><h3>Hex view - ' + esc(label || entryId) + '</h3>' +
        '<button class="nd-modal-close" onclick="ndModal.close()">&times;</button></div>' +
      '<div style="padding:0.75rem 1.25rem;border-bottom:1px solid var(--border);display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap">' +
        '<span class="nd-text-muted" id="hexinfo">Loading...</span>' +
        '<span style="flex:1"></span>' +
        '<label style="font-size:0.85rem;cursor:pointer" title="ND text is stored with the parity bit set; stripping it makes the ASCII column readable">' +
          '<input type="checkbox" id="hexparity" checked> strip parity (7-bit ASCII)</label>' +
        '<label style="font-size:0.85rem">go to offset <input class="nd-input" id="hexgoto" style="width:9rem;font-size:0.8rem" placeholder="0x1000 or 4096"></label>' +
      '</div>' +
      '<div id="hexscroll" style="overflow:auto;max-height:65vh;background:var(--bg-sunken)">' +
        '<div id="hexspacer" style="position:relative"><pre id="hexrows" style="position:absolute;left:0;top:0;margin:0;' +
          'font-size:0.78rem;line-height:' + LINEH + 'px;white-space:pre;user-select:text"></pre></div>' +
      '</div>', { wide: true });

    var scroll = document.getElementById('hexscroll');
    var spacer = document.getElementById('hexspacer');
    var rowsEl = document.getElementById('hexrows');
    var info = document.getElementById('hexinfo');
    var bytes = null, nrows = 0;

    function hex2(b) { return (b < 16 ? '0' : '') + b.toString(16); }
    function render() {
      if (!bytes) return;
      var strip = document.getElementById('hexparity').checked;
      var top = scroll.scrollTop;
      var first = Math.max(0, Math.floor(top / LINEH) - 4);
      var count = Math.ceil(scroll.clientHeight / LINEH) + 8;
      var out = [];
      for (var r = first; r < Math.min(nrows, first + count); r++) {
        var off = r * ROW, h = '', a = '';
        for (var i = 0; i < ROW; i++) {
          if (off + i >= bytes.length) { h += '   '; a += ' '; continue; }
          var b = bytes[off + i];
          h += hex2(b) + ' ' + (i === 7 ? ' ' : '');
          var c = strip ? (b & 0x7f) : b;
          a += (c >= 0x20 && c <= 0x7e) ? String.fromCharCode(c) : '.';
        }
        out.push(('00000000' + off.toString(16)).slice(-8) + '  ' + h + ' |' + a + '|');
      }
      rowsEl.style.top = (first * LINEH) + 'px';
      rowsEl.textContent = out.join('\n');
    }

    scroll.addEventListener('scroll', render);
    document.getElementById('hexparity').addEventListener('change', render);
    document.getElementById('hexgoto').addEventListener('keydown', function(ev) {
      if (ev.key !== 'Enter') return;
      var v = this.value.trim();
      var off = /^0x/i.test(v) ? parseInt(v, 16) : parseInt(v, 10);
      if (!isNaN(off)) scroll.scrollTop = Math.floor(off / ROW) * LINEH;
    });

    fetch('/api/ndfs/raw?id=' + encodeURIComponent(entryId))
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(function(buf) {
        bytes = new Uint8Array(buf);
        nrows = Math.ceil(bytes.length / ROW);
        spacer.style.height = (nrows * LINEH) + 'px';
        info.textContent = bytes.length.toLocaleString() + ' bytes  ' + nrows.toLocaleString() + ' rows';
        render();
      })
      .catch(function(err) { info.textContent = 'Could not read the image: ' + String(err); });
  };

  // ==============================================================
  // Reusable modal system
  // ==============================================================
  window.ndModal = {
    _onClose: null,
    open: function(html, options) {
      options = options || {};
      var overlay = document.getElementById('nd-modal');
      var content = document.getElementById('nd-modal-content');
      content.innerHTML = html;
      content.className = 'nd-modal' + (options.wide ? ' nd-modal-wide' : '') + (options.photo ? ' nd-modal-photo' : '');
      ndModal._onClose = options.onClose || null;
      overlay.style.display = 'flex';
    },
    close: function() {
      var overlay = document.getElementById('nd-modal');
      if (!overlay) return;
      overlay.style.display = 'none';
      var content = document.getElementById('nd-modal-content');
      if (content) content.innerHTML = '';
      if (ndModal._onClose) {
        ndModal._onClose();
        ndModal._onClose = null;
      }
    }
  };

  // Wire overlay click to close (deferred until DOM ready)
  document.addEventListener('DOMContentLoaded', function() {
    var modalEl = document.getElementById('nd-modal');
    if (modalEl) {
      modalEl.addEventListener('click', function(ev) {
        if (ev.target === this) ndModal.close();
      });
    }
  });

  // Escape key closes modal
  document.addEventListener('keydown', function(ev) {
    var modalEl = document.getElementById('nd-modal');
    if (ev.key === 'Escape' && modalEl && modalEl.style.display === 'flex') {
      ndModal.close();
    }
  });

  // Global functions for onclick handlers
  // Image viewer with zoom, rotate, pan (same as static site)
  var pvZoom = 1, pvRotation = 0, pvPanX = 0, pvPanY = 0;
  var pvIsDragging = false, pvDragStartX = 0, pvDragStartY = 0, pvPanStartX = 0, pvPanStartY = 0;
  var PV_MIN = 0.5, PV_MAX = 10, PV_STEP = 0.25;

  function pvUpdate() {
    var img = document.getElementById('pv-image');
    var lvl = document.getElementById('pv-zoom-level');
    if (img) img.style.transform = 'translate(' + pvPanX + 'px,' + pvPanY + 'px) scale(' + pvZoom + ') rotate(' + pvRotation + 'deg)';
    if (lvl) lvl.textContent = Math.round(pvZoom * 100) + '%';
  }
  function pvReset() { pvZoom = 1; pvRotation = 0; pvPanX = 0; pvPanY = 0; pvUpdate(); }

  var pvSrc = null, pvRelPath = null;

  window.ndShowPhoto = function(src) {
    pvReset();
    pvSrc = src;
    // Derive the repo-relative image path (images/{md5}/file.JPG) from the URL,
    // so the rotated bytes can be saved back to the right file.
    pvRelPath = null;
    try {
      var path = new URL(src, location.href).pathname;
      var im = path.indexOf('/api/images/');
      var co = path.indexOf('/api/collections/');
      if (im !== -1) pvRelPath = 'images/' + decodeURIComponent(path.substring(im + '/api/images/'.length));
      else if (co !== -1) pvRelPath = 'collections/' + decodeURIComponent(path.substring(co + '/api/collections/'.length));
    } catch (e) { /* leave pvRelPath null -> Save button hidden */ }

    var saveBtn = pvRelPath
      ? '<button class="nd-btn nd-btn-sm nd-write-only" id="pv-save-btn" onclick="ndPvSaveRotation()" title="Save the current rotation back to the image file">Save rotation</button>'
      : '';

    ndModal.open(
      '<button class="nd-pv-close" onclick="ndModal.close()" title="Close (Esc)" aria-label="Close">&times;</button>' +
      '<div style="position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:grab" id="pv-container">' +
        '<img id="pv-image" src="' + src + '" style="max-width:95%;max-height:95%;transform-origin:center center;transition:transform 0.1s ease-out;user-select:none;border-radius:4px">' +
      '</div>' +
      '<div style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(0,0,0,0.7);padding:10px 16px;border-radius:8px;z-index:2001">' +
        '<button class="nd-btn nd-btn-sm" onclick="ndPvRotateL()" title="Rotate left (←)">&#8634;</button>' +
        '<button class="nd-btn nd-btn-sm" onclick="ndPvZoomOut()" title="Zoom out (-)">−</button>' +
        '<span id="pv-zoom-level" style="color:#fff;font-size:0.85rem;min-width:3rem;text-align:center">100%</span>' +
        '<button class="nd-btn nd-btn-sm" onclick="ndPvZoomIn()" title="Zoom in (+)">+</button>' +
        '<button class="nd-btn nd-btn-sm" onclick="ndPvRotateR()" title="Rotate right (→)">&#8635;</button>' +
        '<button class="nd-btn nd-btn-sm" onclick="ndPvReset()" title="Reset (R)">R</button>' +
        saveBtn +
      '</div>',
      { photo: true }
    );
    setTimeout(function() {
      var container = document.getElementById('pv-container');
      if (!container) return;
      container.addEventListener('wheel', function(e) {
        e.preventDefault();
        var delta = e.deltaY > 0 ? -PV_STEP : PV_STEP;
        var nz = Math.max(PV_MIN, Math.min(PV_MAX, pvZoom + delta));
        if (nz !== pvZoom) { pvZoom = nz; if (pvZoom <= 1) { pvPanX = 0; pvPanY = 0; } pvUpdate(); }
      }, { passive: false });
      container.addEventListener('mousedown', function(e) {
        if (e.target.tagName === 'IMG' && pvZoom > 1) {
          pvIsDragging = true; pvDragStartX = e.clientX; pvDragStartY = e.clientY; pvPanStartX = pvPanX; pvPanStartY = pvPanY;
          container.style.cursor = 'grabbing'; e.preventDefault();
        }
      });
      document.addEventListener('mousemove', function(e) {
        if (pvIsDragging) { pvPanX = pvPanStartX + (e.clientX - pvDragStartX); pvPanY = pvPanStartY + (e.clientY - pvDragStartY); pvUpdate(); }
      });
      document.addEventListener('mouseup', function() { pvIsDragging = false; var c = document.getElementById('pv-container'); if (c) c.style.cursor = 'grab'; });
    }, 0);
  };

  window.ndPvZoomIn = function() { pvZoom = Math.min(PV_MAX, pvZoom + PV_STEP); pvUpdate(); };
  window.ndPvZoomOut = function() { pvZoom = Math.max(PV_MIN, pvZoom - PV_STEP); if (pvZoom <= 1) { pvPanX = 0; pvPanY = 0; } pvUpdate(); };
  window.ndPvRotateL = function() { pvRotation = (pvRotation - 90 + 360) % 360; pvUpdate(); };
  window.ndPvRotateR = function() { pvRotation = (pvRotation + 90) % 360; pvUpdate(); };
  window.ndPvReset = function() { pvReset(); };

  // Bake the current rotation into the image pixels and save it back to disk.
  // Done client-side (canvas) so no server-side image library is needed; this
  // also strips EXIF orientation, fixing photos that come in rotated wrong.
  window.ndPvSaveRotation = function() {
    var img = document.getElementById('pv-image');
    if (!img || !pvRelPath) return;
    var deg = ((pvRotation % 360) + 360) % 360;
    if (deg === 0) { alert('No rotation applied to save.'); return; }

    var nw = img.naturalWidth, nh = img.naturalHeight;
    var swap = (deg === 90 || deg === 270);
    var canvas = document.createElement('canvas');
    canvas.width = swap ? nh : nw;
    canvas.height = swap ? nw : nh;
    var ctx = canvas.getContext('2d');
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(deg * Math.PI / 180);
    ctx.drawImage(img, -nw / 2, -nh / 2);

    var btn = document.getElementById('pv-save-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
    canvas.toBlob(function(blob) {
      if (!blob) { if (btn) { btn.disabled = false; btn.textContent = 'Save rotation'; } return; }
      var fd = new FormData();
      fd.append('path', pvRelPath);
      fd.append('image', blob, 'rotated.jpg');
      fetch('/api/images/save-rotation', { method: 'POST', body: fd })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.error) { alert('Error: ' + d.error); if (btn) { btn.disabled = false; btn.textContent = 'Save rotation'; } return; }
          // Reset rotation and force-reload every on-page <img> of this file
          // (viewer + thumbnails) with a cache-bust query, so the rotated image
          // shows immediately without a manual hard refresh.
          pvRotation = 0;
          // Record the photo's new version so EVERY future render (incl. SPA
          // back/forward) uses the fresh immutable URL.
          if (pvRelPath && d.version) photoVersions[pvRelPath] = d.version;
          var fresh = ndPhotoUrl(pvRelPath || '');
          var freshBase = fresh.split('?')[0];
          document.querySelectorAll('img').forEach(function(im) {
            if (im.src.split('?')[0].split(location.origin).pop() === freshBase || im.src.split('?')[0].indexOf(freshBase) !== -1) im.src = fresh;
          });
          pvUpdate();
          if (btn) { btn.disabled = false; btn.textContent = 'Saved ✓'; setTimeout(function() { if (btn) btn.textContent = 'Save rotation'; }, 1500); }
          loadGitStatus();
        })
        .catch(function(e) { alert('Error: ' + e); if (btn) { btn.disabled = false; btn.textContent = 'Save rotation'; } });
    }, 'image/jpeg', 0.92);
  };

  // Keyboard shortcuts for image viewer
  document.addEventListener('keydown', function(e) {
    if (!document.getElementById('pv-image')) return;
    var modal = document.getElementById('nd-modal');
    if (!modal || modal.style.display !== 'flex') return;
    if (e.key === '+' || e.key === '=') { ndPvZoomIn(); e.preventDefault(); }
    else if (e.key === '-') { ndPvZoomOut(); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { ndPvRotateR(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { ndPvRotateL(); e.preventDefault(); }
    else if (e.key === 'r' || e.key === 'R') { ndPvReset(); e.preventDefault(); }
  });

  window.openNdfsViewer = function(entryId) {

    ndModal.open(

      '<div class="ndfs-loading"><div class="ndfs-spinner"></div><div>Loading image...</div></div>',

    Promise.all([
      fetch('/api/ndfs/info?id=' + encodeURIComponent(entryId)).then(function(r) {

        return r.json();
      }),

        if (!r.ok) throw new Error('Failed to load NDFS files');

      })

    var headerHtml =

    userHtml += 'All <span class="ndfs-user-count">(' + files.length + ')</span></div>';

      '<button class="nd-btn nd-btn-sm nd-badge-os" id="ndfs-btn-extract-strip" disabled onclick="ndfsExtract(true)">Extract (strip parity)</button>' +
      '<button class="nd-btn nd-btn-sm nd-badge-info" id="ndfs-btn-hex" disabled onclick="ndfsShowHex()">View as hex</button>' +

  function ndfsRenderFileTable() {
    var files = ndfsState.files || [];
    var filtered = ndfsState.selectedUser
      ? files.filter(function(f) { return f.userName === ndfsState.selectedUser; })
      : files;

    if (filtered.length === 0) {
      return '<div class="ndfs-loading" style="padding:2rem"><div>No files found</div></div>';
    }

    var html = '<table class="ndfs-file-table"><thead><tr>' +
      '<th>Name</th><th style="text-align:right">Pages</th>' +
      '<th style="text-align:right">Size</th><th>Created</th><th>Written</th>' +
      '</tr></thead><tbody>';

    filtered.forEach(function(f, i) {
      var selected = ndfsState.selectedFile && ndfsState.selectedFile.fullName === f.fullName ? ' ndfs-file-selected' : '';
      var sizeStr = f.bytes != null ? formatBytes(f.bytes) : '-';
      var created = f.dateCreated ? f.dateCreated.substring(0, 10) : '-';
      var written = f.lastDateWritten ? f.lastDateWritten.substring(0, 10) : '-';
      var typeCls = 'nd-type-' + (f.type || 'default');

      // BPUN checksum indicator
      var crcIcon = '';
      if (f.type === 'BPUN' && f.bpunValid === true) {
        crcIcon = ' <span title="BPUN checksum valid" style="color:var(--ok);cursor:help;padding:0 0.2rem">&#10003;</span>';
      } else if (f.type === 'BPUN' && f.bpunValid === false) {
        crcIcon = ' <span title="BPUN checksum INVALID" style="color:#ff4444;cursor:help;padding:0 0.2rem;font-weight:bold">&#10007;</span>';
      } else if (f.type === 'BPUN') {
        crcIcon = ' <span title="BPUN checksum not validated" style="color:var(--text-muted);cursor:help;padding:0 0.2rem">?</span>';
      }

      var ndfsDisplayName = '<span style="color:var(--accent);font-weight:700">(' + esc(f.userName || '') + ')</span>' + esc(f.fullName);
      html += '<tr class="' + selected + '" onclick="ndfsSelectFile(' + i + ')" ondblclick="ndfsExtract(false)">' +
        '<td style="white-space:nowrap"><code style="font-size:0.78rem">' + ndfsDisplayName + crcIcon + '</code></td>' +
        '<td style="text-align:right">' + f.pages + '</td>' +
        '<td style="text-align:right">' + sizeStr + '</td>' +
        '<td style="color:var(--text-muted)">' + created + '</td>' +
        '<td style="color:var(--text-muted)">' + written + '</td>' +
        '</tr>';
    });

    html += '</tbody></table>';
    return html;
  }

  window.ndfsSelectUser = function(userName) {

  window.ndfsSelectFile = function(index) {
    var files = ndfsState.files || [];
    var filtered = ndfsState.selectedUser
      ? files.filter(function(f) { return f.userName === ndfsState.selectedUser; })
      : files;
    var file = filtered[index];

    ndfsState.selectedFile = file;

    // Update UI
    document.querySelectorAll('.ndfs-file-table tr').forEach(function(r, ri) {
      if (ri === 0) return; // skip header
      r.className = ri === index + 1 ? 'ndfs-file-selected' : '';
    });

    var label = document.getElementById('ndfs-sel-label');
    if (label) label.textContent = file.fullName + ' (' + formatBytes(file.bytes) + ')';

    var btns = ['ndfs-btn-extract', 'ndfs-btn-extract-strip', 'ndfs-btn-hex', 'ndfs-btn-text'];
    btns.forEach(function(id) {
      var btn = document.getElementById(id);
      if (btn) btn.disabled = false;
    });

    // Show BPUN button only for :BPUN files
    var bpunBtn = document.getElementById('ndfs-btn-bpun');

      if (file.type && file.type.toUpperCase() === 'BPUN') {
        bpunBtn.style.display = '';

  window.ndfsExtract = function(stripParity) {
    var file = ndfsState.selectedFile;
    if (!file || !ndfsState.entryId) return;
    var filePath = file.userName + '/' + file.fullName;
    var url = '/api/ndfs/read-file?id=' + encodeURIComponent(ndfsState.entryId) +
      '&file=' + encodeURIComponent(filePath) +
      (stripParity ? '&parity=strip' : '');

    fetch(url).then(function(r) {
      if (!r.ok) throw new Error('Failed to read file');
      return r.blob();
    }).then(function(blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = file.name + '.' + file.type;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }).catch(function(err) {
      alert('Extract failed: ' + err);
    });

  window.ndfsShowText = function() {
    var file = ndfsState.selectedFile;
    if (!file || !ndfsState.entryId) return;
    var filePath = file.userName + '/' + file.fullName;
    var url = '/api/ndfs/read-file?id=' + encodeURIComponent(ndfsState.entryId) +
      '&file=' + encodeURIComponent(filePath) + '&parity=strip';

    var filePanel = document.querySelector('.ndfs-file-panel');
    if (!filePanel) return;
    filePanel.innerHTML = '<div class="ndfs-loading"><div class="ndfs-spinner"></div><div>Loading text...</div></div>';

    fetch(url).then(function(r) {
      if (!r.ok) throw new Error('Failed to read file');
      return r.arrayBuffer();
    }).then(function(buf) {
      var bytes = new Uint8Array(buf);
      var text = '';
      for (var i = 0; i < bytes.length; i++) {
        var b = bytes[i];
        if (b >= 0x20 && b < 0x7f) {
          text += String.fromCharCode(b);
        } else if (b === 0x0a || b === 0x0d || b === 0x09) {
          text += String.fromCharCode(b);
        } else {
          text += ' ';
        }
      }
      filePanel.innerHTML =
        '<div style="padding:0.5rem 0.75rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">' +
          '<strong style="font-size:0.82rem">Text: ' + esc(file.fullName) + ' (' + formatBytes(bytes.length) + ')</strong>' +
          '<button class="nd-btn nd-btn-sm nd-btn-ghost" onclick="ndfsBackToFiles()">Back to files</button>' +
        '</div>' +
        '<div class="ndfs-text-view">' + esc(text) + '</div>';
    }).catch(function(err) {
      filePanel.innerHTML = '<div style="padding:1rem;color:var(--warn)">Error: ' + esc(String(err)) + '</div>';
    });
  };

  window.ndfsShowBpun = function() {
    var file = ndfsState.selectedFile;
    if (!file || !ndfsState.entryId) return;
    if (!file.type || file.type.toUpperCase() !== 'BPUN') return;

    var filePath = file.userName + '/' + file.fullName;
    var url = '/api/ndfs/read-file?id=' + encodeURIComponent(ndfsState.entryId) +
      '&file=' + encodeURIComponent(filePath);

    var filePanel = document.querySelector('.ndfs-file-panel');
    if (!filePanel) return;
    filePanel.innerHTML = '<div class="ndfs-loading"><div class="ndfs-spinner"></div><div>Loading BPUN data...</div></div>';

    fetch(url).then(function(r) {
      if (!r.ok) throw new Error('Failed to read file');
      return r.arrayBuffer();
    }).then(function(buf) {
      var data = new Uint8Array(buf);
      if (data.length < 10) {
        filePanel.innerHTML = '<div style="padding:1rem;color:var(--warn)">BPUN file too small</div>';
        return;
      }

      // Parse BPUN header (big-endian 16-bit words)
      function w(off) { return (data[off] << 8) | data[off + 1]; }
      var startWord = w(0);
      var bootWord = w(2);
      var actionWord = w(4);
      var address = w(6);
      var count = w(8);
      var actionStr = actionWord === 0 ? 'Execute' : 'OPCOM (' + actionWord.toString(8) + ')';

      // Calculate end address
      var endAddr = address + count - 1;

      // Checksum
      var checksum = w(10 + count * 2);
      var calcSum = 0;
      for (var ci = 0; ci < 5 + count; ci++) {
        calcSum = (calcSum + w(ci * 2)) & 0xffff;
      }
      var csValid = calcSum === checksum;

      function o(v) { return v.toString(8).padStart(6, '0'); }

      var html =
        '<div style="padding:0.5rem 0.75rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">' +
          '<strong style="font-size:0.82rem">BPUN: ' + esc(file.fullName) + '</strong>' +
          '<button class="nd-btn nd-btn-sm nd-btn-ghost" onclick="ndfsBackToFiles()">Back to files</button>' +
        '</div>' +
        '<div style="padding:0.75rem">' +
          '<table class="nd-table" style="font-size:0.82rem">' +
          '<tr><td style="color:var(--text-muted)">Start word</td><td><code>' + o(startWord) + '</code></td></tr>' +
          '<tr><td style="color:var(--text-muted)">Boot word</td><td><code>' + o(bootWord) + '</code></td></tr>' +
          '<tr><td style="color:var(--text-muted)">Action</td><td>' + esc(actionStr) + '</td></tr>' +
          '<tr><td style="color:var(--text-muted)">Load address</td><td><code>' + o(address) + '</code></td></tr>' +
          '<tr><td style="color:var(--text-muted)">End address</td><td><code>' + o(endAddr) + '</code></td></tr>' +
          '<tr><td style="color:var(--text-muted)">Word count</td><td>' + count + ' words (' + (count * 2) + ' bytes)</td></tr>' +
          '<tr><td style="color:var(--text-muted)">Checksum</td><td><code>' + o(checksum) + '</code> ' +
            (csValid ? '<span style="color:var(--ok)">VALID</span>' : '<span style="color:var(--warn)">INVALID (calc: ' + o(calcSum) + ')</span>') +
          '</td></tr>' +
          '</table>' +
        '</div>';

      filePanel.innerHTML = html;
    }).catch(function(err) {
      filePanel.innerHTML = '<div style="padding:1rem;color:var(--warn)">Error: ' + esc(String(err)) + '</div>';
    });
  };

  window.ndfsBackToFiles = function() {
    var filePanel = document.querySelector('.ndfs-file-panel');
    if (filePanel) filePanel.innerHTML = ndfsRenderFileTable();
  };

  // ==============================================================
  // Status bar + git status
  // ==============================================================
  var cachedStats = null;
  var cachedGitStatus = null;
  // URL of the most recently opened pull request, surfaced as a button on the
  // Changes page. Cleared when a new branch is started or we switch to main.
  var lastPrUrl = null;

  function updateStatusBar() {
    var statusEl = document.getElementById('nd-status');
    var theme = html.getAttribute('data-theme') || 'dark';
    if (cachedStats) {
      var parts = [];
      if (cachedStats.totalImages != null) parts.push(cachedStats.totalImages + ' floppies');
      if (cachedStats.totalProducts != null) parts.push(cachedStats.totalProducts + ' products');
      if (cachedStats.brokenCount != null && cachedStats.brokenCount > 0) parts.push(cachedStats.brokenCount + ' broken');
      parts.push(theme);
      statusEl.innerHTML = parts.join(' \u00B7 ');
      // Append git status if dirty
      if (cachedGitStatus && !cachedGitStatus.clean) {
        var totalChanges = (cachedGitStatus.changes.added.length || 0) +
          (cachedGitStatus.changes.modified.length || 0) +
          (cachedGitStatus.changes.deleted.length || 0);
        if (totalChanges > 0) {
          statusEl.innerHTML += ' \u00B7 <a href="#/changes" class="nd-footer-changes">' + totalChanges + ' uncommitted change' + (totalChanges !== 1 ? 's' : '') + '</a>';
        }
        if (cachedGitStatus.unpushed > 0) {
          statusEl.innerHTML += ' \u00B7 <span style="color:var(--info)">' + cachedGitStatus.unpushed + ' unpushed</span>';
        }
      }
    } else {
      statusEl.textContent = 'Loading... \u00B7 ' + theme;
    }
  }

  function loadGitStatus() {
    return fetch('/api/git/status')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        cachedGitStatus = data;
        updateStatusBar();
        return data;
      })
      .catch(function() {
        cachedGitStatus = null;

  function loadStats() {

      .then(function(r) { return r.json(); })
      .then(function(data) {
        cachedStats = data;

      .catch(function() {
        cachedStats = {};
        updateStatusBar();

  // ==============================================================
  // Helpers
  // ==============================================================
  // repo-relative photo path -> version (file mtime), loaded from /api/photo-versions.
  // Photos are served with a long immutable cache; the ?v= makes a changed photo a
  // distinct URL, so it's always fetched fresh without revalidation.
  var photoVersions = {};
  function ndPhotoUrl(path) {
    // Group/set photos live under collections/{slug}/ and are served separately.
    var url = (path.indexOf('collections/') === 0)
      ? '/api/collections/' + path.substring('collections/'.length)
      : '/api/images/' + (path.startsWith('images/') ? path.substring(7) : path);
    var v = photoVersions[path];
    return v ? url + '?v=' + v : url;
  }

  function ndPhotoImg(photo) {
    var url = ndPhotoUrl(photo);
    return '<img class="nd-photo-thumb" src="' + esc(url) + '" alt="Photo" onclick="ndShowPhoto(this.src)">';
  }

  // Render photo cards (disk / set / legacy) for a git storage object.
  // Shared by the floppy detail page and the matcher detail panel.
  function ndPhotoCards(git) {
    if (!git) return '';
    var hasDisk = git.diskPhotos && git.diskPhotos.length > 0;
    var hasSet = git.setPhotos && git.setPhotos.length > 0;
    var hasLegacy = git.labelPhotos && git.labelPhotos.length > 0;
    var html = '';
    if (hasDisk) {
      html += '<div class="nd-card"><h3 style="margin-bottom:0.75rem">Disk Photo</h3>';
      git.diskPhotos.forEach(function(p) { html += ndPhotoImg(p); });
      html += '</div>';
    }
    if (hasSet) {
      html += '<div class="nd-card"><h3 style="margin-bottom:0.75rem">Set Photo</h3>';
      git.setPhotos.forEach(function(p) { html += ndPhotoImg(p); });
      html += '</div>';
    }
    if (!hasDisk && !hasSet && hasLegacy) {
      html += '<div class="nd-card"><h3 style="margin-bottom:0.75rem">Photo</h3>';
      git.labelPhotos.forEach(function(p) { html += ndPhotoImg(p); });
      html += '</div>';
    }
    return html;
  }

  function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ==============================================================
  // Boot
  // ==============================================================
  loadStats();
  loadGitStatus();
  // Load photo versions before the first render so photo URLs are cache-busted
  // from the start (falls through to render even if it fails).
  fetch('/api/photo-versions')
    .then(function(r) { return r.json(); })
    .then(function(m) { if (m && !m.error) photoVersions = m; })
    .catch(function() { /* render without versions */ })
    .then(function() { navigate(); });

})();
</script>
<div id="nd-modal" class="nd-modal-overlay" style="display:none">
  <div class="nd-modal" id="nd-modal-content"></div>
</div>
</body>
</html>
