      catData.forEach(function(c) {
        html += '<tr data-catid="' + esc(c.id) + '">' +
          '<td><code>' + esc(c.id) + '</code></td>' +
          '<td class="cat-name-cell">' + esc(c.name) + '</td>' +
          '<td class="cat-desc-cell">' + esc(c.description) + '</td>' +
          '<td style="text-align:right">' + (c.productCount || 0) + '</td>' +
          '<td style="text-align:right;white-space:nowrap">' +
            '<button class="nd-icon-btn cat-edit-btn" title="Edit">&#9998;</button> ' +
            '<button class="nd-icon-btn cat-del-btn" title="Delete" style="color:var(--warn)">&#10005;</button>' +
          '</td></tr>';
      });
      html += '</tbody></table>';
      document.getElementById('cat-list').innerHTML = html;

      // Wire edit buttons
      document.querySelectorAll('.cat-edit-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var row = this.closest('tr');
          var catId = row.getAttribute('data-catid');
          var cat = catData.find(function(c) { return c.id === catId; });
          if (!cat) return;
          var nameCell = row.querySelector('.cat-name-cell');
          var descCell = row.querySelector('.cat-desc-cell');
          nameCell.innerHTML = '<input class="nd-input cat-edit-name" value="' + esc(cat.name) + '" style="padding:0.2rem 0.4rem;font-size:0.85rem;width:100%">';
          descCell.innerHTML = '<div style="display:flex;gap:0.3rem;align-items:center"><input class="nd-input cat-edit-desc" value="' + esc(cat.description) + '" style="padding:0.2rem 0.4rem;font-size:0.85rem;flex:1">' +
            '<button class="nd-btn nd-btn-primary nd-btn-sm cat-save-btn">Save</button>' +
            '<button class="nd-btn nd-btn-ghost nd-btn-sm cat-cancel-btn">Cancel</button></div>';

          var nameInput = nameCell.querySelector('.cat-edit-name');
          nameInput.focus();
          nameInput.select();

          row.querySelector('.cat-save-btn').addEventListener('click', function() {
            var newName = nameInput.value.trim();
            var newDesc = row.querySelector('.cat-edit-desc').value.trim();
            if (!newName) return;
            fetch('/api/categories', {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: catId, name: newName, description: newDesc })
            }).then(function(r) { return r.json(); }).then(function(data) {
              if (data.success) loadAndRender();
            });
          });
          row.querySelector('.cat-cancel-btn').addEventListener('click', function() {
            renderCatTable();
          });
          nameInput.addEventListener('keydown', function(ev) {
            if (ev.key === 'Enter') row.querySelector('.cat-save-btn').click();
            if (ev.key === 'Escape') row.querySelector('.cat-cancel-btn').click();
          });
        });
      });

      // Wire delete buttons
      document.querySelectorAll('.cat-del-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var row = this.closest('tr');
          var catId = row.getAttribute('data-catid');
          var cat = catData.find(function(c) { return c.id === catId; });
          if (!cat) return;
          var msg = 'Delete category "' + cat.name + '" (' + cat.id + ')?';
          if (cat.productCount > 0) msg += '\n\nThis will remove it from ' + cat.productCount + ' product(s).';
          if (!confirm(msg)) return;
          fetch('/api/categories', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: catId })
          }).then(function(r) { return r.json(); }).then(function(data) {
            if (data.success) loadAndRender();
          });
        });
      });
    }

    loadAndRender();

    // Add category form
    document.getElementById('cat-new-save').addEventListener('click', function() {
      var cid = document.getElementById('cat-new-id').value.trim();
      var cname = document.getElementById('cat-new-name').value.trim();
      var cdesc = document.getElementById('cat-new-desc').value.trim();
      var errEl = document.getElementById('cat-new-error');
      if (!cid) { errEl.textContent = 'Category ID is required'; errEl.style.display = 'block'; return; }
      if (!cname) { errEl.textContent = 'Category name is required'; errEl.style.display = 'block'; return; }

      fetch('/api/categories', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: cid, name: cname, description: cdesc })
      }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.error) { errEl.textContent = data.error; errEl.style.display = 'block'; return; }
        errEl.style.display = 'none';
        document.getElementById('cat-new-id').value = '';
        document.getElementById('cat-new-name').value = '';
        document.getElementById('cat-new-desc').value = '';
        loadAndRender();
      });
    });
    document.getElementById('cat-new-id').addEventListener('keydown', function(ev) {
      if (ev.key === 'Enter') document.getElementById('cat-new-name').focus();
    });
    document.getElementById('cat-new-name').addEventListener('keydown', function(ev) {
      if (ev.key === 'Enter') document.getElementById('cat-new-desc').focus();
    });
    document.getElementById('cat-new-desc').addEventListener('keydown', function(ev) {
      if (ev.key === 'Enter') document.getElementById('cat-new-save').click();
    });
  }

  function renderProductDetail(el, params) {
    var pid = params.id || '';
    el.innerHTML = '<div><p class="nd-text-muted">Loading product ' + esc(pid) + '...</p></div>';

    fetch('/api/product-detail?id=' + encodeURIComponent(pid)).then(function(r) {
      if (!r.ok) throw new Error('Product not found');
      return r.json();
    }).then(function(data) {
      var nameDisplay = (data.productName && data.productName !== data.productId)
        ? esc(data.productName)
        : '<span class="nd-text-muted" style="font-style:italic">unnamed</span>';

      var siblingInfo = '';
      if (data.siblingId) {
        siblingInfo = '<span class="nd-text-muted" style="font-size:0.85rem">also <a href="#/products/' + esc(data.siblingId) + '"><code>' + esc(data.siblingId) + '</code></a></span>';
      }

      var catChips = '';
      if (data.categories && data.categories.length > 0) {
        data.categories.forEach(function(catId) {
          catChips += '<span style="display:inline-block;padding:0.15rem 0.5rem;border-radius:0.75rem;font-size:0.75rem;background:var(--accent-bg);border:1px solid var(--border);margin-right:0.25rem">' + esc(catId) + '</span>';
        });
      }

      var platBadges = '';
      if (data.platform && data.platform.length > 0) {
        data.platform.forEach(function(pl) {
          platBadges += '<span class="nd-badge" style="font-size:0.7rem">' + esc(pl) + '</span>';
        });
      }

      var html = '<div class="nd-product-header">' +
        '<h2>' + esc(data.productId) + '</h2>' +
        '<span class="nd-product-name" id="pd-name-display">' + nameDisplay + '</span>' +
        '<button class="nd-icon-btn nd-write-only" id="pd-edit-name-btn" title="Edit name">&#9998;</button>' +
        (data.productId === '(unmatched)' ? '' : '<button class="nd-btn nd-btn-ghost nd-btn-sm nd-write-only" id="pd-change-id-btn" title="Change product ID" style="margin-left:0.25rem">Change ID</button>') +
        '<span class="nd-badge nd-badge-info">' + data.totalImages + ' images</span>' +
        platBadges +
        catChips +
        siblingInfo +
      '</div>' +
      (data.description ? '<p class="nd-text-muted" style="margin-bottom:1rem">' + esc(data.description) + '</p>' : '') +
      '<div id="pd-edit-name" style="display:none;margin-bottom:1rem">' +
        '<div style="display:flex;gap:0.5rem;align-items:center;max-width:500px">' +
          '<input class="nd-input" id="pd-edit-name-input" value="' + esc(data.productName || '') + '" placeholder="Product name" style="flex:1">' +
          '<button class="nd-btn nd-btn-primary nd-btn-sm" id="pd-edit-name-save">Save</button>' +
          '<button class="nd-btn nd-btn-ghost nd-btn-sm" id="pd-edit-name-cancel">Cancel</button>' +
        '</div>' +
      '</div>' +
      '<div id="pd-change-id" style="display:none;margin-bottom:1rem">' +
        '<div style="display:flex;gap:0.5rem;align-items:center;max-width:600px;flex-wrap:wrap">' +
          '<label style="font-size:0.85rem;color:var(--text-muted)">New product ID:</label>' +
          '<input class="nd-input" id="pd-change-id-input" placeholder="e.g. ND-99999" style="flex:1;min-width:180px">' +
          '<button class="nd-btn nd-btn-primary nd-btn-sm" id="pd-change-id-preview">Preview changes</button>' +
          '<button class="nd-btn nd-btn-ghost nd-btn-sm" id="pd-change-id-cancel">Cancel</button>' +
        '</div>' +
        '<p class="nd-text-muted" style="font-size:0.8rem;margin-top:0.4rem">Re-links every floppy under <code>' + esc(data.productId) + '</code> to the new ID. You will see the affected floppies and confirm before anything changes.</p>' +
      '</div>';

      if (data.versions.length === 0) {
        html += '<div class="nd-placeholder"><p>No disk images for this product yet.</p></div>';
      }

      data.versions.forEach(function(v) {
        var diskCount = Object.values(v.languages).reduce(function(sum, disks) { return sum + disks.length; }, 0);
        html += '<details class="nd-version-section" open>' +
          '<summary>' +
            '<span class="nd-badge">' + esc(v.version) + '</span>' +
            '<span>Version ' + esc(v.version) + '</span>' +
            '<span class="nd-text-muted" style="font-size:0.8rem;margin-left:auto">' + diskCount + ' disk' + (diskCount !== 1 ? 's' : '') + '</span>' +
          '</summary>';

        // Set photos at version level
        if (v.setPhotos && v.setPhotos.length > 0) {
          html += '<div style="padding:0.75rem 1rem;border-bottom:1px solid var(--border);display:flex;gap:0.75rem;flex-wrap:wrap;align-items:flex-start">';
          v.setPhotos.forEach(function(photo) { html += ndPhotoImg(photo); });
          if (v.labelTranscription) {
            html += '<a href="' + esc(ndPhotoUrl(v.labelTranscription)) + '" target="_blank" class="nd-btn nd-btn-ghost" style="font-size:0.8rem">labels.txt</a>';
          }
          html += '</div>';
        }

        html += '<div class="nd-disk-grid">';
        var langs = Object.keys(v.languages).sort();
        langs.forEach(function(lang) {
          var disks = v.languages[lang];
          html += '<div class="nd-lang-group">' +
            '<h4>' + esc(lang) + ' (' + disks.length + ' disk' + (disks.length !== 1 ? 's' : '') + ')</h4>';

          disks.sort(function(a, b) { return (a.diskNumber || 0) - (b.diskNumber || 0); });
          disks.forEach(function(d) {
            var dImage = (d.imagePath || '').split('/').pop().replace(/\.img\.gz$/i, '');
            var volDisplay = d.volumeName || d.volumeLabel || dImage || d.id;
            var hasDiskPhoto = d.diskPhotos && d.diskPhotos.length > 0;
            var photoDot = hasDiskPhoto
              ? '<span class="nd-photo-dot nd-photo-dot-yes" title="Has disk label photo">&#9679;</span>'
              : '<span class="nd-photo-dot nd-photo-dot-no" title="No disk label photo">&#9675;</span>';

            html += '<div class="nd-disk-card">' +
              photoDot +
              '<a href="#/disks/' + encodeURIComponent(d.id) + '">' + esc(volDisplay) + '</a> ' +
              (dImage && dImage !== volDisplay
                ? '<span class="nd-text-muted" style="font-size:0.8rem">' + esc(dImage) + '</span> ' : '') +
              (d.bootFormat && d.bootFormat !== 'none' ? '<span class="nd-badge">' + esc(d.bootFormat) + '</span> ' : '') +
              '<span class="nd-text-muted" style="font-size:0.78rem">' + (d.totalPages || '-') + 'p / ' + (d.fileCount || 0) + 'f</span>' +
            '</div>';
          });

          html += '</div>';
        });

        html += '</div></details>';
      });

      el.innerHTML = html;

      // Wire product name edit
      var editBtn = document.getElementById('pd-edit-name-btn');
      var editPanel = document.getElementById('pd-edit-name');
      var editInput = document.getElementById('pd-edit-name-input');
      if (editBtn && editPanel && editInput) {
        editBtn.addEventListener('click', function() {
          editPanel.style.display = 'block';
          editInput.focus();
          editInput.select();
        });
        document.getElementById('pd-edit-name-cancel').addEventListener('click', function() {
          editPanel.style.display = 'none';
        });
        document.getElementById('pd-edit-name-save').addEventListener('click', function() {
          var newName = editInput.value.trim();
          if (!newName) return;
          fetch('/api/products', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: data.productId, name: newName })
          }).then(function(r) { return r.json(); }).then(function(resp) {
            if (resp.success) {
              document.getElementById('pd-name-display').textContent = newName;
              editPanel.style.display = 'none';
            }
          });
        });
        editInput.addEventListener('keydown', function(ev) {
          if (ev.key === 'Enter') document.getElementById('pd-edit-name-save').click();
          if (ev.key === 'Escape') document.getElementById('pd-edit-name-cancel').click();
        });
      }

      // Wire "Change ID" -> preview affected floppies, then confirm
      var changeIdBtn = document.getElementById('pd-change-id-btn');
      var changeIdPanel = document.getElementById('pd-change-id');
      var changeIdInput = document.getElementById('pd-change-id-input');
      if (changeIdBtn && changeIdPanel && changeIdInput) {
        changeIdBtn.addEventListener('click', function() {
          var show = changeIdPanel.style.display === 'none';
          changeIdPanel.style.display = show ? 'block' : 'none';
          if (show) changeIdInput.focus();
        });
        document.getElementById('pd-change-id-cancel').addEventListener('click', function() {
          changeIdPanel.style.display = 'none';
        });
        document.getElementById('pd-change-id-preview').addEventListener('click', function() {
          previewRenameProductId(data.productId, changeIdInput.value.trim());
        });
        changeIdInput.addEventListener('keydown', function(ev) {
          if (ev.key === 'Enter') document.getElementById('pd-change-id-preview').click();
          if (ev.key === 'Escape') document.getElementById('pd-change-id-cancel').click();
        });
      }
    }).catch(function(err) {
      el.innerHTML = '<div class="nd-placeholder"><h2>Error</h2><p>' + esc(String(err)) + '</p><p><a href="#/products">Back to products</a></p></div>';
    });
  }

  // Ask the server which floppies a product-ID change would affect, then show
  // a confirmation modal before applying anything.
  function previewRenameProductId(oldId, newId) {
    if (!newId) { return; }
    fetch('/api/products/rename-id', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ oldId: oldId, newId: newId, confirm: false })
    }).then(function(r) { return r.json(); }).then(function(data) {
      if (data.error) { alert('Error: ' + data.error); return; }
      showRenameProductIdModal(data);
    }).catch(function(err) { alert('Error: ' + String(err)); });
  }

  function showRenameProductIdModal(p) {
    var rows;
    if (!p.affected || p.affected.length === 0) {
      rows = '<p class="nd-text-muted">No floppies are linked to this product — only the product record will be renamed.</p>';
    } else {
      rows = '<div style="max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:6px">' +
        '<table class="nd-table nd-table-compact" style="margin:0"><thead><tr>' +
        '<th>Volume</th><th>Version</th><th>Disk</th><th>ID</th></tr></thead><tbody>';
      p.affected.forEach(function(f) {
        rows += '<tr><td><code>' + esc(f.volumeName || '(null)') + '</code></td>' +
          '<td>' + esc(f.version || '-') + '</td>' +
          '<td>' + (f.diskNumber != null ? f.diskNumber : '-') + '</td>' +
          '<td><code style="font-size:0.75rem">' + esc(f.id) + '</code></td></tr>';
      });
      rows += '</tbody></table></div>';
    }

    var sib = (p.siblingProducts && p.siblingProducts.length)
      ? '<p style="margin-top:0.75rem;font-size:0.85rem">Sibling reference(s) will also be updated: ' +
        p.siblingProducts.map(function(s) { return '<code>' + esc(s) + '</code>'; }).join(', ') + '</p>'
      : '';

    var conflictBlock = p.conflict
      ? '<div class="nd-card" style="border-color:var(--warn)"><strong style="color:var(--warn)">Cannot rename:</strong> ' + esc(p.conflictReason || 'conflict') + '</div>'
      : '';

    var count = p.affected ? p.affected.length : 0;
    var confirmBtn = p.conflict ? '' :
      '<button class="nd-btn nd-btn-primary" id="rename-id-confirm">Rename ' +
        (count ? count + ' floppy(s) + product' : 'product') + '</button>';

    ndModal.open(
      '<div class="nd-modal-header">' +
        '<h3>Change product ID</h3>' +
        '<button class="nd-modal-close" onclick="ndModal.close()">&times;</button>' +
      '</div>' +
      '<div class="nd-modal-body">' +
        '<p>Rename <code>' + esc(p.oldId) + '</code>' + (p.productName ? ' (' + esc(p.productName) + ')' : '') +
          ' &rarr; <code>' + esc(p.newId) + '</code></p>' +
        conflictBlock +
        '<p style="margin:0.5rem 0;font-size:0.9rem">' + count + ' floppy(s) will be re-linked:</p>' +
        rows + sib +
      '</div>' +
      '<div style="display:flex;gap:0.5rem;justify-content:flex-end;padding:0.75rem 1rem;border-top:1px solid var(--border)">' +
        '<button class="nd-btn nd-btn-ghost" onclick="ndModal.close()">Cancel</button>' +
        confirmBtn +
      '</div>',
      { wide: true }
    );

    var cbtn = document.getElementById('rename-id-confirm');
    if (cbtn) cbtn.addEventListener('click', function() { applyRenameProductId(p.oldId, p.newId); });
  }

  function applyRenameProductId(oldId, newId) {
    var btn = document.getElementById('rename-id-confirm');
    if (btn) { btn.disabled = true; btn.textContent = 'Renaming...'; }
    fetch('/api/products/rename-id', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ oldId: oldId, newId: newId, confirm: true })
    }).then(function(r) { return r.json(); }).then(function(data) {
      if (data.error) {
        alert('Error: ' + data.error);
        if (btn) { btn.disabled = false; btn.textContent = 'Retry'; }
        return;
      }
      ndModal.close();
      loadGitStatus();
      location.hash = '#/products/' + encodeURIComponent(newId);
    }).catch(function(err) {
      alert('Error: ' + String(err));
      if (btn) { btn.disabled = false; }
    });
  }

  // ==============================================================
  // Actions / Git staging screen
  // ==============================================================
  function renderActions(el) {
    el.innerHTML = '<div><p class="nd-text-muted">Loading git status...</p></div>';

    fetch('/api/git/status').then(function(r) { return r.json(); }).then(function(gs) {
      cachedGitStatus = gs;
      updateStatusBar();

      var h = '<h2>Changes</h2>';
      h += '<p class="nd-text-muted" style="margin-bottom:1rem">Branch: <code>' + esc(gs.branch) + '</code>';
      if (gs.unpushed > 0) h += ' &mdash; <span style="color:var(--info)">' + gs.unpushed + ' unpushed commit' + (gs.unpushed !== 1 ? 's' : '') + '</span>';
      h += '</p>';

      h += '<div class="nd-actions-grid">';

      // Section 1: Uncommitted changes
      h += '<div class="nd-card">';
      h += '<h3 style="margin-bottom:0.75rem">Uncommitted Changes</h3>';

      if (gs.clean) {
        h += '<p class="nd-text-muted">Working directory is clean.</p>';
      } else {
        var ef = gs.enrichedFiles || [];
        var images = ef.filter(function(f) { return f.type === 'image'; });
        var artifacts = ef.filter(function(f) { return f.type === 'artifact'; });
        var catalogFiles = ef.filter(function(f) { return f.type === 'catalog'; });
        var productFiles = ef.filter(function(f) { return f.type === 'products'; });
        var otherFiles = ef.filter(function(f) { return f.type === 'other'; });

        // Images: show enriched info
        if (images.length > 0) {
          h += '<div class="nd-file-group">';
          h += '<h4><span class="nd-badge nd-badge-ok">' + images.length + '</span> Floppy images</h4>';
          h += '<table class="nd-table nd-table-compact"><thead><tr><th>Volume</th><th>Product</th><th>Contributor</th><th></th><th></th></tr></thead><tbody>';
          images.forEach(function(f) {
            var vol = f.volumeName ? '<a href="#/disks/' + encodeURIComponent(f.path.replace(/.*\//, '').replace('.img.gz','')) + '"><code>' + esc(f.volumeName) + '</code></a>' : '<span class="nd-text-muted">' + esc(f.path.split('/').pop()) + '</span>';
            var prod = f.productId ? '<a href="#/products/' + encodeURIComponent(f.productId) + '">' + esc(f.productId) + '</a>' + (f.version ? ' ' + esc(f.version) : '') : '<span class="nd-text-muted">-</span>';
            var statusCls = f.status === 'added' ? 'nd-badge-ok' : f.status === 'deleted' ? 'nd-badge-warn' : 'nd-badge-info';
            var statusLabel = f.status === 'added' ? 'new' : f.status === 'deleted' ? 'deleted' : 'modified';
            h += '<tr><td>' + vol + '</td><td>' + prod + '</td><td>' + esc(f.contributor || '-') + '</td>';
            h += '<td><span class="nd-badge ' + statusCls + '">' + statusLabel + '</span></td>';
            h += '<td><button class="nd-icon-btn nd-changes-view" data-path="' + esc(f.path.replace(/\.img\.gz$/, '.yaml')) + '" title="View metadata">&#128269;</button></td>';
            h += '</tr>';
          });
          h += '</tbody></table></div>';
        }

        // Artifacts: photos, labels, logs
        if (artifacts.length > 0) {
          h += '<div class="nd-file-group">';
          h += '<h4><span class="nd-badge nd-badge-info">' + artifacts.length + '</span> Photos, labels &amp; logs</h4>';
          h += '<ul class="nd-file-list">';
          artifacts.forEach(function(f) {
            var context = f.productId ? ' <span class="nd-text-muted">(' + esc(f.productId) + (f.version ? ' ' + esc(f.version) : '') + ')</span>' : '';
            var statusBadge = f.status === 'added' ? 'ok' : f.status === 'deleted' ? 'warn' : 'info';
            h += '<li><span class="nd-badge nd-badge-' + statusBadge + '" style="font-size:0.7rem">' + esc(f.status) + '</span> ' + esc(f.path.split('/').pop()) + context + '</li>';
          });
          h += '</ul></div>';
        }

        function renderChangeFile(f) {
          var statusCls = f.status === 'added' ? 'nd-badge-ok' : f.status === 'deleted' ? 'nd-badge-warn' : 'nd-badge-info';
          var statusLabel = f.status === 'added' ? 'new' : f.status === 'deleted' ? 'deleted' : 'modified';
          var viewBtn = f.status !== 'deleted' ? ' <button class="nd-icon-btn nd-changes-view" data-path="' + esc(f.path) + '" title="View/diff">&#128269;</button>' : '';
          return '<li><span class="nd-badge ' + statusCls + '" style="font-size:0.7rem">' + statusLabel + '</span> ' + esc(f.path) + viewBtn + '</li>';
        }

        // Catalog + product + other
        if (catalogFiles.length > 0) {
          h += '<div class="nd-file-group"><h4><span class="nd-badge nd-badge-info">' + catalogFiles.length + '</span> Catalog changes</h4>';
          h += '<ul class="nd-file-list">';
          catalogFiles.forEach(function(f) { h += renderChangeFile(f); });
          h += '</ul></div>';
        }
        if (productFiles.length > 0) {
          h += '<div class="nd-file-group"><h4><span class="nd-badge nd-badge-product">' + productFiles.length + '</span> Product changes</h4>';
          h += '<ul class="nd-file-list">';
          productFiles.forEach(function(f) { h += renderChangeFile(f); });
          h += '</ul></div>';
        }
        if (otherFiles.length > 0) {
          h += '<div class="nd-file-group"><h4><span class="nd-badge nd-badge-patch">' + otherFiles.length + '</span> Other</h4>';
          h += '<ul class="nd-file-list">';
          otherFiles.forEach(function(f) { h += renderChangeFile(f); });
          h += '</ul></div>';
        }

        h += '<p style="margin-top:0.75rem;font-size:0.85rem;color:var(--text-muted)">Total: ' + ef.length + ' file(s)</p>';
      }
      h += '</div>';

      // Section 2: Actions
      h += '<div class="nd-card">';
      h += '<h3 style="margin-bottom:0.75rem">Git Actions</h3>';

      // Diff button
      h += '<div class="nd-action-btns">';
      h += '<button class="nd-btn" id="actions-diff-btn">Review diff</button>';
      var onDefaultBranch = (gs.branch === 'main' || gs.branch === 'master');
      var hasWork = !gs.clean || gs.unpushed > 0;
      if (onDefaultBranch) {
        // On main you can't commit/push directly -- the only move is to start a
        // feature branch; you commit and open the PR from there.
        h += '<button class="nd-btn nd-btn-primary" id="actions-branch-btn"' + (gs.clean ? ' disabled' : '') + ' title="Move your changes onto a new feature branch">Create branch</button>';
      } else {
        h += '<button class="nd-btn" id="actions-commit-btn"' + (gs.clean ? ' disabled' : '') + '>Commit</button>';
        h += '<button class="nd-btn nd-btn-primary" id="actions-commitpr-btn"' + (hasWork ? '' : ' disabled') + ' title="Commit pending changes, push this branch, and open a pull request">Commit &amp; PR</button>';
        h += '<button class="nd-btn" id="actions-syncmain-btn"' + (gs.clean ? '' : ' disabled') + ' title="Switch to an up-to-date main (after the PR merged); deletes this branch if merged">Switch to main &amp; pull</button>';
      }
      h += '<button class="nd-btn nd-btn-danger" id="actions-revert-btn"' + (gs.clean ? ' disabled' : '') + '>Revert all</button>';
      h += '</div>';

      // Commit message input
      var defaultMsg = '';
      if (!gs.clean) {
        var parts = [];
        if (gs.summary.newImages > 0) parts.push('Import ' + gs.summary.newImages + ' image' + (gs.summary.newImages !== 1 ? 's' : ''));
        if (gs.summary.modifiedEntries > 0) parts.push('update ' + gs.summary.modifiedEntries + ' catalog entr' + (gs.summary.modifiedEntries !== 1 ? 'ies' : 'y'));
        if (gs.summary.newProducts > 0) parts.push('update ' + gs.summary.newProducts + ' product' + (gs.summary.newProducts !== 1 ? 's' : ''));
        if (gs.summary.otherFiles > 0) parts.push(gs.summary.otherFiles + ' other file' + (gs.summary.otherFiles !== 1 ? 's' : ''));
        defaultMsg = parts.join(', ');
      }
      h += '<div class="nd-commit-input">';
      h += '<input class="nd-input" id="actions-commit-msg" type="text" placeholder="Commit message / PR title" value="' + esc(defaultMsg) + '">';
      h += '</div>';

      // PR description -- pre-filled default from the change summary, editable
      // before the PR is opened.
      var defaultBody = '';
      if (!gs.clean) {
        var bparts = [];
        if (gs.summary.newImages > 0) bparts.push('- Imported ' + gs.summary.newImages + ' disk image' + (gs.summary.newImages !== 1 ? 's' : ''));
        if (gs.summary.modifiedEntries > 0) bparts.push('- Updated ' + gs.summary.modifiedEntries + ' catalog entr' + (gs.summary.modifiedEntries !== 1 ? 'ies' : 'y'));
        if (gs.summary.newProducts > 0) bparts.push('- Updated ' + gs.summary.newProducts + ' product' + (gs.summary.newProducts !== 1 ? 's' : ''));
        if (gs.summary.otherFiles > 0) bparts.push('- ' + gs.summary.otherFiles + ' other file' + (gs.summary.otherFiles !== 1 ? 's' : ''));
        if (bparts.length) defaultBody = '## Changes\n' + bparts.join('\n');
      }
      h += '<textarea class="nd-input" id="actions-pr-body" rows="5" placeholder="Pull request description (editable)" style="width:100%;margin-top:0.5rem;font-family:inherit;resize:vertical">' + esc(defaultBody) + '</textarea>';

      // Diff output area
      h += '<div id="actions-diff-area"></div>';

      // PR link (populated after Commit & PR). Rendered from module state so it
      // survives the async re-render that follows a successful Commit & PR.
      h += '<div id="actions-pr-link" style="margin:0.75rem 0">';
      if (lastPrUrl) {
        h += '<a href="' + esc(lastPrUrl) + '" target="_blank" rel="noopener" class="nd-btn nd-btn-primary">Show pull request on GitHub &#8599;</a>';
      }
      h += '</div>';

      // Action log
      h += '<div id="actions-log" class="nd-action-log" style="display:none"></div>';

      h += '</div>';
      h += '</div>'; // close grid

      el.innerHTML = h;

      // Wire up buttons
      document.getElementById('actions-diff-btn').addEventListener('click', function() {
        var area = document.getElementById('actions-diff-area');
        area.innerHTML = '<p class="nd-text-muted">Loading diff...</p>';
        fetch('/api/git/diff').then(function(r) { return r.json(); }).then(function(data) {
          area.innerHTML = '<pre class="nd-diff-output">' + esc(data.stat || '(no diff)') + '</pre>';
        }).catch(function(err) {
          area.innerHTML = '<p style="color:var(--warn)">Error: ' + esc(String(err)) + '</p>';
        });
      });

      // Wire all view/diff buttons
      document.querySelectorAll('.nd-changes-view').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var filePath = this.getAttribute('data-path');
          var area = document.getElementById('actions-diff-area');
          area.innerHTML = '<p class="nd-text-muted">Loading ' + esc(filePath) + '...</p>';
          fetch('/api/git/diff?file=' + encodeURIComponent(filePath))
            .then(function(r) { return r.json(); })
            .then(function(data) {
              area.innerHTML = '<div class="nd-card" style="margin-top:0.75rem"><h4 style="margin-bottom:0.5rem"><code>' + esc(data.file) + '</code></h4><pre class="nd-diff-output">' + esc(data.diff || '(empty)') + '</pre></div>';
            })
            .catch(function(err) {
              area.innerHTML = '<p style="color:var(--warn)">Error: ' + esc(String(err)) + '</p>';
            });
        });
      });

      var commitBtn = document.getElementById('actions-commit-btn');
      if (commitBtn) commitBtn.addEventListener('click', function() {
        var msg = document.getElementById('actions-commit-msg').value.trim();
        if (!msg) { alert('Please enter a commit message.'); return; }
        var logEl = document.getElementById('actions-log');
        logEl.style.display = 'block';
        logEl.textContent = 'Committing...\n';
        fetch('/api/git/commit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg })
        }).then(function(r) { return r.json(); }).then(function(data) {
          if (data.error) { logEl.textContent += 'Error: ' + data.error + '\n'; return; }
          logEl.textContent += 'Committed: ' + data.message + '\n';
          loadGitStatus().then(function() { renderActions(el); });
        }).catch(function(err) {
          logEl.textContent += 'Error: ' + String(err) + '\n';
        });
      });

      // Step 1: create a feature branch (only shown on the default branch)
      var branchBtn = document.getElementById('actions-branch-btn');
      if (branchBtn) branchBtn.addEventListener('click', function() {
        var suggested = 'import-' + new Date().toISOString().slice(0, 10);
        var branch = prompt('New branch name (your changes move here):', suggested);
        if (!branch) return;
        var logEl = document.getElementById('actions-log');
        logEl.style.display = 'block';
        logEl.textContent = 'Creating branch "' + branch + '"...\n';
        fetch('/api/git/branch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ branch: branch })
        }).then(function(r) { return r.json(); }).then(function(data) {
          if (data.error) { logEl.textContent += 'Error: ' + data.error + '\n'; return; }
          logEl.textContent += 'On branch "' + data.branch + '". Now Commit, then Commit & PR.\n';
          lastPrUrl = null;
          loadGitStatus().then(function() { renderActions(el); });
        }).catch(function(err) {
          logEl.textContent += 'Error: ' + String(err) + '\n';
        });
      });

      // Switch back to an up-to-date main after the PR merged (on a clean branch)
      var syncMainBtn = document.getElementById('actions-syncmain-btn');
      if (syncMainBtn) syncMainBtn.addEventListener('click', function() {
        var logEl = document.getElementById('actions-log');
        logEl.style.display = 'block';
        logEl.textContent = 'Switching to main and pulling...\n';
        fetch('/api/git/sync-main', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
          .then(function(r) { return r.json(); }).then(function(data) {
            if (data.error) { logEl.textContent += 'Error: ' + data.error + '\n'; return; }
            logEl.textContent += (data.log || '') + '\n';
            logEl.textContent += data.deletedBranch ? ('Deleted merged branch "' + data.deletedBranch + '".\n') : '';
            logEl.textContent += 'Now on main.\n';
            lastPrUrl = null;
            loadGitStatus().then(function() { renderActions(el); });
          }).catch(function(err) { logEl.textContent += 'Error: ' + String(err) + '\n'; });
      });

      // Step 2: commit pending changes, push the branch, and open a PR (on a branch)
      var commitPrBtn = document.getElementById('actions-commitpr-btn');
      if (commitPrBtn) commitPrBtn.addEventListener('click', function() {
        var title = (document.getElementById('actions-commit-msg').value || '').trim();
        if (!title) { title = prompt('Pull request title:', 'Update catalog') || ''; if (!title) return; }
        var prBody = (document.getElementById('actions-pr-body').value || '').trim();
        var logEl = document.getElementById('actions-log');
        logEl.style.display = 'block';
        logEl.textContent = 'Committing, pushing branch, opening PR...\n';
        // Open a blank tab NOW, inside the click gesture, so the browser does
        // not block it as a popup. We point it at the PR once it's created
        // (and close it if the PR could not be opened).
        var prWindow = window.open('', '_blank');
        fetch('/api/git/commit-pr', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: title, message: title, body: prBody })
        }).then(function(r) { return r.json(); }).then(function(data) {
          if (data.error) {
            logEl.textContent += 'Error: ' + data.error + '\n';
            if (prWindow) prWindow.close();
            return;
          }
          logEl.textContent += (data.log || '') + '\n';
          // Stash the PR URL so renderActions can surface it as a button -- the
          // re-render is async, so we cannot poke the DOM right after it returns.
          var match = data.prUrl ? String(data.prUrl).match(/https:\/\/github\.com\/\S+\/pull\/\d+/) : null;
          lastPrUrl = match ? match[0] : null;
          // Navigate the pre-opened tab to the PR (or close it if none).
          if (prWindow) {
            if (lastPrUrl) prWindow.location.href = lastPrUrl;
            else prWindow.close();
          }
          if (!lastPrUrl) logEl.textContent += 'Branch pushed -- open the pull request on GitHub.\n';
          loadGitStatus().then(function() { renderActions(el); });
        }).catch(function(err) {
          logEl.textContent += 'Error: ' + String(err) + '\n';
          if (prWindow) prWindow.close();
        });
      });

      document.getElementById('actions-revert-btn').addEventListener('click', function() {
        if (!confirm('This will revert ALL uncommitted changes and delete untracked images. Are you sure?')) return;
        var logEl = document.getElementById('actions-log');
        logEl.style.display = 'block';
        logEl.textContent = 'Reverting...\n';
        fetch('/api/git/revert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ confirm: true })
        }).then(function(r) { return r.json(); }).then(function(data) {
          if (data.error) { logEl.textContent += 'Error: ' + data.error + '\n'; return; }
          logEl.textContent += 'Reverted ' + data.reverted + ' file(s)\n';
          loadGitStatus().then(function() { renderActions(el); });
          loadStats();
        }).catch(function(err) {
          logEl.textContent += 'Error: ' + String(err) + '\n';
        });
      });

    }).catch(function(err) {
      el.innerHTML = '<div class="nd-placeholder"><h2>Error</h2><p>' + esc(String(err)) + '</p></div>';
    });
  }

  // ==============================================================
  // Floppy detail
  // ==============================================================
  function renderFloppyDetail(el, params) {
    var fid = params.id || '';
    el.innerHTML = '<div><p class="nd-text-muted">Loading floppy ' + esc(fid) + '...</p></div>';

    fetch('/api/catalog/' + encodeURIComponent(fid)).then(function(r) {
      if (!r.ok) throw new Error('Floppy not found');
      return r.json();
    }).then(function(e) {
      var html = '';

      // Header
      html += '<div class="nd-floppy-header">';
      html += '<h2>' + esc(e.volumeName || e.id) + '</h2>';

      // Product link + name
      if (e.productId) {
        var pName = e.productName ? ' &mdash; ' + esc(e.productName) : '';
        html += '<div style="margin-bottom:0.5rem"><a href="#/products/' + encodeURIComponent(e.productId) + '" style="font-size:1rem"><code>' + esc(e.productId) + '</code>' + pName + '</a></div>';
      }

      // Parsed breakdown badges
      html += '<div class="nd-floppy-badges">';
      if (e.version) html += '<span class="nd-badge nd-badge-os" title="Software version/revision letter">' + esc('Version ' + e.version) + '</span>';
      if (e.diskNumber != null) html += '<span class="nd-badge" title="Disk number in a multi-disk set">Disk ' + e.diskNumber + '</span>';
      // Parse language from volume name
      var volParsed = parseVolumeNameClient(e.volumeName);
      if (volParsed && volParsed.language) html += '<span class="nd-badge nd-badge-patch">' + esc(volParsed.language) + '</span>';
      html += '</div>';
      html += '</div>';

      // Quick stats
      var sizeStr = e.imageSizeBytes ? (e.imageSizeBytes / 1024).toFixed(0) + ' KB' : '-';
      var fileCount = e.ndfs && e.ndfs.files ? e.ndfs.files.length : 0;
      html += '<div class="nd-quick-stats">';
      html += ndQuickStat(e.bootFormat || 'unknown', 'Boot Format', 'How the floppy boots: none = not bootable, flomon = ND floppy monitor, binary = raw bootstrap, bpun = packaged binary');
      html += ndQuickStat(e.totalPages != null ? e.totalPages : '-', 'NDFS Pages', 'NDFS filesystem pages (1 page = ' + (e.pageSize || 1024) + ' bytes)');
      html += ndQuickStat(sizeStr, 'Image Size', 'Total size of the disk image file');
      html += ndQuickStat(
        e.filesystem === 'dos' ? '-' : fileCount,
        e.filesystem === 'dos' ? 'MS-DOS disk' : 'Files on Disk',
        e.filesystem === 'dos' ? 'This is an MS-DOS floppy - see the directory listing below'
                               : 'Number of files stored on the floppy');
      html += '</div>';

      // NDFS viewer button (only when we have the actual image file)
      if (e.storageClass === 'floppy-in-git' && e.storage && e.storage.git && e.storage.git.imagePath) {
        // Offer only the viewer that suits the image. Showing "Open in NDFS
        // Viewer" on a disk we know has no ND filesystem just wastes a click.
        var vLabel = esc(e.volumeName || e.volumeLabel || e.id);
        html += '<div style="margin-bottom:0.75rem">';
        if (e.filesystem === 'dos') {
          html += '<button class="nd-btn nd-btn-primary nd-btn-sm" onclick="openDosViewer(\'' + esc(e.id) + '\', \'' + vLabel + '\')">Open in DOS viewer</button> ';
        } else if (e.filesystem === 'backup' || e.filesystem === 'winch') {
          html += '<button class="nd-btn nd-btn-primary nd-btn-sm" onclick="openBackupViewer(\'' + esc(e.id) + '\', \'' + vLabel + '\')">Open in backup viewer</button> ';
        } else if (!e.filesystem || e.filesystem === 'ndfs') {
          html += '<button class="nd-btn nd-btn-primary nd-btn-sm" onclick="openNdfsViewer(\'' + esc(e.id) + '\')">Open in NDFS Viewer</button> ';
        }
        html += '<button class="nd-btn nd-btn-ghost nd-btn-sm" onclick="openHexViewer(\'' + esc(e.id) + '\', \'' + vLabel + '\')">Open in HEX viewer</button>';
        if (e.condition && e.condition.recovery) {
          // The archive stores the original only; this copy is built per request.
          html += ' <a class="nd-btn nd-btn-ghost nd-btn-sm" href="/api/ndfs/repaired?id=' + encodeURIComponent(e.id) +
            '" download title="The original bytes with the master block pointers rebuilt, so an emulator or the NDFS viewer can read it. Built on request - only the original is stored.">Download repaired .img</a>';
        }
        html += '</div>';
      }

      // Tags editor (write-only)
      html += '<div class="nd-write-only nd-edit-section nd-card">';
      html += '<h4>Tags</h4>';
      html += '<div class="nd-tag-chips" id="floppy-tags">';
      if (e.tags && e.tags.length > 0) {
        e.tags.forEach(function(t) {
          html += '<span class="nd-tag-chip" data-tag="' + esc(t) + '" onclick="ndRemoveTag(this)">' + esc(t) + ' <span class="nd-tag-x">x</span></span>';
        });
      } else {
        html += '<span class="nd-text-muted" style="font-size:0.82rem">No tags</span>';
      }
      html += '</div>';
      html += '<div class="nd-add-row">';
      html += '<input class="nd-input" id="floppy-new-tag" type="text" placeholder="New tag...">';
      html += '<button class="nd-btn nd-btn-sm" id="floppy-add-tag-btn">Add</button>';
      html += '</div>';
      html += '</div>';

      // Documentation references editor (write-only)
      html += '<details class="nd-write-only nd-edit-section nd-card">';
      html += '<summary style="cursor:pointer;font-weight:600">Documentation References</summary>';
      html += '<div style="padding-top:0.75rem">';
      html += '<div class="nd-edit-fields">';
      html += '<label>PI Doc</label><input class="nd-input" id="floppy-pi-doc" type="text" value="' + esc(e.docs && e.docs.piDocId ? e.docs.piDocId : '') + '" placeholder="e.g. ND-10079-PI">';
      html += '<label>PD Doc</label><input class="nd-input" id="floppy-pd-doc" type="text" value="' + esc(e.docs && e.docs.pdDocId ? e.docs.pdDocId : '') + '" placeholder="e.g. ND-10079-PD">';
      html += '</div>';
      // Related docs
      html += '<div style="margin-top:0.75rem"><label style="font-weight:500;font-size:0.85rem;color:var(--text-muted)">Related Doc IDs</label></div>';
      html += '<div id="floppy-related-docs">';
      if (e.docs && e.docs.relatedDocIds && e.docs.relatedDocIds.length > 0) {
        e.docs.relatedDocIds.forEach(function(d, i) {
          html += '<div class="nd-add-row nd-related-doc-row"><input class="nd-input" type="text" value="' + esc(d) + '"><button class="nd-btn nd-btn-sm nd-btn-danger" onclick="this.parentElement.remove()">x</button></div>';
        });
      }
      html += '</div>';
      html += '<button class="nd-btn nd-btn-sm" id="floppy-add-related-doc" style="margin-top:0.3rem">+ Add related doc</button>';
      // External URLs
      html += '<div style="margin-top:0.75rem"><label style="font-weight:500;font-size:0.85rem;color:var(--text-muted)">External URLs</label></div>';
      html += '<div id="floppy-ext-urls">';
      if (e.docs && e.docs.externalUrls && e.docs.externalUrls.length > 0) {
        e.docs.externalUrls.forEach(function(u) {
          html += '<div class="nd-url-entry"><input class="nd-input" type="text" placeholder="URL" value="' + esc(u.url) + '"><input class="nd-input" type="text" placeholder="Title" value="' + esc(u.title) + '"><button class="nd-btn nd-btn-sm nd-btn-danger" onclick="this.parentElement.remove()">x</button></div>';
        });
      }
      html += '</div>';
      html += '<button class="nd-btn nd-btn-sm" id="floppy-add-ext-url" style="margin-top:0.3rem">+ Add URL</button>';
      html += '<div style="margin-top:0.75rem"><button class="nd-btn nd-btn-primary nd-btn-sm" id="floppy-save-docs-btn">Save docs</button></div>';
      html += '</div></details>';

      // Danger zone: delete this floppy (write-only)
      html += '<details class="nd-write-only nd-edit-section nd-card" style="border-color:var(--danger)">';
      html += '<summary style="cursor:pointer;font-weight:600;color:var(--danger)">Danger zone</summary>';
      html += '<div style="padding-top:0.75rem">';
      html += '<p class="nd-text-muted" style="font-size:0.85rem;margin-bottom:0.6rem">Permanently delete this floppy &mdash; removes its <code>.img.gz</code>, <code>.yaml</code> and disk photos from <code>images/' + esc(e.md5 || '') + '/</code> and drops it from the catalog. Shared "set" photos are kept. You still need to commit the change (it shows up on the Changes page).</p>';
      html += '<button class="nd-btn nd-btn-danger nd-btn-sm" id="floppy-delete-btn" data-id="' + esc(e.id) + '" data-vol="' + esc(e.volumeName || e.id) + '">Delete this floppy</button>';
      html += '</div></details>';

      // NDFS file table
      if (e.ndfs && e.ndfs.files && e.ndfs.files.length > 0) {
        html += '<div class="nd-card" style="padding:0;overflow-x:auto">';

        // Group by user
        var byUser = {};
        var userOrder = [];
        e.ndfs.files.forEach(function(f) {
          var u = f.userName || '(unknown)';
          if (!byUser[u]) { byUser[u] = []; userOrder.push(u); }
          byUser[u].push(f);
        });

        html += '<table class="nd-ndfs-table"><thead><tr>' +
          '<th>Name</th><th style="text-align:right">Pages</th><th style="text-align:right">Size</th><th>Created</th><th>Last Written</th>' +
          '</tr></thead><tbody>';

        var multiUser = userOrder.length > 1;
        userOrder.forEach(function(user) {
          if (multiUser) {
            html += '<tr class="nd-ndfs-user-header"><td colspan="5">User: ' + esc(user) + ' (' + byUser[user].length + ' files)</td></tr>';
          }
          byUser[user].forEach(function(f) {
            var sizeDisplay = f.bytes != null ? formatBytes(f.bytes) : '-';
            var created = f.dateCreatedStr ? esc(f.dateCreatedStr) : '<span class="nd-date-null">-</span>';
            var written = f.lastDateWrittenStr ? esc(f.lastDateWrittenStr) : '<span class="nd-date-null">-</span>';
            var userName = f.userName || user;
            var displayName = '<span style="color:var(--accent);font-weight:700">(' + esc(userName) + ')</span>' + esc(f.name);
            html += '<tr>' +
              '<td><code style="font-size:0.82rem">' + displayName + '</code></td>' +
              '<td style="text-align:right">' + f.pages + '</td>' +
              '<td style="text-align:right">' + sizeDisplay + '</td>' +
              '<td>' + created + '</td>' +
              '<td>' + written + '</td>' +
            '</tr>';
          });
        });

        html += '</tbody></table></div>';
      } else if (e.filesystem === 'dos') {
        // MS-DOS disk: its directory is not an NDFS listing, so show the real
        // one. Filled in after render, from /api/dosfs/info.
        html += '<div class="nd-card" id="dos-listing"><p class="nd-text-muted">Reading MS-DOS directory...</p></div>';
      } else if (e.filesystem === 'backup' && e.backupFiles && e.backupFiles.length) {
        // BACKUP-SYSTEM has no directory: the ANSI labels are the listing, and
        // they were recorded at import, so this needs no request.
        var liveB = e.backupFiles.filter(function(f) { return !f.stale; });
        var staleB = e.backupFiles.length - liveB.length;
        html += '<div class="nd-card" style="padding:0"><div style="padding:0.6rem 1rem;border-bottom:1px solid var(--border)">' +
          '<strong>SINTRAN III BACKUP-SYSTEM</strong> <span class="nd-text-muted" id="bk-run-head">' + liveB.length + ' file(s)' +
          (staleB ? ', ' + staleB + ' label(s) left from an older backup' : '') +
          (e.backupSet && e.backupSet.runDate ? ' &middot; ' + esc(e.backupSet.runDate) : '') +
          (e.backupSet && e.backupSet.system ? ' &middot; ' + esc(e.backupSet.system) : '') + '</span>' +
          ' <button class="nd-btn nd-btn-ghost nd-btn-sm" style="float:right;font-size:0.75rem" onclick="openBackupViewer(\'' +
          esc(e.id) + '\')">Browse</button></div>' +
          // Listed as the run, not as this one image: a backup written across
          // several floppies is one list of files, and it reads the same from
          // whichever volume of the set the page was opened on. The labels
          // recorded for this image are what is shown until the run arrives.
          '<table class="nd-ndfs-table"><thead><tr><th>File</th><th style="text-align:right">Bytes</th>' +
          '<th style="width:5rem">Volume</th><th>Created</th></tr></thead><tbody id="bk-run-rows">';
        e.backupFiles.forEach(function(f) {
          html += '<tr' + (f.stale ? ' class="nd-text-muted"' : '') + '><td><code style="font-size:0.82rem">' + esc(f.name) + '</code>' +
            (f.stale ? ' <span style="font-size:0.7rem">stale</span>' : '') + '</td>' +
            '<td style="text-align:right">' + (f.bytes || 0).toLocaleString() + '</td>' +
            '<td class="nd-text-muted">-</td>' +
            '<td class="nd-text-muted">' + esc(f.created || '') + '</td></tr>';
        });
        html += '</tbody></table></div>';
      } else if (e.filesystem === 'winch' && e.backupSet) {
        // A page dump: there are no file names on the media at all.
        html += '<div class="nd-card"><p class="nd-text-muted">WINCH-TO-FLOPP backup of directory <code>' +
          esc(e.backupSet.name) + '</code>, volume ' + e.backupSet.volumeNumber + ' of ' + e.backupSet.totalVolumes +
          ', ' + (e.backupSet.pageCount || 0) + ' page(s) stored' +
          (e.backupSet.pageFirst !== null && e.backupSet.pageFirst !== undefined
            ? ' (original pages ' + e.backupSet.pageFirst + '-' + e.backupSet.pageLast + ')' : '') + '. ' +
          'This format stores no file names - open the backup viewer to see the page map and the rest of the set.</p>' +
          '<button class="nd-btn nd-btn-sm" onclick="openBackupViewer(\'' + esc(e.id) + '\')">Open in backup viewer</button></div>';
      } else if (e.filesystem === 'tar') {
        html += '<div class="nd-card"><p class="nd-text-muted">This image is a tar archive written straight to the media, not a filesystem. ' +
          'Use the HEX viewer, or extract it with <code>tar -xf</code>.</p></div>';
      } else {
        html += '<div class="nd-card"><p class="nd-text-muted">' +
          (e.filesystem === 'none'
            ? 'No filesystem could be read from this image - an empty disk, a failed read, or media this archive does not recognise. Use the HEX viewer to look at the raw bytes.'
            : 'No NDFS file listing available for this image.') + '</p></div>';
      }

      // Photos (below file table)
      html += ndPhotoCards(e.storage && e.storage.git);

      // File upload (write-only)
      html += '<div class="nd-write-only nd-card">';
      html += '<h3 style="margin-bottom:0.75rem">Add Files</h3>';
      html += '<div style="margin-bottom:0.5rem">';
      html += '<select class="nd-select" id="floppy-upload-type" style="width:auto;display:inline-block;margin-right:0.5rem">';
      html += '<option value="disk-photo">Disk photo</option>';
      html += '<option value="set-photo">Set photo</option>';
      html += '<option value="imaging-log">Imaging log</option>';
      html += '<option value="documentation">Documentation</option>';
      html += '</select>';
      html += '</div>';
      html += '<div class="nd-drop-zone" id="floppy-drop-zone">';
      html += '<p>Drop file here or click to select</p>';
      html += '<input type="file" id="floppy-file-input">';
      html += '</div>';
      html += '<div id="floppy-upload-status" style="margin-top:0.5rem"></div>';
      html += '</div>';

      // Collapsible details
      html += '<details class="nd-details-toggle">' +
        '<summary>More details</summary>' +
        '<div class="nd-details-body">';

      // Checksums
      html += '<h4 style="margin-bottom:0.5rem;margin-top:0.5rem;color:var(--accent)">Verification checksums</h4>';
      html += '<dl class="nd-dl">';
      html += '<dt>MD5</dt><dd><code class="nd-copyable" onclick="ndCopy(this)" data-copy="' + esc(e.md5) + '">' + esc(e.md5) + '</code></dd>';
      html += '</dl>';

      // Origin -- editable in local mode, read-only in public mode
      html += '<h4 style="margin-bottom:0.5rem;margin-top:1rem;color:var(--accent)">Origin</h4>';
      var prov = e.provenance || {};
      // Public mode: read-only display
      html += '<div class="nd-public-only"><dl class="nd-dl">';
      if (prov.contributor) html += '<dt>Contributed by</dt><dd>' + esc(prov.contributor) + '</dd>';
      if (prov.method) html += '<dt>Imaging method</dt><dd>' + esc(prov.method) + '</dd>';
      if (prov.dateImaged) html += '<dt>Date imaged</dt><dd>' + esc(prov.dateImaged) + '</dd>';
      if (prov.notes) html += '<dt>Notes</dt><dd>' + esc(prov.notes) + '</dd>';
      if (prov.originalPath) html += '<dt>Source file</dt><dd><code style="font-size:0.8rem">' + esc(prov.originalPath) + '</code></dd>';
      html += '</dl></div>';
      // Local mode: editable fields
      html += '<div class="nd-write-only"><div class="nd-edit-fields">';
      html += '<label>Contributed by</label><input class="nd-input" id="floppy-prov-contributor" type="text" value="' + esc(prov.contributor || '') + '">';
      html += '<label>Imaging method</label><input class="nd-input" id="floppy-prov-method" type="text" value="' + esc(prov.method || '') + '" placeholder="e.g. Kryoflux, Greaseweazle">';
      html += '<label>Date imaged</label><input class="nd-input" id="floppy-prov-date" type="text" value="' + esc(prov.dateImaged || '') + '" placeholder="YYYY-MM-DD">';
      html += '<label>Source file</label><input class="nd-input" id="floppy-prov-path" type="text" value="' + esc(prov.originalPath || '') + '" placeholder="Original file path">';
      html += '<label>Notes</label><input class="nd-input" id="floppy-prov-notes" type="text" value="' + esc(prov.notes || '') + '">';
      html += '</div>';
      html += '<button class="nd-btn nd-btn-primary nd-btn-sm" id="floppy-save-prov-btn" style="margin-top:0.5rem">Save</button>';
      html += '</div>';

      // File location
      if (e.storage) {
        html += '<h4 style="margin-bottom:0.5rem;margin-top:1rem;color:var(--accent)">File location</h4>';
        html += '<dl class="nd-dl">';
        if (e.storage.git) {
          html += '<dt>Local file</dt><dd><code style="font-size:0.8rem">' + esc(e.storage.git.imagePath) + '</code></dd>';
        }
        if (e.storageClass === 'floppy-in-git') {
          html += '<dt>Stored in</dt><dd>Repository (compressed)</dd>';
        } else {
          html += '<dt>Stored in</dt><dd>Internet Archive (pending upload)</dd>';
        }
        html += '</dl>';
      }

      // Label transcription
      if (e.storage && e.storage.git && e.storage.git.labelTranscription) {
        html += '<h4 style="margin-bottom:0.5rem;margin-top:1rem;color:var(--accent)">Label Transcription</h4>';
        html += '<pre class="nd-label-pre">' + esc(e.storage.git.labelTranscription) + '</pre>';
      }

      // Imaging logs
      if (e.storage && e.storage.git && e.storage.git.imagingLogs && e.storage.git.imagingLogs.length > 0) {
        html += '<h4 style="margin-bottom:0.5rem;margin-top:1rem;color:var(--accent)">Imaging Logs</h4>';
        e.storage.git.imagingLogs.forEach(function(log) {
          html += '<p><code style="font-size:0.8rem">' + esc(log) + '</code></p>';
        });
      }

      html += '</div></details>';

      // Navigation
      html += '<div class="nd-floppy-nav">';
      if (e.productId) {
        html += '<a href="#/products/' + encodeURIComponent(e.productId) + '" class="nd-btn nd-btn-ghost">Product: ' + esc(e.productId) + '</a>';
      }
      html += '<a href="#/catalog" class="nd-btn nd-btn-ghost">Back to catalog</a>';
      html += '</div>';

      el.innerHTML = html;

      // Replace the per-image label list with the run: every volume of the set
      // in chain order, so a file written again on the next floppy is listed
      // once, at its real length, from either volume.
      var runRows = document.getElementById('bk-run-rows');
      if (runRows && e.filesystem === 'backup') {
        fetch('/api/ndbackup/run?id=' + encodeURIComponent(e.id))
          .then(function(r) { return r.ok ? r.json() : null; })
          .then(function(run) {
            if (!run || !run.files) return;
            var rows = '';
            run.files.forEach(function(f) {
              var vols = f.parts.map(function(p) { return p.volume; });
              var where = vols.length > 1 ? vols[0] + '-' + vols[vols.length - 1] : String(vols[0]);
              rows += '<tr' + (f.stale ? ' class="nd-text-muted"' : '') + '><td><code style="font-size:0.82rem">' + esc(f.fullName) + '</code>' +
                (f.truncated ? ' <span class="nd-badge nd-badge-warn" style="font-size:0.65rem">cut - no volume here continues it</span>' : '') +
                (f.stubVolumes && f.stubVolumes.length ? ' <span class="nd-text-muted" style="font-size:0.7rem">label only on volume ' + f.stubVolumes.join(', ') + '</span>' : '') +
                backupReadNote(f, run) +
                (f.stale ? ' <span style="font-size:0.7rem">stale</span>' : '') + '</td>' +
                '<td style="text-align:right">' + f.bytes.toLocaleString() + '</td>' +
                '<td class="nd-text-muted">' + esc(where) + '</td>' +
                '<td class="nd-text-muted">' + esc(f.created || '') + '</td></tr>';
            });
            runRows.innerHTML = rows;
            var hd = document.getElementById('bk-run-head');
            if (hd) {
              var liveR = run.files.filter(function(f) { return !f.stale; }).length;
              var readCount = run.volumes.reduce(function(n, v) { return n + (v.reads ? v.reads.length : 1); }, 0);
              hd.innerHTML = liveR + ' file(s) across ' + run.volumes.length + ' volume(s) of run ' + esc(run.volumeId) +
                (readCount > run.volumes.length ? ', from ' + readCount + ' reads' : '') +
                (run.files.length - liveR ? ', ' + (run.files.length - liveR) + ' label(s) left from an older backup' : '');
            }
          });
      }

      // MS-DOS directory listing, in place of the NDFS table.
      var dosBox = document.getElementById('dos-listing');
      if (dosBox && e.filesystem === 'dos') {
        fetch('/api/dosfs/info?id=' + encodeURIComponent(e.id))
          .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, j: j }; }); })
          .then(function(res) {
            if (!res.ok) { dosBox.innerHTML = '<p class="nd-text-muted">' + esc(res.j.error || 'Could not read the disk') + '</p>'; return; }
            var i = res.j.info, entries = (res.j.entries || []).filter(function(x) { return !x.isVolumeLabel; });
            var h = '<div style="padding:0.75rem 1rem;border-bottom:1px solid var(--border)">' +
              '<strong>MS-DOS disk</strong> <span class="nd-text-muted">' +
              esc(i.volumeLabel || '(no label)') + ' &middot; OEM ' + esc(i.oemName) + ' &middot; FAT' + i.fatBits +
              ' &middot; ' + i.totalBytes.toLocaleString() + ' B, ' + i.freeBytes.toLocaleString() + ' B free</span>' +
              ' <button class="nd-btn nd-btn-ghost nd-btn-sm" style="float:right;font-size:0.75rem" ' +
              'onclick="openDosViewer(\'' + esc(e.id) + '\', \'' + esc(e.volumeName || e.id) + '\')">Browse</button></div>';
            h += '<table class="nd-ndfs-table"><thead><tr><th>Name</th><th style="text-align:right">Size</th><th>Modified</th></tr></thead><tbody>';
            entries.forEach(function(x) {
              var depth = x.path.split('/').length - 1;
              h += '<tr><td style="padding-left:' + (0.6 + depth * 1.2) + 'rem"><code style="font-size:0.82rem">' +
                (x.isDirectory ? '&#128193; ' : '') + esc(x.name) + '</code></td>' +
                '<td style="text-align:right">' + (x.isDirectory ? '<span class="nd-text-muted">&lt;DIR&gt;</span>' : x.size.toLocaleString()) + '</td>' +
                '<td>' + (x.modified ? esc(x.modified) : '<span class="nd-date-null">-</span>') + '</td></tr>';
            });
            h += '</tbody></table>';
            dosBox.style.padding = '0';
            dosBox.style.overflowX = 'auto';
            dosBox.innerHTML = h;
          })
          .catch(function(err) { dosBox.innerHTML = '<p class="nd-text-muted">' + esc(String(err)) + '</p>'; });
      }

      // Wire up edit controls (write-only)
      var mode = document.documentElement.getAttribute('data-mode');
      if (mode !== 'public') {
        // Delete this floppy -- preview the exact files first, then approve.
        var delFloppyBtn = document.getElementById('floppy-delete-btn');
        if (delFloppyBtn) {
          delFloppyBtn.addEventListener('click', function() {
            var fid2 = this.getAttribute('data-id');
            var vol = this.getAttribute('data-vol');
            var btn = this;
            function fmtKB(b) { return b >= 1048576 ? (b/1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b/1024)) + ' KB'; }
            btn.disabled = true; btn.textContent = 'Checking...';
            // 1) dry run: ask the server exactly what would be deleted
            fetch('/api/catalog-entry?id=' + encodeURIComponent(fid2) + '&dryRun=1', { method: 'DELETE' })
              .then(function(r) { return r.json(); })
              .then(function(p) {
                btn.disabled = false; btn.textContent = 'Delete this floppy';
                if (p.error) { alert('Error: ' + p.error); return; }
                if (!p.count) { alert('Nothing on disk to delete for this floppy.'); return; }
                var list = p.files.map(function(f) { return '  - ' + f.path + '  (' + fmtKB(f.bytes) + ')'; }).join('\n');
                var msg = 'Delete floppy "' + vol + '"?\n\n'
                  + 'These ' + p.count + ' file(s) (' + fmtKB(p.totalBytes) + ') will be PERMANENTLY deleted:\n\n'
                  + list + '\n\n'
                  + 'The floppy is then dropped from the catalog. Shared "set" photos are kept. '
                  + 'You still need to commit the change on the Changes page.';
                // 2) approval
                if (!confirm(msg)) return;
                // 3) apply
                btn.disabled = true; btn.textContent = 'Deleting...';
                fetch('/api/catalog-entry?id=' + encodeURIComponent(fid2), { method: 'DELETE' })
                  .then(function(r) { return r.json(); })
                  .then(function(data) {
                    if (data.error) { alert('Error: ' + data.error); btn.disabled = false; btn.textContent = 'Delete this floppy'; return; }
                    window.location.hash = '#/catalog';
                  })
                  .catch(function(err) { alert('Error: ' + String(err)); btn.disabled = false; btn.textContent = 'Delete this floppy'; });
              })
              .catch(function(err) { btn.disabled = false; btn.textContent = 'Delete this floppy'; alert('Error: ' + String(err)); });
          });
        }

        // Tag add
        var addTagBtn = document.getElementById('floppy-add-tag-btn');
        if (addTagBtn) {
          addTagBtn.addEventListener('click', function() {
            var input = document.getElementById('floppy-new-tag');
            var tag = input.value.trim().toLowerCase();
            if (!tag) return;
            var currentTags = (e.tags || []).slice();
            if (currentTags.indexOf(tag) >= 0) { input.value = ''; return; }
            currentTags.push(tag);
            fetch('/api/catalog-entry?id=' + encodeURIComponent(e.id), {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ tags: currentTags })
            }).then(function(r) { return r.json(); }).then(function(data) {
              if (data.success) { renderFloppyDetail(el, { id: e.id }); loadGitStatus(); }
              else alert('Error: ' + (data.error || 'Unknown'));
            });
          });
          document.getElementById('floppy-new-tag').addEventListener('keydown', function(ev) {
            if (ev.key === 'Enter') addTagBtn.click();
          });
        }

        // Tag remove (global handler)
        window.ndRemoveTag = function(chip) {
          var tag = chip.getAttribute('data-tag');
          var currentTags = (e.tags || []).filter(function(t) { return t !== tag; });
          fetch('/api/catalog-entry?id=' + encodeURIComponent(e.id), {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tags: currentTags })
          }).then(function(r) { return r.json(); }).then(function(data) {
            if (data.success) { renderFloppyDetail(el, { id: e.id }); loadGitStatus(); }
          });
        };

        // Save docs
        var saveDocsBtn = document.getElementById('floppy-save-docs-btn');
        if (saveDocsBtn) {
          saveDocsBtn.addEventListener('click', function() {
            var piDoc = document.getElementById('floppy-pi-doc').value.trim() || null;
            var pdDoc = document.getElementById('floppy-pd-doc').value.trim() || null;
            var relatedDocs = [];
            document.querySelectorAll('#floppy-related-docs .nd-related-doc-row input').forEach(function(inp) {
              var v = inp.value.trim();
              if (v) relatedDocs.push(v);
            });
            var extUrls = [];
            document.querySelectorAll('#floppy-ext-urls .nd-url-entry').forEach(function(row) {
              var inputs = row.querySelectorAll('input');
              var url = inputs[0] ? inputs[0].value.trim() : '';
              var title = inputs[1] ? inputs[1].value.trim() : '';
              if (url) extUrls.push({ url: url, title: title });
            });
            var docs = { piDocId: piDoc, pdDocId: pdDoc, relatedDocIds: relatedDocs, externalUrls: extUrls };
            fetch('/api/catalog-entry?id=' + encodeURIComponent(e.id), {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ docs: docs })
            }).then(function(r) { return r.json(); }).then(function(data) {
              if (data.success) { renderFloppyDetail(el, { id: e.id }); loadGitStatus(); }
              else alert('Error: ' + (data.error || 'Unknown'));
            });
          });
        }

        // Add related doc button
        var addRelDocBtn = document.getElementById('floppy-add-related-doc');
        if (addRelDocBtn) {
          addRelDocBtn.addEventListener('click', function() {
            var container = document.getElementById('floppy-related-docs');
            var row = document.createElement('div');
            row.className = 'nd-add-row nd-related-doc-row';
            row.innerHTML = '<input class="nd-input" type="text" placeholder="e.g. ND-60.128.03"><button class="nd-btn nd-btn-sm nd-btn-danger" onclick="this.parentElement.remove()">x</button>';
            container.appendChild(row);
          });
        }

        // Add external URL button
        var addExtUrlBtn = document.getElementById('floppy-add-ext-url');
        if (addExtUrlBtn) {
          addExtUrlBtn.addEventListener('click', function() {
            var container = document.getElementById('floppy-ext-urls');
            var row = document.createElement('div');
            row.className = 'nd-url-entry';
            row.innerHTML = '<input class="nd-input" type="text" placeholder="URL"><input class="nd-input" type="text" placeholder="Title"><button class="nd-btn nd-btn-sm nd-btn-danger" onclick="this.parentElement.remove()">x</button>';
            container.appendChild(row);
          });
        }

        // Save provenance
        var saveProvBtn = document.getElementById('floppy-save-prov-btn');
        if (saveProvBtn) {
          saveProvBtn.addEventListener('click', function() {
            var prov = {
              contributor: document.getElementById('floppy-prov-contributor').value.trim(),
              method: document.getElementById('floppy-prov-method').value.trim() || null,
              dateImaged: document.getElementById('floppy-prov-date').value.trim() || null,
              originalPath: document.getElementById('floppy-prov-path').value.trim() || null,
              notes: document.getElementById('floppy-prov-notes').value.trim() || null
            };
            fetch('/api/catalog-entry?id=' + encodeURIComponent(e.id), {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ provenance: prov })
            }).then(function(r) { return r.json(); }).then(function(data) {
              if (data.success) { renderFloppyDetail(el, { id: e.id }); loadGitStatus(); }
              else alert('Error: ' + (data.error || 'Unknown'));
            });
          });
        }

        // File upload
        var dropZone = document.getElementById('floppy-drop-zone');
        var fileInput = document.getElementById('floppy-file-input');
        if (dropZone && fileInput) {
          dropZone.addEventListener('click', function() { fileInput.click(); });
          dropZone.addEventListener('dragover', function(ev) { ev.preventDefault(); dropZone.classList.add('nd-dragover'); });
          dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('nd-dragover'); });
          dropZone.addEventListener('drop', function(ev) {
            ev.preventDefault();
            dropZone.classList.remove('nd-dragover');
            if (ev.dataTransfer.files.length > 0) uploadFloppyFile(ev.dataTransfer.files[0], e.id, el);
          });
          fileInput.addEventListener('change', function() {
            if (fileInput.files.length > 0) uploadFloppyFile(fileInput.files[0], e.id, el);
          });
        }
      }

    }).catch(function(err) {
      el.innerHTML = '<div class="nd-placeholder"><h2>Error</h2><p>' + esc(String(err)) + '</p><p><a href="#/catalog">Back to catalog</a></p></div>';
    });
  }

  function uploadFloppyFile(file, entryId, el) {
    var statusEl = document.getElementById('floppy-upload-status');
    var fileType = document.getElementById('floppy-upload-type').value;
    statusEl.innerHTML = '<p class="nd-text-muted">Uploading ' + esc(file.name) + '...</p>';

    var formData = new FormData();
    formData.append('file', file);
    formData.append('type', fileType);

    fetch('/api/catalog-entry/upload?id=' + encodeURIComponent(entryId), {
      method: 'POST',
      body: formData
    }).then(function(r) { return r.json(); }).then(function(data) {
      if (data.success) {
        statusEl.innerHTML = '<p style="color:var(--ok)">Uploaded: ' + esc(data.path) + ' (' + esc(data.type) + ')</p>';
        loadGitStatus();
        setTimeout(function() { renderFloppyDetail(el, { id: entryId }); }, 1000);
      } else {
        statusEl.innerHTML = '<p style="color:var(--warn)">Error: ' + esc(data.error || 'Unknown') + '</p>';
      }
    }).catch(function(err) {
      statusEl.innerHTML = '<p style="color:var(--warn)">Error: ' + esc(String(err)) + '</p>';
    });
  }

  // Client-side volume name parser (simplified)
  function parseVolumeNameClient(name) {
    if (!name) return null;
    var m = name.match(/^(\d{5,6})([A-Z])(\d{2})-([A-Z]{2})-(\d+)([SD]?)$/);
    if (m) return { productId: 'ND-' + m[1], version: m[2] + m[3], language: m[4], diskNumber: parseInt(m[5], 10) };
    m = name.match(/^ND-(\d{5,6})([A-Z])(\d{2})$/);
    if (m) return { productId: 'ND-' + m[1], version: m[2] + m[3], language: null, diskNumber: null };
    return null;
  }

  function ndQuickStat(val, label, tooltip) {
    return '<div class="nd-quick-stat"' + (tooltip ? ' title="' + tooltip + '"' : '') + '><div class="nd-quick-stat-val">' + val + '</div><div class="nd-quick-stat-lbl">' + label + '</div></div>';
  }

  function formatBytes(bytes) {
    if (bytes == null || bytes < 0) return '-';
    if (bytes > 4000000000) return '-'; // sentinel values
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }
