          bkBtn.addEventListener('click', function() { openBackupViewer(e.id, e.volumeName || e.volumeLabel || e.id); });
          actions.insertBefore(bkBtn, actions.firstChild);
        }
      }

      // Label photos
      var photoHtml = ndPhotoCards(git);
      if (photoHtml) extra.innerHTML = '<div style="margin-top:1rem">' + photoHtml + '</div>';
    }).catch(function() { /* non-fatal: detail panel still shows core info */ });
  }

  function renderMatchPager() {
    var pager = document.getElementById('match-pager');
    var total = matcherState.total;
    var offset = matcherState.offset;
    var limit = matcherState.limit;
    var page = Math.floor(offset / limit) + 1;
    var totalPages = Math.ceil(total / limit);

    var first = total === 0 ? 0 : offset + 1;
    var last = Math.min(offset + limit, total);
    var link = function(off, lim, label, cls) {
      return '<a href="#/match?mode=' + matcherState.mode + '&offset=' + off + '&limit=' + lim +
        '" class="nd-btn ' + (cls || 'nd-btn-ghost') + ' nd-btn-sm">' + label + '</a> ';
    };

    // Rows per page - without this there was no way to see or change it, and a
    // 350-row queue arrived as 8 opaque pages of 50.
    var sizes = [50, 100, 200, 500];
    var sizeHtml = '<span class="nd-text-muted" style="margin-left:0.75rem">Rows:</span> ';
    sizes.forEach(function(n) {
      sizeHtml += n === limit
        ? '<span class="nd-badge nd-badge-info" style="margin-right:0.25rem">' + n + '</span>'
        : link(0, n, String(n), 'nd-btn-ghost');
    });

    var html = '<span class="nd-text-muted">Showing ' + first + '-' + last + ' of ' + total +
      (totalPages > 1 ? '  ·  page ' + page + '/' + totalPages : '') + '</span> ';
    if (totalPages > 1) {
      html += ' ';
      if (offset > 0) {
        html += link(0, limit, '&laquo; First');
        html += link(Math.max(0, offset - limit), limit, '&larr; Prev');
      }
      if (offset + limit < total) {
        html += link(offset + limit, limit, 'Next &rarr;');
        html += link((totalPages - 1) * limit, limit, 'Last &raquo;');
      }
    }
    pager.innerHTML = html + sizeHtml;
  }

  function updateMatchToolbar() {
    var count = matcherState.selected.size;
    document.getElementById('match-selection-count').textContent = count > 0 ? count + ' selected' : '';
    document.getElementById('match-confirm-btn').disabled = count === 0;
    document.getElementById('match-skip-btn').disabled = count === 0;
    var discardBtn = document.getElementById('match-discard-btn');
    if (discardBtn) {
      discardBtn.disabled = count === 0;
      discardBtn.textContent = count > 1 ? 'Discard ' + count + ' imports' : 'Discard import';
    }
  }

  /**
   * Discard imported floppies: delete the copied .img.gz, its .yaml and the
   * files that came with it. Always previews the exact file list first
   * (dryRun), then asks, then applies. The source folder is never touched, so
   * a discarded disk can always be imported again.
   */
  function matchDiscard(ids, label) {
    if (!ids.length) return;
    function fmtKB(b) { return b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }

    // 1) ask the server what each one would delete
    Promise.all(ids.map(function(id) {
      return fetch('/api/catalog-entry?id=' + encodeURIComponent(id) + '&dryRun=1', { method: 'DELETE' })
        .then(function(r) { return r.json(); })
        .then(function(p) { return { id: id, plan: p }; });
    })).then(function(previews) {
      var files = [], bytes = 0, bad = [];
      previews.forEach(function(pv) {
        if (pv.plan.error || !pv.plan.count) { bad.push(pv.id + ': ' + (pv.plan.error || 'nothing on disk')); return; }
        pv.plan.files.forEach(function(f) { files.push('  - ' + f.path + '  (' + fmtKB(f.bytes) + ')'); });
        bytes += pv.plan.totalBytes;
      });
      if (!files.length) { alert('Nothing on disk to discard.\n\n' + bad.join('\n')); return; }

      var head = ids.length === 1
        ? 'Discard the import of "' + label + '"?'
        : 'Discard ' + ids.length + ' imported floppies?';
      var plain = head + '\n\n'
        + files.length + ' file(s), ' + fmtKB(bytes) + ', will be permanently deleted:\n\n'
        + files.join('\n')
        + (bad.length ? '\n\nSkipped:\n' + bad.join('\n') : '');

      // 2) approval. A real modal, not confirm() - the file list has to be
      // selectable and copyable, and confirm() gives neither.
      var body = '<div class="nd-modal-header"><h3>' + esc(head) + '</h3>' +
          '<button class="nd-modal-close" id="dsc-x" title="Cancel">&times;</button></div>' +
        '<div style="padding:1rem 1.25rem;overflow-y:auto">' +
          '<p style="margin-top:0">' + files.length + ' file(s), <strong>' + fmtKB(bytes) + '</strong>, ' +
            'will be <strong>permanently deleted</strong>:</p>' +
          '<pre id="dsc-list" style="user-select:text;background:var(--bg-sunken);border:1px solid var(--border);' +
            'border-radius:4px;padding:0.6rem 0.75rem;max-height:40vh;overflow:auto;font-size:0.78rem;' +
            'line-height:1.5;white-space:pre;margin:0">' + esc(files.join('\n')) + '</pre>' +
          (bad.length ? '<p class="nd-text-muted" style="font-size:0.85rem;margin-top:0.75rem">Skipped: ' +
            esc(bad.join('; ')) + '</p>' : '') +
          '<p class="nd-text-muted" style="font-size:0.85rem;margin-top:0.75rem">' +
            'The floppies drop out of the catalog. Shared &quot;set&quot; photos are kept. ' +
            'The original images in the source folder are <strong>not</strong> touched, so they can be imported again.</p>' +
        '</div>' +
        '<div style="display:flex;gap:0.5rem;justify-content:flex-end;padding:0.75rem 1.25rem;border-top:1px solid var(--border)">' +
          '<button class="nd-btn nd-btn-ghost nd-btn-sm" id="dsc-copy">Copy list</button>' +
          '<span style="flex:1"></span>' +
          '<button class="nd-btn nd-btn-ghost" id="dsc-cancel">Cancel</button>' +
          '<button class="nd-btn nd-btn-danger" id="dsc-ok">Delete ' + files.length + ' file(s)</button>' +
        '</div>';
      ndModal.open(body, { wide: true });

      document.getElementById('dsc-copy').addEventListener('click', function() {
        var btn = this;
        var done = function() { btn.textContent = 'Copied'; setTimeout(function() { btn.textContent = 'Copy list'; }, 1500); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(plain).then(done, function() { selectList(); });
        } else { selectList(); }
        function selectList() {
          // Fallback: select it so Ctrl+C works.
          var pre = document.getElementById('dsc-list');
          var r = document.createRange(); r.selectNodeContents(pre);
          var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
          btn.textContent = 'Selected - press Ctrl+C';
          setTimeout(function() { btn.textContent = 'Copy list'; }, 2500);
        }
      });
      document.getElementById('dsc-x').addEventListener('click', function() { ndModal.close(); });
      document.getElementById('dsc-cancel').addEventListener('click', function() { ndModal.close(); });
      document.getElementById('dsc-ok').addEventListener('click', function() {
        ndModal.close();
        applyDiscard();
      });
      return;

      function applyDiscard() {
      // 3) apply, one at a time so a failure stops the rest
      showMatchMessage('Discarding ' + ids.length + ' import(s)...', 'info');
      var done = 0, failed = [];
      (function next(i) {
        if (i >= ids.length) {
          matcherState.selected.clear();
          showMatchMessage(
            failed.length ? 'Discarded ' + done + ', failed ' + failed.length + ': ' + failed.join(', ')
                          : 'Discarded ' + done + ' import(s)',
            failed.length ? 'warn' : 'ok');
          loadMatchQueue();
          return;
        }
        fetch('/api/catalog-entry?id=' + encodeURIComponent(ids[i]), { method: 'DELETE' })
          .then(function(r) { return r.json(); })
          .then(function(d) { if (d.error) failed.push(ids[i]); else done++; next(i + 1); })
          .catch(function() { failed.push(ids[i]); next(i + 1); });
      })(0);
      }
    }).catch(function(err) { alert('Error: ' + String(err)); });
  }

  function showMatchMessage(text, variant) {
    var el = document.getElementById('match-message');
    if (!el) return;
    var cls = variant === 'ok' ? 'nd-badge-ok' : variant === 'warn' ? 'nd-badge-warn' : 'nd-badge-info';
    el.innerHTML = '<div class="nd-card" style="padding:0.75rem 1rem;margin-bottom:0.75rem;border-color:var(--' + (variant || 'info') + ')"><span class="nd-badge ' + cls + '">' + esc(text) + '</span></div>';
    el.style.display = 'block';
    setTimeout(function() { el.style.display = 'none'; }, 5000);
  }

  function matchConfirm() {
    var ids = Array.from(matcherState.selected);
    if (ids.length === 0) return;

    // Group the selected floppies by THEIR OWN suggested product, so that a
    // multi-select (e.g. "Select all") links each floppy to its own match --
    // not to whatever the first selected floppy happened to suggest.
    var nameInput = document.getElementById('match-new-name');
    var typedName = nameInput ? nameInput.value.trim() : '';
    var groups = {}; // key -> { target, ids, label }
    var skipped = 0;
    ids.forEach(function(id) {
      var entry = matcherState.entries.find(function(e) { return e.floppy.id === id; });
      if (!entry || !entry.suggested || !entry.suggested.productId) { skipped++; return; }
      var s = entry.suggested;
      var key = (s.isNew ? 'new:' : 'pid:') + s.productId;
      if (!groups[key]) {
        var target = s.isNew
          ? { newProduct: { id: s.productId, name: typedName || s.productName || s.productId } }
          : { productId: s.productId };
        groups[key] = { target: target, ids: [], label: s.productId };
      }
      groups[key].ids.push(id);
    });

    var keys = Object.keys(groups);
    if (keys.length === 0) {
      showMatchMessage('Nothing to link (no suggestion for the selected floppies).', 'warn');
      return;
    }

    var btn = document.getElementById('match-confirm-btn');
    btn.disabled = true;
    btn.textContent = 'Confirming...';

    // All product groups go in ONE request. Sending them one at a time meant a
    // full catalog regeneration per product (~1.6 s on 300 entries) and a site
    // rebuild fired between them, so confirming 16 disks took tens of seconds.
    var payload = keys.map(function(k) {
      return { floppyIds: groups[k].ids, target: groups[k].target };
    });
    var total = payload.reduce(function(n, g) { return n + g.floppyIds.length; }, 0);

    fetch('/api/match/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ groups: payload })
    }).then(function(r) { return r.json(); }).then(function(data) {
      btn.disabled = false;
      btn.textContent = 'Link to product';
      if (data.error) {
        showMatchMessage('Link failed: ' + data.error, 'warn');
      } else {
        showMatchMessage('Linked ' + (data.updated != null ? data.updated : total) + ' floppy(s) to ' +
          keys.length + ' product(s)' + (skipped ? ' (' + skipped + ' skipped)' : ''), 'ok');
      }
      matcherState.selected.clear();
      loadMatchQueue();
    }).catch(function(err) {
      btn.disabled = false;
      btn.textContent = 'Link to product';
      showMatchMessage('Link failed: ' + String(err), 'warn');
    });
  }

  function matchSkip() {
    var ids = Array.from(matcherState.selected);
    if (ids.length === 0) return;

    var btn = document.getElementById('match-skip-btn');
    btn.disabled = true;
    btn.textContent = 'Skipping...';

    fetch('/api/match/skip', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ floppyIds: ids })
    }).then(function(r) { return r.json(); }).then(function(data) {
      showMatchMessage('Skipped ' + ids.length + ' floppy(s) — marked as reviewed', 'info');
      matcherState.selected.clear();
      loadMatchQueue();
      btn.disabled = false;
      btn.textContent = 'Skip for now';
    }).catch(function(err) {
      showMatchMessage('Error: ' + String(err), 'warn');
      btn.disabled = false;
      btn.textContent = 'Skip selected';
    });
  }

  function renderImport(el, params) {
    var importMode = params.tab || 'folder';

    el.innerHTML =
      '<div class="nd-import">' +
        '<h2 style="margin-bottom:1rem">Import disk images</h2>' +
        '<div class="nd-import-modes">' +
          '<a class="nd-import-tab' + (importMode === 'folder' ? ' nd-active' : '') + '" data-tab="folder">Folder scan</a>' +
          '<a class="nd-import-tab' + (importMode === 'upload' ? ' nd-active' : '') + '" data-tab="upload">File upload</a>' +
        '</div>' +
        '<div id="import-body"></div>' +
      '</div>';

    el.querySelectorAll('.nd-import-tab').forEach(function(tab) {
      tab.addEventListener('click', function(e) {
        e.preventDefault();
        location.hash = '#/import?tab=' + this.getAttribute('data-tab');
      });
    });

    if (importMode === 'upload') {
      renderImportUpload(document.getElementById('import-body'));
    } else {
      renderImportFolder(document.getElementById('import-body'));
    }
  }

  // ----- Import: Folder scan -----
  function renderImportFolder(container) {
    container.innerHTML =
      '<div class="nd-card">' +
        '<h3>Scan a local folder for floppy images</h3>' +
        '<div class="nd-import-form">' +
          '<label class="nd-import-form-full"><span>Folder path</span>' +
            '<div style="display:flex;gap:0.5rem">' +
              '<input class="nd-input" id="imp-folder-path" placeholder="/path/to/floppy/images" style="flex:1">' +
              '<button class="nd-btn" id="imp-browse-btn" title="Browse folders">Browse...</button>' +
            '</div>' +
          '</label>' +
          '<label><span>Image extensions</span>' +
            '<input class="nd-input" id="imp-ext-image" value=".img, .image" placeholder=".img, .image, .scp, .hfe">' +
          '</label>' +
          '<label><span>Photo extensions</span>' +
            '<input class="nd-input" id="imp-ext-photo" value=".jpg, .jpeg, .png, .tiff" placeholder=".jpg, .jpeg, .png">' +
          '</label>' +
          '<label><span>Document extensions</span>' +
            '<input class="nd-input" id="imp-ext-doc" value=".txt, .log, .pdf" placeholder=".txt, .log, .pdf">' +
          '</label>' +
          '<label><span>Contributor name</span>' +
            '<input class="nd-input" id="imp-folder-contributor" placeholder="e.g. Ronny Hansen" value="">' +
          '</label>' +
          '<label><span>Source description</span>' +
            '<input class="nd-input" id="imp-folder-source" placeholder="e.g. Original floppy collection">' +
          '</label>' +
          '<label class="nd-import-check"><input type="checkbox" id="imp-folder-recursive"> <span>Recursive scan (include subdirectories)</span></label>' +
        '</div>' +
        '<button class="nd-btn nd-btn-primary" id="imp-folder-scan">Scan</button>' +
      '</div>' +
      '<div id="imp-folder-browser" style="display:none"></div>' +
      '<div id="imp-folder-preview"></div>' +
      '<div id="imp-folder-actions"></div>';

    document.getElementById('imp-folder-scan').addEventListener('click', importFolderScan);
    document.getElementById('imp-browse-btn').addEventListener('click', function() {
      var btn = this;
      var current = document.getElementById('imp-folder-path').value.trim() || '';
      btn.disabled = true;
      btn.textContent = 'Waiting...';
      fetch('/api/pick-folder' + (current ? '?start=' + encodeURIComponent(current) : ''))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.path) {
            document.getElementById('imp-folder-path').value = data.path;
          } else if (data.error) {
            // Fallback to in-page browser if no OS dialog available
            openFolderBrowser(current || '/');
          }
          btn.disabled = false;
          btn.textContent = 'Browse...';
        })
        .catch(function() {
          btn.disabled = false;
          btn.textContent = 'Browse...';
          openFolderBrowser(current || '/');
        });
    });
  }

  // ----- Folder browser -----
  function openFolderBrowser(startPath) {
    var browserEl = document.getElementById('imp-folder-browser');
    browserEl.style.display = 'block';
    loadFolderBrowser(startPath);
  }

  function loadFolderBrowser(path) {
    var browserEl = document.getElementById('imp-folder-browser');
    browserEl.innerHTML = '<div class="nd-card"><p class="nd-text-muted">Loading...</p></div>';

    fetch('/api/browse?path=' + encodeURIComponent(path))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.error) { browserEl.innerHTML = '<div class="nd-card"><p style="color:var(--warn)">' + esc(data.error) + '</p></div>'; return; }

        var html = '<div class="nd-card nd-folder-browser">';
        html += '<div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem">';
        html += '<h3 style="margin:0;flex:1;overflow:hidden;text-overflow:ellipsis"><code>' + esc(data.path) + '</code></h3>';
        html += '<button class="nd-btn nd-btn-primary nd-btn-sm" id="fb-select">Select this folder</button>';
        html += '<button class="nd-btn nd-btn-ghost nd-btn-sm" id="fb-close">Close</button>';
        html += '</div>';

        if (data.imgCount > 0) {
          html += '<p style="margin-bottom:0.75rem"><span class="nd-badge nd-badge-ok">' + data.imgCount + ' .img file' + (data.imgCount !== 1 ? 's' : '') + '</span> in this folder</p>';
        }

        html += '<div class="nd-folder-list">';
        if (data.parent !== null) {
          html += '<div class="nd-folder-item nd-folder-parent" data-path="' + esc(data.parent) + '">.. (parent)</div>';
        }
        data.folders.forEach(function(f) {
          html += '<div class="nd-folder-item" data-path="' + esc(data.path + '/' + f) + '">' + esc(f) + '/</div>';
        });
        if (data.folders.length === 0 && data.parent === null) {
          html += '<p class="nd-text-muted">No subdirectories</p>';
        }
        html += '</div></div>';

        browserEl.innerHTML = html;

        // Wire events
        document.getElementById('fb-select').addEventListener('click', function() {
          document.getElementById('imp-folder-path').value = data.path;
          browserEl.style.display = 'none';
        });
        document.getElementById('fb-close').addEventListener('click', function() {
          browserEl.style.display = 'none';
        });
        browserEl.querySelectorAll('.nd-folder-item').forEach(function(item) {
          item.addEventListener('click', function() {
            loadFolderBrowser(this.getAttribute('data-path'));
          });
        });
      })
      .catch(function(err) {
        browserEl.innerHTML = '<div class="nd-card"><p style="color:var(--warn)">Error: ' + esc(String(err)) + '</p></div>';
      });
  }

  function parseExtList(inputId) {
    return document.getElementById(inputId).value.split(',').map(function(s) { return s.trim().toLowerCase(); }).filter(Boolean);
  }

  function importFolderScan() {
    var folderPath = document.getElementById('imp-folder-path').value.trim();
    if (!folderPath) { alert('Enter a folder path'); return; }

    var recursive = document.getElementById('imp-folder-recursive').checked;
    var previewEl = document.getElementById('imp-folder-preview');
    var actionsEl = document.getElementById('imp-folder-actions');
    var scanBtn = document.getElementById('imp-folder-scan');
    scanBtn.disabled = true;
    scanBtn.innerHTML = '<span class="nd-spinner"></span> Scanning...';
    previewEl.innerHTML = '';
    actionsEl.innerHTML = '';

    var extensions = {
      image: parseExtList('imp-ext-image'),
      photo: parseExtList('imp-ext-photo'),
      document: parseExtList('imp-ext-doc')
    };

    var endpoint = recursive ? '/api/import/folder-recursive' : '/api/import/folder';
    fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: folderPath, extensions: extensions })
    }).then(function(r) { return r.json(); }).then(function(data) {
      scanBtn.disabled = false;
      scanBtn.textContent = 'Scan';

      if (recursive && data.folders) {
        renderRecursiveScanPreview(previewEl, actionsEl, data);
      } else if (data.images) {
        renderFolderScanPreview(previewEl, actionsEl, data);
      } else if (data.error) {
        previewEl.innerHTML = '<p style="color:var(--warn)">' + esc(data.error) + '</p>';
      }
    }).catch(function(err) {
      scanBtn.disabled = false;
      scanBtn.textContent = 'Scan';
      previewEl.innerHTML = '<p style="color:var(--warn)">Error: ' + esc(String(err)) + '</p>';
    });
  }

  function renderFolderScanPreview(previewEl, actionsEl, data) {
    if (data.images.length === 0) {
      previewEl.innerHTML = '<div class="nd-card"><p class="nd-text-muted">No .img files found in ' + esc(data.path) + '</p></div>';
      return;
    }

    var newCount = 0;
    var dupeCount = 0;
    var errCount = 0;
    data.images.forEach(function(img) {
      if (img.status === 'duplicate') dupeCount++;
      else if (img.status === 'error') errCount++;
      else newCount++;
    });

    var html = '<div class="nd-card">' +
      '<h3>Scan results: ' + data.count + ' images in ' + esc(data.path) + '</h3>' +
      '<div class="nd-hero-stats" style="margin-bottom:0.75rem">' +
        ndStat(newCount, 'ready', 'ok') +
        ndStat(dupeCount, 'duplicates', 'warn') +
        ndStat(errCount, 'errors', errCount > 0 ? 'warn' : '') +
      '</div>' +
      '<div style="overflow-x:auto"><table class="nd-table nd-table-compact"><thead><tr>' +
        '<th>Filename</th><th>Volume Name</th><th>Product</th><th>Boot</th><th style="text-align:right">Size</th><th>Status</th><th>Entry</th>' +
      '</tr></thead><tbody>';

    data.images.forEach(function(img) {
      var statusBadge;
      var entryLink = '';
      if (img.status === 'duplicate' && img.existingEntry) {
        statusBadge = '<span class="nd-badge nd-badge-warn">Duplicate</span>';
        entryLink = '<a href="#/disks/' + encodeURIComponent(img.existingEntry.id) + '" class="nd-icon-btn" title="View entry">&#10132;</a>' +
          ' <a href="#/disks/' + encodeURIComponent(img.existingEntry.id) + '" class="nd-text-muted" style="font-size:0.75rem">' + esc(img.existingEntry.id) + '</a>' +
          ' <button class="nd-btn nd-btn-sm nd-btn-ghost" style="font-size:0.7rem;padding:0.1rem 0.3rem" onclick="openNdfsViewer(\'' + esc(img.existingEntry.id) + '\')">NDFS</button>';
      } else if (img.status === 'error') {
        statusBadge = '<span class="nd-badge nd-badge-warn">Error</span>';
      } else if (img.status === 'variant') {
        statusBadge = '<span class="nd-badge nd-badge-info">Variant</span>';
      } else {
        statusBadge = '<span class="nd-badge nd-badge-ok">Ready</span>';
      }

      html += '<tr>' +
        '<td><code>' + esc(img.file || '') + '</code></td>' +
        '<td>' + esc(img.volumeName || '-') + '</td>' +
        '<td>' + esc(img.productId || '-') + '</td>' +
        '<td>' + (img.bootFormat ? '<span class="nd-badge">' + esc(img.bootFormat) + '</span>' : '-') + '</td>' +
        '<td style="text-align:right">' + (img.sizeMB ? img.sizeMB + ' MB' : '-') + '</td>' +
        '<td>' + statusBadge + '</td>' +
        '<td>' + entryLink + '</td>' +
      '</tr>';
    });

    html += '</tbody></table></div>';

    // Photos, documents, unmapped
    var photos = data.photos || [];
    var docs = data.documents || [];
    var unmapped = data.unmapped || [];

    if (photos.length > 0 || docs.length > 0 || unmapped.length > 0) {
      html += '<div style="margin-top:0.75rem">';
      html += '<h4 style="font-size:0.9rem;margin-bottom:0.5rem">Other files found</h4>';
      html += '<div style="display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:0.5rem">';
      if (photos.length > 0) html += '<span class="nd-badge nd-badge-info">' + photos.length + ' photo(s): ' + photos.map(esc).join(', ') + '</span>';
      if (docs.length > 0) html += '<span class="nd-badge nd-badge-ok">' + docs.length + ' doc(s): ' + docs.map(esc).join(', ') + '</span>';
      if (unmapped.length > 0) html += '<span class="nd-badge nd-badge-patch">' + unmapped.length + ' unmapped: ' + unmapped.map(esc).join(', ') + '</span>';
      html += '</div>';

      // If images are all duplicates but there are new photos/docs, offer to attach them
      var hasNewArtifacts = photos.length > 0 || docs.length > 0;
      var allDuplicates = newCount === 0 && dupeCount > 0;
      var dupeEntryIds = data.images.filter(function(i) { return i.status === 'duplicate' && i.existingEntry; }).map(function(i) { return i.existingEntry.id; });

      if (hasNewArtifacts && allDuplicates && dupeEntryIds.length > 0) {
        html += '<button class="nd-btn nd-btn-primary nd-btn-sm" id="imp-attach-btn">Attach ' + (photos.length + docs.length) + ' file(s) to existing entr' + (dupeEntryIds.length !== 1 ? 'ies' : 'y') + '</button>';
        html += '<span id="imp-attach-status" class="nd-text-muted" style="margin-left:0.75rem"></span>';
      } else if (hasNewArtifacts && newCount > 0) {
        html += '<p class="nd-text-muted" style="font-size:0.85rem">Photos and documents will be imported with the new images.</p>';
      }
      html += '</div>';
    }

    html += '</div>';
    previewEl.innerHTML = html;

    // Wire attach button
    var attachBtn = document.getElementById('imp-attach-btn');
    if (attachBtn) {
      attachBtn.addEventListener('click', function() {
        attachBtn.disabled = true;
        attachBtn.textContent = 'Attaching...';
        var statusEl = document.getElementById('imp-attach-status');

        fetch('/api/import/attach-artifacts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sourcePath: data.path, entryIds: dupeEntryIds })
        }).then(function(r) { return r.json(); }).then(function(resp) {
          if (resp.error) {
            statusEl.textContent = 'Error: ' + resp.error;
            statusEl.style.color = 'var(--warn)';
          } else {
            statusEl.textContent = 'Attached to ' + resp.attached + ' entr' + (resp.attached !== 1 ? 'ies' : 'y');
            statusEl.style.color = 'var(--ok)';
            attachBtn.textContent = 'Done';
          }
        }).catch(function(err) {
          statusEl.textContent = 'Error: ' + String(err);
          statusEl.style.color = 'var(--warn)';
          attachBtn.disabled = false;
          attachBtn.textContent = 'Retry';
        });
      });
    }

    if (newCount > 0) {
      actionsEl.innerHTML =
        '<div class="nd-card">' +
          '<h3>Import</h3>' +
          '<p class="nd-text-muted" style="margin-bottom:0.75rem">' + newCount + ' new image(s) will be imported. ' + dupeCount + ' duplicate(s) will be skipped.</p>' +
          '<button class="nd-btn nd-btn-primary" id="imp-folder-confirm">Import ' + newCount + ' images</button>' +
          '<div id="imp-folder-result"></div>' +
        '</div>';

      document.getElementById('imp-folder-confirm').addEventListener('click', function() {
        importFolderConfirm(data.path);
      });
    }
  }

  function renderRecursiveScanPreview(previewEl, actionsEl, data) {
    if (data.folders.length === 0) {
      previewEl.innerHTML = '<div class="nd-card"><p class="nd-text-muted">No folders with .img files found in ' + esc(data.basePath) + '</p></div>';
      return;
    }

    var totalNew = data.totalNew || 0;
    var totalDup = data.totalDuplicate || 0;
    var totalAll = data.totalImages || (totalNew + totalDup);

    var html = '<div class="nd-card">' +
      '<h3>Found ' + data.totalFolders + ' folder(s) with ' + totalAll + ' image(s)</h3>';

    // Status summary
    var totalUnmapped = data.totalUnmapped || 0;
    html += '<div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem">';
    html += '<span class="nd-badge nd-badge-ok">' + totalNew + ' new</span>';
    if (totalDup > 0) html += '<span class="nd-badge nd-badge-warn">' + totalDup + ' already imported</span>';
    if (totalUnmapped > 0) html += '<span class="nd-badge nd-badge-patch">' + totalUnmapped + ' unmapped files</span>';
    html += '</div>';

    html += '<table class="nd-table nd-table-compact"><thead><tr><th>Folder</th><th style="text-align:right">New</th><th style="text-align:right">Dup</th><th style="text-align:right">Photos</th><th style="text-align:right">Docs</th><th style="text-align:right">Unmapped</th></tr></thead><tbody>';

    data.folders.forEach(function(f) {
      var rowClass = f.newCount === 0 ? ' style="opacity:0.5"' : '';
      var unmappedBadge = f.unmapped && f.unmapped.length > 0
        ? '<span class="nd-badge nd-badge-patch" title="' + f.unmapped.map(esc).join(', ') + '">' + f.unmapped.length + '</span>'
        : '-';
      html += '<tr' + rowClass + '><td><code>' + esc(f.path) + '</code></td>' +
        '<td style="text-align:right">' + (f.newCount || 0) + '</td>' +
        '<td style="text-align:right">' + (f.duplicateCount > 0 ? '<span class="nd-text-muted">' + f.duplicateCount + '</span>' : '-') + '</td>' +
        '<td style="text-align:right">' + (f.photos || 0) + '</td>' +
        '<td style="text-align:right">' + (f.documents || 0) + '</td>' +
        '<td style="text-align:right">' + unmappedBadge + '</td></tr>';
    });

    html += '</tbody></table>';

    // Show unmapped files detail if any
    if (totalUnmapped > 0) {
      html += '<details style="margin-top:0.75rem"><summary style="cursor:pointer;color:var(--warn);font-size:0.9rem">' + totalUnmapped + ' unmapped file(s) — not matching any configured extension</summary>';
      html += '<div style="margin-top:0.5rem;font-family:monospace;font-size:0.8rem;max-height:200px;overflow-y:auto;background:var(--bg-sunken);padding:0.5rem 0.75rem;border-radius:4px">';
      data.folders.forEach(function(f) {
        if (f.unmapped && f.unmapped.length > 0) {
          html += '<div style="color:var(--text-muted);margin-top:0.3rem">' + esc(f.path) + '/</div>';
          f.unmapped.forEach(function(u) {
            html += '<div style="padding-left:1rem">' + esc(u) + '</div>';
          });
        }
      });
      html += '</div></details>';
    }

    html += '</div>';
    previewEl.innerHTML = html;

    if (totalNew === 0) {
      actionsEl.innerHTML =
        '<div class="nd-card">' +
          '<h3>Nothing to import</h3>' +
          '<p class="nd-text-muted">All ' + totalAll + ' image(s) are already in the catalog.</p>' +
        '</div>';
      return;
    }

    actionsEl.innerHTML =
      '<div class="nd-card">' +
        '<h3>Import ' + totalNew + ' new image(s)</h3>' +
        '<p class="nd-text-muted" style="margin-bottom:0.75rem">' +
          totalNew + ' new image(s) from ' + data.totalFolders + ' folder(s).' +
          (totalDup > 0 ? ' ' + totalDup + ' duplicate(s) will be skipped.' : '') +
        '</p>' +
        '<button class="nd-btn nd-btn-primary" id="imp-recursive-confirm">Import ' + totalNew + ' new images</button>' +
        '<div id="imp-folder-result"></div>' +
      '</div>';

    document.getElementById('imp-recursive-confirm').addEventListener('click', function() {
      importRecursiveConfirm(data.basePath);
    });
  }

  function importFolderConfirm(folderPath) {
    var contributor = document.getElementById('imp-folder-contributor').value.trim() || 'web-import';
    var source = document.getElementById('imp-folder-source').value.trim() || 'web-import';
    var btn = document.getElementById('imp-folder-confirm');
    var resultEl = document.getElementById('imp-folder-result');

    btn.disabled = true;
    btn.innerHTML = '<span class="nd-spinner"></span> Importing...';
    resultEl.innerHTML = '';

    fetch('/api/import/folder/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: folderPath, contributor: contributor, source: source, skipDuplicates: true })
    }).then(function(r) { return r.json(); }).then(function(data) {
      if (data.error) {
        btn.disabled = false;
        btn.textContent = 'Retry import';
        resultEl.innerHTML = '<p style="color:var(--warn);margin-top:0.5rem">' + esc(data.error) + '</p>';
        return;
      }

      // Import succeeded: the button's job is done. Leave it disabled so it
      // can't be clicked to re-run the import; next steps are below.
      btn.disabled = true;
      btn.textContent = 'Imported';

      var importedCount = data.imported ? data.imported.length : 0;
      var dupeCount = data.duplicates ? data.duplicates.length : 0;
      var errCount = data.errors ? data.errors.length : 0;

      resultEl.innerHTML =
        '<div class="nd-hero-stats" style="margin-top:0.75rem">' +
          ndStat(importedCount, 'imported', 'ok') +
          ndStat(dupeCount, 'skipped', 'warn') +
          ndStat(errCount, 'errors', errCount > 0 ? 'warn' : '') +
        '</div>' +
        renderPostImportActions();

      wirePostImportActions();
    }).catch(function(err) {
      btn.disabled = false;
      btn.textContent = 'Retry import';
      resultEl.innerHTML = '<p style="color:var(--warn);margin-top:0.5rem">Error: ' + esc(String(err)) + '</p>';
    });
  }

  function importRecursiveConfirm(basePath) {
    var contributor = document.getElementById('imp-folder-contributor').value.trim() || 'web-import';
    var source = document.getElementById('imp-folder-source').value.trim() || 'web-import';
    var btn = document.getElementById('imp-recursive-confirm');
    var resultEl = document.getElementById('imp-folder-result');

    btn.disabled = true;
    btn.innerHTML = '<span class="nd-spinner"></span> Importing...';
    resultEl.innerHTML = '';

    fetch('/api/import/folder-recursive/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: basePath, contributor: contributor, source: source })
    }).then(function(r) { return r.json(); }).then(function(data) {
      if (data.error) {
        btn.disabled = false;
        btn.textContent = 'Retry import';
        resultEl.innerHTML = '<p style="color:var(--warn);margin-top:0.5rem">' + esc(data.error) + '</p>';
        return;
      }

      // Import succeeded: leave the button disabled so it can't re-run.
      btn.disabled = true;
      btn.textContent = 'Imported';

      var importedCount = data.imported ? data.imported.length : 0;
      var dupeCount = data.duplicates ? data.duplicates.length : 0;
      var errCount = data.errors ? data.errors.length : 0;

      resultEl.innerHTML =
        '<div class="nd-hero-stats" style="margin-top:0.75rem">' +
          ndStat(importedCount, 'imported', 'ok') +
          ndStat(dupeCount, 'skipped', 'warn') +
          ndStat(errCount, 'errors', errCount > 0 ? 'warn' : '') +
        '</div>' +
        (data.errors && data.errors.length > 0 ?
          '<div class="nd-import-log">' + data.errors.map(function(e) { return esc(e.file) + ': ' + esc(e.error); }).join('\n') + '</div>' : '') +
        renderPostImportActions();

      wirePostImportActions();
    }).catch(function(err) {
      btn.disabled = false;
      btn.textContent = 'Import';
      resultEl.innerHTML = '<p style="color:var(--warn);margin-top:0.5rem">Error: ' + esc(String(err)) + '</p>';
    });
  }

  // ----- Import: File upload -----
  function renderImportUpload(container) {
    container.innerHTML =
      '<div class="nd-card">' +
        '<h3>Upload .img files</h3>' +
        '<div class="nd-import-form">' +
          '<label><span>Contributor name</span>' +
            '<input class="nd-input" id="imp-upload-contributor" placeholder="e.g. Ronny Hansen">' +
          '</label>' +
          '<label><span>Source description</span>' +
            '<input class="nd-input" id="imp-upload-source" placeholder="e.g. Original floppy collection">' +
          '</label>' +
        '</div>' +
        '<div class="nd-drop-zone" id="imp-drop-zone">' +
          '<p style="font-size:1.1rem;margin-bottom:0.5rem">Drop .img files here</p>' +
          '<p>or click to browse</p>' +
          '<input type="file" id="imp-file-input" multiple accept=".img">' +
        '</div>' +
      '</div>' +
      '<div id="imp-upload-results"></div>' +
      '<div id="imp-upload-actions"></div>';

    var dropZone = document.getElementById('imp-drop-zone');
    var fileInput = document.getElementById('imp-file-input');

    dropZone.addEventListener('click', function() { fileInput.click(); });

    dropZone.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.add('nd-drag-over');
    });

    dropZone.addEventListener('dragleave', function(e) {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('nd-drag-over');
    });

    dropZone.addEventListener('drop', function(e) {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('nd-drag-over');
      if (e.dataTransfer.files.length > 0) {
        handleFileUpload(e.dataTransfer.files);
      }
    });

    fileInput.addEventListener('change', function() {
      if (this.files.length > 0) {
        handleFileUpload(this.files);
      }
    });
  }

  function handleFileUpload(files) {
    var resultsEl = document.getElementById('imp-upload-results');
    var actionsEl = document.getElementById('imp-upload-actions');
    var contributor = document.getElementById('imp-upload-contributor').value.trim() || 'web-upload';
    var source = document.getElementById('imp-upload-source').value.trim() || 'web-upload';

    resultsEl.innerHTML = '<div class="nd-card"><h3>Uploading ' + files.length + ' file(s)...</h3><div id="imp-upload-log"></div></div>';
    actionsEl.innerHTML = '';

    var logEl;
    var totalImported = 0;
    var totalDuplicates = 0;
    var totalErrors = 0;
    var pending = files.length;

    function updateLog() {
      logEl = document.getElementById('imp-upload-log');
    }

    function appendLog(msg, isError) {
      updateLog();
      if (!logEl) return;
      var line = document.createElement('div');
      line.style.fontSize = '0.85rem';
      line.style.padding = '0.2rem 0';
      if (isError) line.style.color = 'var(--warn)';
      line.textContent = msg;
      logEl.appendChild(line);
    }

    function checkDone() {
      pending--;
      if (pending <= 0) {
        var summary = '<div class="nd-hero-stats" style="margin-top:0.75rem">' +
          ndStat(totalImported, 'imported', 'ok') +
          ndStat(totalDuplicates, 'duplicates', 'warn') +
          ndStat(totalErrors, 'errors', totalErrors > 0 ? 'warn' : '') +
        '</div>';

        updateLog();
        if (logEl) {
          logEl.insertAdjacentHTML('beforebegin', summary);
        }

        if (totalImported > 0) {
          actionsEl.innerHTML = renderPostImportActions();
          wirePostImportActions();
        }
      }
    }

    for (var i = 0; i < files.length; i++) {
      (function(file) {
        var formData = new FormData();
        formData.append('image', file);
        formData.append('contributor', contributor);
        formData.append('source', source);

        appendLog('Uploading ' + file.name + '...');

        fetch('/api/import/file', {
          method: 'POST',
          body: formData
        }).then(function(r) { return r.json(); }).then(function(data) {
          if (data.error) {
            appendLog(file.name + ': Error - ' + data.error, true);
            totalErrors++;
          } else if (data.isDuplicate) {
            appendLog(file.name + ': Duplicate (exists as ' + (data.entry ? data.entry.id : 'unknown') + ')');
            totalDuplicates++;
          } else {
            appendLog(file.name + ': Imported as ' + (data.entry ? data.entry.id : 'unknown'));
            totalImported++;
          }
          checkDone();
        }).catch(function(err) {
          appendLog(file.name + ': ' + String(err), true);
          totalErrors++;
          checkDone();
        });
      })(files[i]);
    }
  }

  // ----- Post-import actions -----
  function renderPostImportActions() {
    // Import now auto-regenerates the search index and the static site
    // (http://localhost:8000) server-side, so there's no manual rebuild button.
    return '<div class="nd-import-actions">' +
      '<p class="nd-text-muted" style="margin:0.25rem 0">Catalog, search index and the local site (http://localhost:8000) were rebuilt automatically.</p>' +
    '</div>';
  }

  function wirePostImportActions() {
    var rebuildBtn = document.getElementById('imp-action-rebuild');
    var logEl = document.getElementById('imp-action-log');

    if (!rebuildBtn) return;

    function showLog(msg) {
      logEl.style.display = 'block';
      logEl.textContent += (logEl.textContent ? '\n' : '') + msg;
    }

    rebuildBtn.addEventListener('click', function() {
      rebuildBtn.disabled = true;
      rebuildBtn.innerHTML = '<span class="nd-spinner"></span> Rebuilding...';
      showLog('Rebuilding index...');

      fetch('/api/rebuild-index', { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          showLog('Index rebuilt: ' + (data.entries || 0) + ' entries');
          showLog('Rebuilding site...');
          return fetch('/api/rebuild-site', { method: 'POST' });
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          showLog('Site rebuilt successfully');
          rebuildBtn.disabled = false;
          rebuildBtn.textContent = 'Rebuild complete';
        })
        .catch(function(err) {
          showLog('Error: ' + String(err));
          rebuildBtn.disabled = false;
          rebuildBtn.textContent = 'Rebuild index + site';
        });
    });
  }

  // ==============================================================
  // Catalog
  // ==============================================================
  var catalogState = { q: '', contributor: '', status: '', filesystem: '', offset: 0, limit: 50, total: 0, debounceTimer: null, sortCol: null, sortDir: 'asc', lastEntries: [], backupSets: {}, grouped: false };

  // A backup volume on its own says little - what matters is the run it belongs
  // to. When the listing is filtered to BACKUP-SYSTEM or WINCH-TO-FLOPP volumes
  // the rows are grouped under their set, and the whole filtered list is asked
  // for in one request so a set is never cut in half by the pager.
  function catalogGroupsBySet() {
    return catalogState.filesystem === 'backup' || catalogState.filesystem === 'winch';
  }

  // Same key as setKeyOf() in lib/backupsets: a BACKUP-SYSTEM run is told apart
  // by owner, date and SINTRAN version as well as volume id, because the same
  // floppies were written again week after week (900311 and 900318 are both
  // RUNNING-POSTM).
  function backupSetKeyOf(e) {
    var s = e.backupSet;
    if (!s || !s.name) return null;
    if (s.kind === 'backup') return ['backup', s.name, s.label || '', s.runDate || '', s.system || ''].join(':');
    return s.kind + ':' + s.name + ':' + (s.label || '');
  }

  function renderCatalog(el, params) {
    catalogState.q = params.q || '';
    catalogState.contributor = params.contributor || '';
    catalogState.status = params.status || '';
    catalogState.filesystem = params.filesystem || '';
    catalogState.offset = parseInt(params.offset || '0', 10);

    el.innerHTML =
      '<div class="nd-catalog">' +
        '<div class="nd-catalog-search">' +
          '<input class="nd-input" id="cat-search" placeholder="Search floppies (volume name, product, md5...)" value="' + esc(catalogState.q) + '">' +
          '<span class="nd-text-muted" id="cat-total"></span>' +
        '</div>' +
        '<div class="nd-filter-chips" id="cat-chips">Loading filters...</div>' +
        '<div id="cat-results"><p class="nd-text-muted">Loading...</p></div>' +
        '<div class="nd-matcher-pager" id="cat-pager"></div>' +
      '</div>';

    // Load stats for filter chips
    fetch('/api/stats').then(function(r) { return r.json(); }).then(function(stats) {
      var chips = '';
      // Status chips
      [['assigned', 'Identified'], ['unassigned', 'Unidentified'], ['broken', 'Bad reads']].forEach(function(pair) { var s = pair[0]; var label = pair[1];
        var active = catalogState.status === s ? ' nd-chip-active' : '';
        chips += '<span class="nd-chip' + active + '" data-filter="status" data-val="' + s + '">' + label + '</span>';
      });
      // Contributor chips
      var contribs = Object.keys(stats.byContributor || {}).sort();
      contribs.forEach(function(c) {
        var active = catalogState.contributor === c ? ' nd-chip-active' : '';
        chips += '<span class="nd-chip' + active + '" data-filter="contributor" data-val="' + esc(c) + '">' + esc(c) + ' (' + stats.byContributor[c] + ')</span>';
      });
      document.getElementById('cat-chips').innerHTML = chips;

      // Wire chip clicks
      document.querySelectorAll('#cat-chips .nd-chip').forEach(function(chip) {
        chip.addEventListener('click', function() {
          var filter = this.getAttribute('data-filter');
          var val = this.getAttribute('data-val');
          if (filter === 'status') {
            catalogState.status = catalogState.status === val ? '' : val;
            catalogState.contributor = '';
          } else {
            catalogState.contributor = catalogState.contributor === val ? '' : val;
            catalogState.status = '';
          }
          catalogState.offset = 0;
          updateCatalogHash();
        });
      });
    });

    // Wire search -- just reload results, don't change hash (preserves focus)
    document.getElementById('cat-search').addEventListener('input', function() {
      var val = this.value.trim();
      clearTimeout(catalogState.debounceTimer);
      catalogState.debounceTimer = setTimeout(function() {
        catalogState.q = val;
        catalogState.offset = 0;
        loadCatalogResults();
      }, 300);
    });

    loadCatalogResults();
  }

  var catalogSkipRender = false;

  function updateCatalogHash() {
    var parts = ['#/catalog'];
    var qp = [];
    if (catalogState.q) qp.push('q=' + encodeURIComponent(catalogState.q));
    if (catalogState.contributor) qp.push('contributor=' + encodeURIComponent(catalogState.contributor));
    if (catalogState.status) qp.push('status=' + encodeURIComponent(catalogState.status));
    if (catalogState.filesystem) qp.push('filesystem=' + encodeURIComponent(catalogState.filesystem));
    if (catalogState.offset > 0) qp.push('offset=' + catalogState.offset);
    if (qp.length) parts.push(qp.join('&'));
    // Don't re-render the whole page, just reload results
    catalogSkipRender = true;
    location.hash = parts.join('?');
    loadCatalogResults();
  }

  function loadCatalogResults() {
    var grouped = catalogGroupsBySet();
    catalogState.grouped = grouped;
    // Grouped: ask for the lot (36 BACKUP-SYSTEM volumes, 27 WINCH ones today)
    // so every volume of a set is on the page together.
    var url = '/api/floppies?limit=' + (grouped ? 500 : catalogState.limit) +
              '&offset=' + (grouped ? 0 : catalogState.offset);
    if (catalogState.q) url += '&q=' + encodeURIComponent(catalogState.q);
    if (catalogState.contributor) url += '&contributor=' + encodeURIComponent(catalogState.contributor);
    if (catalogState.status) url += '&status=' + encodeURIComponent(catalogState.status);
    if (catalogState.filesystem) url += '&filesystem=' + encodeURIComponent(catalogState.filesystem);

    // The set facts (volume count, files named across the run) are worked out by
    // lib/backupsets on the server; asking for them beats recomputing here.
    if (grouped) {
      fetch('/api/backup-set').then(function(r) { return r.json(); }).then(function(d) {
        var map = {};
        (d.sets || []).forEach(function(st) { map[st.key] = st; });
        catalogState.backupSets = map;
        if (catalogState.lastEntries.length) renderCatalogTable(null);
      }).catch(function() { catalogState.backupSets = {}; });
    }

    fetch(url).then(function(r) { return r.json(); }).then(function(data) {
      catalogState.total = data.total;
      // Say which set is on screen: by default the catalog lists ND floppies
      // only, and the disks with no ND filesystem are reachable from here.
      var fs = catalogState.filesystem || 'ndfs';
      var fsLabel = { ndfs: 'ND floppies', dos: 'MS-DOS disks', tar: 'tar archives',
                      backup: 'BACKUP-SYSTEM volumes', winch: 'WINCH-TO-FLOPP volumes',
                      none: 'no filesystem', all: 'all media' }[fs] || fs;
      var links = ['ndfs', 'dos', 'backup', 'winch', 'tar', 'none', 'all'].filter(function(k) { return k !== fs; })
        .map(function(k) {
          var lbl = { ndfs: 'ND floppies', dos: 'MS-DOS', backup: 'BACKUP-SYSTEM', winch: 'WINCH-TO-FLOPP',
                      tar: 'tar', none: 'no filesystem', all: 'all' }[k];
          return '<a href="#/catalog?filesystem=' + k + '">' + lbl + '</a>';
        }).join(' · ');
      document.getElementById('cat-total').innerHTML = data.total + ' ' + fsLabel +
        ' <span class="nd-text-muted" style="font-size:0.85rem">(show: ' + links + ')</span>';
      renderCatalogTable(data.entries);
      renderCatalogPager();
    }).catch(function(err) {
      document.getElementById('cat-results').innerHTML = '<p style="color:var(--warn)">Error: ' + esc(String(err)) + '</p>';
    });
  }

  /**
   * The rows of a backup listing, laid out one set at a time with a heading
   * naming the run: volume id and owner, then the date, the SINTRAN version it
   * was written by, how many volumes the set has and how many files its labels
   * name. Volumes whose image records no set at all are listed last.
   */
  function catalogSetGroups(data, colCount, rowFn) {
    var order = [];
    var byKey = {};
    data.forEach(function(e) {
      var k = backupSetKeyOf(e) || '';
      if (!byKey[k]) { byKey[k] = []; order.push(k); }
      byKey[k].push(e);
    });

    order.sort(function(a, b) {
      if (a === '') return 1;
      if (b === '') return -1;
      var sa = byKey[a][0].backupSet, sb = byKey[b][0].backupSet;
      var na = (sa.name || '').toLowerCase(), nb = (sb.name || '').toLowerCase();
      if (na !== nb) return na < nb ? -1 : 1;
      return (sa.runDate || '') < (sb.runDate || '') ? -1 : 1;
    });

    var out = '';
    order.forEach(function(k) {
      var members = byKey[k];
      var head;
      if (k === '') {
        head = '<span class="nd-setname">No set recorded</span>' +
               '<span class="nd-setfacts">' + members.length + ' image(s)</span>';
      } else {
        var s0 = members[0].backupSet;
        var set = catalogState.backupSets[k];
        var facts = [];
        if (s0.runDate) facts.push(esc(s0.runDate));
        if (s0.system) facts.push(esc(s0.system));
        var vols = set ? set.totalVolumes : members.length;
        facts.push(vols + (vols === 1 ? ' volume' : ' volumes'));
        // more images than volumes means the same floppy was read more than once
        if (set && set.imageCount > set.totalVolumes) {
          facts.push((set.imageCount - set.totalVolumes) + ' repeat read(s)');
        }
        if (set && set.fileCount) facts.push(set.fileCount + (set.fileCount === 1 ? ' file' : ' files'));
        head = '<span class="nd-setname">' + esc(s0.name) + (s0.label ? ' / ' + esc(s0.label) : '') + '</span>' +
               '<span class="nd-setfacts">' + facts.join(' \u00b7 ') + '</span>';
      }
      out += '<tr class="nd-setrow"><td colspan="' + colCount + '">' + head + '</td></tr>';
      members.forEach(function(e) { out += rowFn(e); });
    });
    return out;
  }

  function renderCatalogTable(entries) {
    if (entries && entries.length > 0) catalogState.lastEntries = entries;
    var data = catalogState.lastEntries;
    if (data.length === 0) {
      document.getElementById('cat-results').innerHTML = '<div class="nd-placeholder"><h2>No results</h2><p>Try a different search or filter.</p></div>';
      return;
    }
    if (catalogState.sortCol !== null) data = sortCatalogEntries(data, catalogState.sortCol, catalogState.sortDir);

    var catCols = ['Volume Name', 'Product', 'Version', 'Boot', 'Pages', 'Files', 'Contributed by'];
    var catAligns = ['', '', '', '', 'right', 'right', ''];
    var catWidths = ['18%', '26%', '8%', '10%', '7%', '7%', '24%'];
    var html = '<table class="nd-table nd-table-compact" style="table-layout:fixed" id="cat-table">';
    html += '<colgroup>';
    catWidths.forEach(function(w) { html += '<col style="width:' + w + '">'; });
    html += '</colgroup><thead><tr>';
    for (var ci = 0; ci < catCols.length; ci++) {
      var arrow = '';
      if (catalogState.sortCol === ci) arrow = catalogState.sortDir === 'asc' ? ' \u25B2' : ' \u25BC';
      html += '<th data-col="' + ci + '"' + (catAligns[ci] ? ' style="text-align:' + catAligns[ci] + '"' : '') + '>' + catCols[ci] + arrow + '</th>';
    }
    html += '</tr></thead><tbody>';

    function catalogRow(e) {
      var volName = e.volumeName || e.volumeLabel;
      var volText = volName ? esc(volName) : '<span class="nd-text-muted">' + esc(e.id) + '</span>';
      var volDisplay = '<a href="#/disks/' + encodeURIComponent(e.id) + '"><code>' + volText + '</code></a>';
      var prodLabel = e.productId ? esc(e.productId) + (e.productName ? ' <span class="nd-text-muted" style="font-weight:normal">' + esc(e.productName) + '</span>' : '') : '';
      var prodDisplay = e.productId ? '<a href="#/products/' + encodeURIComponent(e.productId) + '">' + prodLabel + '</a>' : '<span class="nd-text-muted">-</span>';
      var bootDisplay = e.bootFormat ? '<span class="nd-badge">' + esc(e.bootFormat) + '</span>' : '-';
      return '<tr>' +
        '<td>' + volDisplay + '</td>' +
        '<td>' + prodDisplay + '</td>' +
        '<td>' + esc(e.version || '-') + '</td>' +
        '<td>' + bootDisplay + '</td>' +
        '<td style="text-align:right">' + (e.totalPages != null ? e.totalPages : '-') + '</td>' +
        '<td style="text-align:right">' + (e.fileCount || '-') + '</td>' +
        '<td>' + esc(e.contributor) + '</td>' +
      '</tr>';
    }

    if (catalogState.grouped) {
      html += catalogSetGroups(data, catCols.length, catalogRow);
    } else {
      data.forEach(function(e) { html += catalogRow(e); });
    }

    html += '</tbody></table>';
    document.getElementById('cat-results').innerHTML = html;

    // Bind sort headers
    document.querySelectorAll('#cat-table th').forEach(function(th) {
      th.addEventListener('click', function() {
        var col = parseInt(this.getAttribute('data-col'));
        if (catalogState.sortCol === col) { catalogState.sortDir = catalogState.sortDir === 'asc' ? 'desc' : 'asc'; }
        else { catalogState.sortCol = col; catalogState.sortDir = 'asc'; }
        renderCatalogTable(null);
      });
    });
  }

  function sortCatalogEntries(arr, col, dir) {
    return arr.slice().sort(function(a, b) {
      var av, bv;
      switch (col) {
        case 0: av = (a.volumeName || a.volumeLabel || a.id || '').toLowerCase(); bv = (b.volumeName || b.volumeLabel || b.id || '').toLowerCase(); break;
        case 1: av = (a.productId || '').toLowerCase(); bv = (b.productId || '').toLowerCase(); break;
        case 2: av = (a.version || '').toLowerCase(); bv = (b.version || '').toLowerCase(); break;
        case 3: av = (a.bootFormat || '').toLowerCase(); bv = (b.bootFormat || '').toLowerCase(); break;
        case 4: av = a.totalPages || 0; bv = b.totalPages || 0; return dir === 'asc' ? av - bv : bv - av;
        case 5: av = a.fileCount || 0; bv = b.fileCount || 0; return dir === 'asc' ? av - bv : bv - av;
        case 6: av = (a.contributor || '').toLowerCase(); bv = (b.contributor || '').toLowerCase(); break;
        default: av = ''; bv = '';
      }
      if (av < bv) return dir === 'asc' ? -1 : 1;
      if (av > bv) return dir === 'asc' ? 1 : -1;
      return 0;
    });
  }

  function renderCatalogPager() {
    var pager = document.getElementById('cat-pager');
    var total = catalogState.total;
    var offset = catalogState.offset;
    var limit = catalogState.limit;
    var page = Math.floor(offset / limit) + 1;
    var totalPages = Math.ceil(total / limit);

    // Grouped listings are fetched whole, so paging them would hide sets.
    if (catalogState.grouped || totalPages <= 1) {
      pager.innerHTML = '<span class="nd-text-muted">' + total + ' total</span>';
      return;
    }

    var baseHash = '#/catalog?';
    var qp = [];
    if (catalogState.q) qp.push('q=' + encodeURIComponent(catalogState.q));
    if (catalogState.contributor) qp.push('contributor=' + encodeURIComponent(catalogState.contributor));
    if (catalogState.status) qp.push('status=' + encodeURIComponent(catalogState.status));
    if (catalogState.filesystem) qp.push('filesystem=' + encodeURIComponent(catalogState.filesystem));
    var base = qp.length ? qp.join('&') + '&' : '';

    var html = '<span class="nd-text-muted">' + total + ' total · Page ' + page + '/' + totalPages + '</span> ';
    if (offset > 0) {
      html += '<a href="' + baseHash + base + 'offset=' + Math.max(0, offset - limit) + '" class="nd-btn nd-btn-ghost">Prev</a> ';
    }
    if (offset + limit < total) {
      html += '<a href="' + baseHash + base + 'offset=' + (offset + limit) + '" class="nd-btn nd-btn-ghost">Next</a>';
    }
    pager.innerHTML = html;
  }

  var productsCache = null;
  var categoriesCache = null;
  var activeCategoryFilter = null;
  var productsSortCol = null;
  var productsSortDir = 'asc';

  function renderProducts(el, params) {
    var q = params.q || '';
    el.innerHTML =
      '<div><h2 style="margin-bottom:1rem">Products' +
        '<a href="#/categories" class="nd-icon-btn nd-write-only" title="Manage categories" style="margin-left:0.5rem;font-size:1rem;vertical-align:middle">&#9881;</a>' +
      '</h2>' +
      '<div id="prod-category-chips" style="margin-bottom:0.75rem;display:flex;flex-wrap:wrap;gap:0.4rem"></div>' +
      '<div class="nd-catalog-search" style="margin-bottom:1rem">' +
        '<input class="nd-input" id="prod-search" placeholder="Search products..." value="' + esc(q) + '" style="max-width:400px">' +
        '<button class="nd-btn nd-btn-primary nd-write-only" id="prod-create-btn">+ New product</button>' +
        '<span id="prod-count" class="nd-text-muted"></span>' +
      '</div>' +
      '<div id="prod-create-form" class="nd-write-only" style="display:none;margin-bottom:1rem">' +
        '<div class="nd-card" style="max-width:500px">' +
          '<h3 style="margin-bottom:0.75rem">Create product</h3>' +
          '<div style="display:flex;flex-direction:column;gap:0.5rem">' +
            '<input class="nd-input" id="prod-new-id" placeholder="Product ID (e.g. ND-12345)">' +
            '<input class="nd-input" id="prod-new-name" placeholder="Product name">' +
            '<div style="display:flex;gap:0.5rem">' +
              '<button class="nd-btn nd-btn-primary" id="prod-new-save">Create</button>' +
              '<button class="nd-btn nd-btn-ghost" id="prod-new-cancel">Cancel</button>' +
            '</div>' +
            '<div id="prod-new-error" style="display:none;color:var(--warn);font-size:0.85rem"></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div id="products-list"><p class="nd-text-muted">Loading...</p></div>' +
      '</div>';

    // Inline edit state
    var editingId = null;

    // Load categories first, then products
    fetch('/api/categories').then(function(r) { return r.json(); }).then(function(cats) {
      categoriesCache = cats;
      renderCategoryChips();
      return fetch('/api/products').then(function(r) { return r.json(); });
    }).then(function(products) {
      productsCache = products;
      renderProductsTable(products, q);

      var debounce = null;
      document.getElementById('prod-search').addEventListener('input', function() {
        var val = this.value.trim().toLowerCase();
        clearTimeout(debounce);
        debounce = setTimeout(function() { renderProductsTable(productsCache, val); }, 200);
      });
    }).catch(function(err) {
      document.getElementById('products-list').innerHTML = '<p style="color:var(--warn)">Error: ' + esc(String(err)) + '</p>';
    });

    function renderCategoryChips() {
      var container = document.getElementById('prod-category-chips');
      if (!container || !categoriesCache) return;
      var html = '<span class="nd-chip' + (activeCategoryFilter === null ? ' nd-chip-active' : '') + '" data-cat=""' +
        ' style="cursor:pointer;display:inline-block;padding:0.2rem 0.6rem;border-radius:1rem;font-size:0.8rem;border:1px solid var(--border);background:' +
        (activeCategoryFilter === null ? 'var(--accent)' : 'var(--bg-card)') + ';color:' +
        (activeCategoryFilter === null ? '#fff' : 'var(--text)') + '">All</span>';
      categoriesCache.forEach(function(c) {
        var isActive = activeCategoryFilter === c.id;
        html += ' <span class="nd-chip' + (isActive ? ' nd-chip-active' : '') + '" data-cat="' + esc(c.id) + '"' +
          ' title="' + esc(c.description) + '"' +
          ' style="cursor:pointer;display:inline-block;padding:0.2rem 0.6rem;border-radius:1rem;font-size:0.8rem;border:1px solid var(--border);background:' +
          (isActive ? 'var(--accent)' : 'var(--bg-card)') + ';color:' +
          (isActive ? '#fff' : 'var(--text)') + '">' + esc(c.name) +
          (c.productCount > 0 ? ' <small style="opacity:0.7">' + c.productCount + '</small>' : '') +
          '</span>';
      });
      container.innerHTML = html;
      container.querySelectorAll('.nd-chip').forEach(function(chip) {
        chip.addEventListener('click', function() {
          var catId = this.getAttribute('data-cat');
          activeCategoryFilter = catId === '' ? null : catId;
          renderCategoryChips();
          if (productsCache) {
            renderProductsTable(productsCache, document.getElementById('prod-search').value.trim().toLowerCase());
          }
        });
      });
    }

    // Create product form
    document.getElementById('prod-create-btn').addEventListener('click', function() {
      document.getElementById('prod-create-form').style.display = 'block';
      document.getElementById('prod-new-id').focus();
    });
    document.getElementById('prod-new-cancel').addEventListener('click', function() {
      document.getElementById('prod-create-form').style.display = 'none';
      document.getElementById('prod-new-error').style.display = 'none';
    });
    document.getElementById('prod-new-save').addEventListener('click', function() {
      var pid = document.getElementById('prod-new-id').value.trim();
      var pname = document.getElementById('prod-new-name').value.trim();
      var errEl = document.getElementById('prod-new-error');
      if (!pid) { errEl.textContent = 'Product ID is required'; errEl.style.display = 'block'; return; }
      if (!pname) { errEl.textContent = 'Product name is required'; errEl.style.display = 'block'; return; }
      // Normalize: add ND- prefix if missing
      if (/^\d/.test(pid)) pid = 'ND-' + pid;

      fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: pid, name: pname })
      }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.error) { errEl.textContent = data.error; errEl.style.display = 'block'; return; }
        document.getElementById('prod-create-form').style.display = 'none';
        document.getElementById('prod-new-id').value = '';
        document.getElementById('prod-new-name').value = '';
        errEl.style.display = 'none';
        // Refresh list
        productsCache.push({ productId: pid, name: pname, imageCount: 0, categories: [] });
        renderProductsTable(productsCache, document.getElementById('prod-search').value.trim().toLowerCase());
      });
    });
    document.getElementById('prod-new-id').addEventListener('keydown', function(ev) {
      if (ev.key === 'Enter') document.getElementById('prod-new-name').focus();
    });
    document.getElementById('prod-new-name').addEventListener('keydown', function(ev) {
      if (ev.key === 'Enter') document.getElementById('prod-new-save').click();
      if (ev.key === 'Escape') document.getElementById('prod-new-cancel').click();
    });

    function getCategoryName(catId) {
      if (!categoriesCache) return catId;
      var found = categoriesCache.find(function(c) { return c.id === catId; });
      return found ? found.name : catId;
    }

    function sortProductsList(arr, col, dir) {
      return arr.slice().sort(function(a, b) {
        var av, bv;
        switch (col) {
          case 0: av = a.productId.toLowerCase(); bv = b.productId.toLowerCase(); break;
          case 1: av = (a.name || '').toLowerCase(); bv = (b.name || '').toLowerCase(); break;
          case 2: av = (a.platform || []).join(',').toLowerCase(); bv = (b.platform || []).join(',').toLowerCase(); break;
          case 3: av = (a.categories || []).join(',').toLowerCase(); bv = (b.categories || []).join(',').toLowerCase(); break;
          case 4: av = a.imageCount || 0; bv = b.imageCount || 0; return dir === 'asc' ? av - bv : bv - av;
          default: av = ''; bv = '';
        }
        if (av < bv) return dir === 'asc' ? -1 : 1;
        if (av > bv) return dir === 'asc' ? 1 : -1;
        return 0;
      });
    }

    function renderProductsTable(products, filter) {
      var filtered = products;
      if (filter) {
        var fl = filter.toLowerCase();
        filtered = products.filter(function(p) {
          return p.productId.toLowerCase().includes(fl) || p.name.toLowerCase().includes(fl);
        });
      }
      // Apply category filter
      if (activeCategoryFilter) {
        filtered = filtered.filter(function(p) {
          return p.categories && p.categories.indexOf(activeCategoryFilter) !== -1;
        });
      }

      // Sort
      if (productsSortCol !== null) filtered = sortProductsList(filtered, productsSortCol, productsSortDir);

      document.getElementById('prod-count').textContent = filtered.length + ' of ' + products.length + ' products';

      var pCols = ['Product ID', 'Name', 'Platform', 'Categories', 'Images', ''];
      var pWidths = ['13%', '35%', '13%', '20%', '9%', '10%'];
      var pAligns = ['', '', '', '', 'right', 'right'];
      var html = '<table class="nd-table nd-table-compact" style="table-layout:fixed" id="prod-table">';
      html += '<colgroup>';
      pWidths.forEach(function(w) { html += '<col style="width:' + w + '">'; });
      html += '</colgroup><thead><tr>';
      for (var pi = 0; pi < pCols.length; pi++) {
        var parr = '';
        if (productsSortCol === pi && pi < 5) parr = productsSortDir === 'asc' ? ' \u25B2' : ' \u25BC';
        html += '<th data-col="' + pi + '"' + (pAligns[pi] ? ' style="text-align:' + pAligns[pi] + '"' : '') + (pi >= 5 ? ' style="cursor:default"' : '') + '>' + pCols[pi] + parr + '</th>';
      }
      html += '</tr></thead><tbody>';

      filtered.forEach(function(p) {
        var nameDisplay = (p.name === p.productId || !p.name)
          ? '<span class="nd-text-muted" style="font-style:italic">unnamed</span>'
          : esc(p.name);
        if (p.description) nameDisplay += '<br><span class="nd-text-muted" style="font-size:0.75rem">' + esc(p.description) + '</span>';

        var platChips = '';
        if (p.platform && p.platform.length > 0) {
          p.platform.forEach(function(pl) { platChips += '<span class="nd-badge" style="font-size:0.65rem;margin-right:0.2rem">' + esc(pl) + '</span>'; });
        }

        var catChips = '';
        if (p.categories && p.categories.length > 0) {
          p.categories.forEach(function(catId) {
            catChips += '<span class="nd-cat-chip" data-cat="' + esc(catId) + '" style="cursor:pointer;display:inline-block;padding:0.1rem 0.4rem;border-radius:0.75rem;font-size:0.7rem;background:var(--bg-card);border:1px solid var(--border);margin-right:0.2rem" title="' + esc(getCategoryName(catId)) + '">' + esc(catId) + '</span>';
          });
        }

        // "(unmatched)" is a synthetic grouping, not a real product -- offer a Review
        // shortcut into the Matcher instead of edit/view actions.
        var isRealProduct = p.productId !== '(unmatched)';
        var actionIcons = isRealProduct
          ? '<button class="nd-icon-btn nd-write-only nd-prod-edit-btn" title="Edit product">&#9998;</button> ' +
            '<a href="#/products/' + encodeURIComponent(p.productId) + '" class="nd-icon-btn" title="View product">&#10132;</a>'
          : '<a href="#/match?mode=manual" class="nd-btn nd-btn-ghost nd-btn-sm nd-write-only" title="Review and assign these floppies in the Matcher">Review &#10132;</a>';

        // Icons: pencil for edit, arrow-right for navigate
        html += '<tr data-pid="' + esc(p.productId) + '">' +
          '<td><code>' + esc(p.productId) + '</code></td>' +
          '<td class="nd-prod-name-cell">' + nameDisplay + '</td>' +
          '<td>' + platChips + '</td>' +
          '<td class="nd-prod-cat-cell">' + catChips + '</td>' +
          '<td style="text-align:right">' + p.imageCount + '</td>' +
          '<td style="text-align:right;white-space:nowrap">' + actionIcons + '</td></tr>';
      });

      html += '</tbody></table>';
      document.getElementById('products-list').innerHTML = html;

      // Wire sort headers
      document.querySelectorAll('#prod-table th').forEach(function(th) {
        th.addEventListener('click', function() {
          var col = parseInt(this.getAttribute('data-col'));
          if (col >= 5) return; // skip actions column
          if (productsSortCol === col) { productsSortDir = productsSortDir === 'asc' ? 'desc' : 'asc'; }
          else { productsSortCol = col; productsSortDir = 'asc'; }
          renderProductsTable(productsCache, document.getElementById('prod-search').value.trim().toLowerCase());
        });
      });

      // Wire category chip clicks in table to filter
      document.querySelectorAll('.nd-cat-chip').forEach(function(chip) {
        chip.addEventListener('click', function(ev) {
          ev.stopPropagation();
          activeCategoryFilter = this.getAttribute('data-cat');
          renderCategoryChips();
          renderProductsTable(productsCache, document.getElementById('prod-search').value.trim().toLowerCase());
        });
      });

      // Wire edit buttons
      document.querySelectorAll('.nd-prod-edit-btn').forEach(function(btn) {
        btn.addEventListener('click', function(ev) {
          ev.stopPropagation();
          var row = this.closest('tr');
          var pid = row.getAttribute('data-pid');
          var nameCell = row.querySelector('.nd-prod-name-cell');
          var catCell = row.querySelector('.nd-prod-cat-cell');
          var currentProd = productsCache.find(function(p) { return p.productId === pid; });
          var curName = currentProd ? currentProd.name : '';
          if (curName === pid) curName = '';
          var curCats = (currentProd && currentProd.categories) ? currentProd.categories : [];

          var curDesc = (currentProd && currentProd.description) ? currentProd.description : '';
          var curPlatform = (currentProd && currentProd.platform) ? currentProd.platform : [];

          // Replace the entire row with an edit form spanning all columns
          var editHtml = '<td colspan="5" style="padding:0.75rem">' +
            '<div style="display:flex;flex-direction:column;gap:0.5rem;max-width:600px">' +
              '<div style="display:flex;gap:0.5rem">' +
                '<input class="nd-input nd-prod-edit-input" value="' + esc(curName) + '" style="flex:1;font-size:0.85rem" placeholder="Product name">' +
              '</div>' +
              '<input class="nd-input nd-prod-edit-desc" value="' + esc(curDesc) + '" style="font-size:0.85rem" placeholder="Description">' +
              '<div style="display:flex;gap:1rem;flex-wrap:wrap;font-size:0.8rem">' +
                '<span style="color:var(--text-muted)">Platform:</span>' +
                '<label style="cursor:pointer"><input type="checkbox" class="nd-prod-plat-cb" value="100"' + (curPlatform.indexOf('100') !== -1 ? ' checked' : '') + '> 100</label>' +
                '<label style="cursor:pointer"><input type="checkbox" class="nd-prod-plat-cb" value="500"' + (curPlatform.indexOf('500') !== -1 ? ' checked' : '') + '> 500</label>' +
                '<label style="cursor:pointer"><input type="checkbox" class="nd-prod-plat-cb" value="PC"' + (curPlatform.indexOf('PC') !== -1 ? ' checked' : '') + '> PC</label>' +
              '</div>' +
              '<div style="display:flex;gap:0.3rem;flex-wrap:wrap;font-size:0.78rem">' +
                '<span style="color:var(--text-muted)">Categories:</span>';

          if (categoriesCache) {
            categoriesCache.forEach(function(c) {
              var checked = curCats.indexOf(c.id) !== -1 ? ' checked' : '';
              editHtml += '<label style="cursor:pointer"><input type="checkbox" class="nd-prod-cat-cb" value="' + esc(c.id) + '"' + checked + '> ' + esc(c.id) + '</label>';
            });
          }

          editHtml += '</div>' +
              '<div style="display:flex;gap:0.5rem;align-items:center">' +
                '<button class="nd-btn nd-btn-primary nd-btn-sm nd-prod-save-btn">Save</button>' +
                '<button class="nd-btn nd-btn-ghost nd-btn-sm nd-prod-cancel-btn">Cancel</button>' +
                (pid === '(unmatched)' ? '' : '<button class="nd-btn nd-btn-ghost nd-btn-sm nd-prod-changeid-btn">Change ID&hellip;</button>') +
                '<span style="flex:1"></span>' +
                '<button class="nd-btn nd-btn-sm nd-prod-delete-btn" style="color:var(--warn);border-color:var(--warn)">Delete product</button>' +
              '</div>' +
            '</div>' +
          '</td>';
          row.innerHTML = editHtml;

          var input = row.querySelector('.nd-prod-edit-input');
          input.focus();
          input.select();

          row.querySelector('.nd-prod-save-btn').addEventListener('click', function() {
            var newName = input.value.trim();
            if (!newName) return;
            var newDesc = row.querySelector('.nd-prod-edit-desc').value.trim();
            var newCats = [];
            row.querySelectorAll('.nd-prod-cat-cb:checked').forEach(function(cb) { newCats.push(cb.value); });
            var newPlatform = [];
            row.querySelectorAll('.nd-prod-plat-cb:checked').forEach(function(cb) { newPlatform.push(cb.value); });
            fetch('/api/products', {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: pid, name: newName, description: newDesc || null, categories: newCats, platform: newPlatform })
            }).then(function(r) { return r.json(); }).then(function(data) {
              if (data.success) {
                var p = productsCache.find(function(x) { return x.productId === pid; });
                if (p) { p.name = newName; p.description = newDesc; p.categories = newCats; p.platform = newPlatform; }
                renderProductsTable(productsCache, document.getElementById('prod-search').value.trim().toLowerCase());
              }
            });
          });

          row.querySelector('.nd-prod-cancel-btn').addEventListener('click', function() {
            renderProductsTable(productsCache, document.getElementById('prod-search').value.trim().toLowerCase());
          });

          var changeIdRowBtn = row.querySelector('.nd-prod-changeid-btn');
          if (changeIdRowBtn) changeIdRowBtn.addEventListener('click', function() {
            var newId = prompt('New product ID for ' + pid + ':', '');
            if (newId == null) return;
            newId = newId.trim();
            if (!newId) return;
            previewRenameProductId(pid, newId); // shows affected floppies + confirmation
          });

          row.querySelector('.nd-prod-delete-btn').addEventListener('click', function() {
            if (!confirm('Delete product ' + pid + '? This cannot be undone.')) return;
            fetch('/api/products', {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: pid })
            }).then(function(r) { return r.json(); }).then(function(data) {
              if (data.success) {
                productsCache = productsCache.filter(function(x) { return x.productId !== pid; });
                renderProductsTable(productsCache, document.getElementById('prod-search').value.trim().toLowerCase());
              }
            });
          });

          input.addEventListener('keydown', function(ev) {
            if (ev.key === 'Enter') nameCell.querySelector('.nd-prod-save-btn').click();
            if (ev.key === 'Escape') nameCell.querySelector('.nd-prod-cancel-btn').click();
          });
        });
      });
    }
  }

  // ==============================================================
  // Categories management page
  // ==============================================================
  function renderCategories(el) {
    el.innerHTML = '<div><h2 style="margin-bottom:1rem">Category Management</h2>' +
      '<p class="nd-text-muted" style="margin-bottom:1rem"><a href="#/products">Back to Products</a></p>' +
      '<div class="nd-card" style="max-width:600px;margin-bottom:1.5rem">' +
        '<h3 style="margin-bottom:0.75rem">Add Category</h3>' +
        '<div style="display:flex;flex-direction:column;gap:0.5rem">' +
          '<input class="nd-input" id="cat-new-id" placeholder="Category ID (e.g. networking)">' +
          '<input class="nd-input" id="cat-new-name" placeholder="Category name">' +
          '<input class="nd-input" id="cat-new-desc" placeholder="Description">' +
          '<div style="display:flex;gap:0.5rem">' +
            '<button class="nd-btn nd-btn-primary" id="cat-new-save">Add</button>' +
          '</div>' +
          '<div id="cat-new-error" style="display:none;color:var(--warn);font-size:0.85rem"></div>' +
        '</div>' +
      '</div>' +
      '<div id="cat-list"><p class="nd-text-muted">Loading...</p></div>' +
      '</div>';

    var catData = [];

    function loadAndRender() {
      fetch('/api/categories').then(function(r) { return r.json(); }).then(function(cats) {
        catData = cats;
        renderCatTable();
      }).catch(function(err) {
        document.getElementById('cat-list').innerHTML = '<p style="color:var(--warn)">Error: ' + esc(String(err)) + '</p>';
      });
    }

    function renderCatTable() {
      var html = '<table class="nd-table nd-table-compact"><thead><tr>' +
        '<th>ID</th><th>Name</th><th>Description</th><th style="text-align:right">Products</th><th style="width:8rem"></th>' +
        '</tr></thead><tbody>';
