name: IA Verify

# Manual only. The weekly schedule was removed on 15-OCT-2026: nothing has been
# uploaded to Internet Archive yet and the ia-verify CLI command is a stub, so a
# scheduled run has nothing to check. Put the schedule back when the IA sync is
# planned and implemented.
on:
  workflow_dispatch:       # Allow manual trigger

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Internet Archive CLI
        run: pip install internetarchive

      - name: Configure IA credentials
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          mkdir -p ~/.config/internetarchive
          cat > ~/.config/internetarchive/ia.ini << IAEOF
          [s3]
          access = ${IA_ACCESS_KEY}
          secret = ${IA_SECRET_KEY}
          IAEOF

      - name: Install dependencies
        working-directory: tools
        run: npm install

      - name: Build tools
        working-directory: tools
        run: npm run build

      - name: Verify Internet Archive checksums
        run: make ia-verify
